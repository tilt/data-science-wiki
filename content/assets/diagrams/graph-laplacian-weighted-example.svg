<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Weighted graph, adjacency matrix, degree matrix, and graph Laplacian</title>
  <desc id="desc">A four-node weighted graph with edge weights. The adjacency matrix stores edge weights, the degree matrix stores row sums on the diagonal, and the graph Laplacian is D minus W.</desc>
  <style>
    .fg { fill: #111827; }
    .muted { fill: #4b5563; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
    .edge { stroke: #64748b; stroke-width: 3; }
    .strong-edge { stroke: #2563eb; stroke-width: 5; }
    .node { fill: #f8fafc; stroke: #2563eb; stroke-width: 3; }
    .node-text { fill: #111827; font-weight: 700; }
    .weight-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .accent { fill: #2563eb; }
    .bracket { fill: none; stroke: #111827; stroke-width: 2.3; stroke-linecap: square; }
    .matrix { font-family: "Courier New", monospace; }
    text { font-family: Arial, sans-serif; }
  </style>
  <rect width="920" height="520" fill="transparent"/>
  <text x="460" y="36" text-anchor="middle" font-size="23" font-weight="700" class="fg">Graph Laplacian from edge weights</text>
  <text x="460" y="62" text-anchor="middle" font-size="14" class="muted">The degree is the total incident edge weight; the Laplacian compares a node with its weighted neighbors.</text>

  <g transform="translate(38,88)">
    <rect width="318" height="348" rx="8" class="panel"/>
    <text x="159" y="30" text-anchor="middle" font-size="17" font-weight="700" class="fg">weighted graph</text>
    <line x1="92" y1="92" x2="228" y2="72" class="edge"/>
    <line x1="92" y1="92" x2="162" y2="230" class="edge"/>
    <line x1="228" y1="72" x2="162" y2="230" class="strong-edge"/>
    <line x1="162" y1="230" x2="268" y2="164" class="edge"/>

    <g>
      <rect x="145" y="66" width="30" height="22" rx="4" class="weight-bg"/>
      <text x="160" y="82" text-anchor="middle" font-size="13" font-weight="700" class="fg">2</text>
      <rect x="98" y="154" width="30" height="22" rx="4" class="weight-bg"/>
      <text x="113" y="170" text-anchor="middle" font-size="13" font-weight="700" class="fg">1</text>
      <rect x="182" y="140" width="30" height="22" rx="4" class="weight-bg"/>
      <text x="197" y="156" text-anchor="middle" font-size="13" font-weight="700" class="fg">3</text>
      <rect x="210" y="192" width="30" height="22" rx="4" class="weight-bg"/>
      <text x="225" y="208" text-anchor="middle" font-size="13" font-weight="700" class="fg">2</text>
    </g>

    <g>
      <circle cx="92" cy="92" r="24" class="node"/><text x="92" y="98" text-anchor="middle" font-size="18" class="node-text">1</text>
      <circle cx="228" cy="72" r="24" class="node"/><text x="228" y="78" text-anchor="middle" font-size="18" class="node-text">2</text>
      <circle cx="162" cy="230" r="24" class="node"/><text x="162" y="236" text-anchor="middle" font-size="18" class="node-text">3</text>
      <circle cx="268" cy="164" r="24" class="node"/><text x="268" y="170" text-anchor="middle" font-size="18" class="node-text">4</text>
    </g>

    <text x="159" y="306" text-anchor="middle" font-size="13" class="muted">node degrees: d1=3, d2=5, d3=6, d4=2</text>
    <text x="159" y="328" text-anchor="middle" font-size="13" class="muted">example: d3 = 1 + 3 + 2 = 6</text>
  </g>

  <g transform="translate(386,88)">
    <rect width="226" height="348" rx="8" class="panel"/>
    <text x="113" y="30" text-anchor="middle" font-size="17" font-weight="700" class="fg">matrices</text>
    <text x="30" y="70" font-size="15" font-weight="700" class="fg">W</text>
    <text x="58" y="70" font-size="14" class="muted">adjacency / weights</text>
    <path d="M31 86 H39 M31 86 V188 M31 188 H39" class="bracket"/>
    <text x="66" y="104" font-size="15" class="fg matrix">0 2 1 0</text>
    <text x="66" y="130" font-size="15" class="fg matrix">2 0 3 0</text>
    <text x="66" y="156" font-size="15" class="fg matrix">1 3 0 2</text>
    <text x="66" y="182" font-size="15" class="fg matrix">0 0 2 0</text>
    <path d="M148 86 H156 M156 86 V188 M148 188 H156" class="bracket"/>

    <text x="30" y="224" font-size="15" font-weight="700" class="fg">D</text>
    <text x="58" y="224" font-size="14" class="muted">degree matrix</text>
    <path d="M31 240 H39 M31 240 V342 M31 342 H39" class="bracket"/>
    <text x="66" y="258" font-size="15" class="fg matrix">3 0 0 0</text>
    <text x="66" y="284" font-size="15" class="fg matrix">0 5 0 0</text>
    <text x="66" y="310" font-size="15" class="fg matrix">0 0 6 0</text>
    <text x="66" y="336" font-size="15" class="fg matrix">0 0 0 2</text>
    <path d="M148 240 H156 M156 240 V342 M148 342 H156" class="bracket"/>
  </g>

  <g transform="translate(642,88)">
    <rect width="238" height="348" rx="8" class="panel"/>
    <text x="119" y="30" text-anchor="middle" font-size="17" font-weight="700" class="fg">L = D - W</text>
    <path d="M34 60 H42 M34 60 V168 M34 168 H42" class="bracket"/>
    <text x="70" y="78" font-size="15" class="fg matrix"> 3 -2 -1  0</text>
    <text x="70" y="106" font-size="15" class="fg matrix">-2  5 -3  0</text>
    <text x="70" y="134" font-size="15" class="fg matrix">-1 -3  6 -2</text>
    <text x="70" y="162" font-size="15" class="fg matrix"> 0  0 -2  2</text>
    <path d="M174 60 H182 M182 60 V168 M174 168 H182" class="bracket"/>
    <text x="119" y="214" text-anchor="middle" font-size="14" font-weight="700" class="accent">diagonal = degree</text>
    <text x="119" y="242" text-anchor="middle" font-size="13" class="muted">off-diagonal = negative edge weight</text>
    <text x="119" y="278" text-anchor="middle" font-size="13" class="muted">large edge weights penalize</text>
    <text x="119" y="300" text-anchor="middle" font-size="13" class="muted">different node values more strongly</text>
  </g>
</svg>
