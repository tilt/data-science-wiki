  <text x="566.8" y="406" text-anchor="middle" font-size="13" fill="#4b5563">8</text>
  <text x="690.0" y="406" text-anchor="middle" font-size="13" fill="#4b5563">10</text>
  <text x="62" y="388.0" text-anchor="end" font-size="13" fill="#4b5563">0.0</text>
  <text x="62" y="286.0" text-anchor="end" font-size="13" fill="#4b5563">1.0</text>
  <text x="62" y="184.0" text-anchor="end" font-size="13" fill="#4b5563">2.0</text>
