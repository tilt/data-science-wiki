<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">BM25 term-frequency saturation</title>
  <desc id="desc">BM25 gives diminishing returns to repeated query terms: its term-frequency contribution rises quickly for the first few occurrences and then flattens toward k1 plus 1, unlike a raw term frequency that grows without bound.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#4b5563"], [fill="#374151"] { fill: #cbd5e1 !important; }
      [stroke="#e5e7eb"] { stroke: #334155 !important; }
      [stroke="#111827"] { stroke: #e5e7eb !important; }
    }
    :root[data-theme="dark"] text { fill: #f8fafc !important; }
    :root[data-theme="dark"] [fill="#111827"], :root[data-theme="dark"] [fill="#4b5563"], :root[data-theme="dark"] [fill="#374151"] { fill: #cbd5e1 !important; }
    :root[data-theme="dark"] [stroke="#e5e7eb"] { stroke: #334155 !important; }
    :root[data-theme="dark"] [stroke="#111827"] { stroke: #e5e7eb !important; }
  </style>
  <rect width="720" height="460" fill="transparent"/>
  <text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">BM25 saturates repeated term matches</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">The fourth occurrence of a word adds far less than the first.</text>
