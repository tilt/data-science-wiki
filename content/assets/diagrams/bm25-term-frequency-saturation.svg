  <line x1="74" y1="78.0" x2="690" y2="78.0" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="74" y1="78" x2="74" y2="384" stroke="#111827" stroke-width="1.5"/>
    <line x1="74" y1="384" x2="690" y2="384" stroke="#111827" stroke-width="1.5"/>
  <text x="74.0" y="406" text-anchor="middle" font-size="13" fill="#4b5563">0</text>
  <text x="197.2" y="406" text-anchor="middle" font-size="13" fill="#4b5563">2</text>
