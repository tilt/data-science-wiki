<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">R-squared compares fit residuals with deviations from the mean</title>
  <desc id="desc">Five points with a dashed mean line at y equals 4 and a solid fitted line y-hat equals 2.2 plus 0.6 x. Points sit closer to the fitted line than to the mean line, giving R-squared equal to 0.6.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .small { font-size: 15px; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .grid { stroke: #eef2f7; stroke-width: 1; }
    .fit { stroke: #2563eb; stroke-width: 3.5; }
    .mean { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .resid { stroke: #f97316; stroke-width: 2; stroke-dasharray: 5 4; }
    .pt { fill: #16a34a; }
  </style>

  <text x="320" y="34" text-anchor="middle" font-size="24" font-weight="800">R-squared: how much better than the mean?</text>
  <text x="320" y="60" text-anchor="middle" font-size="16" class="muted">Residuals to the fit (orange) are smaller than deviations from the mean line.</text>

  <!-- gridlines -->
  <line class="grid" x1="80" y1="273.3" x2="600" y2="273.3"/>
  <line class="grid" x1="80" y1="113.3" x2="600" y2="113.3"/>
  <!-- axes -->
  <line class="axis" x1="80" y1="380" x2="600" y2="380"/>
  <line class="axis" x1="80" y1="72" x2="80" y2="380"/>

  <!-- mean line y = 4 -->
  <line class="mean" x1="123.3" y1="166.7" x2="556.7" y2="166.7"/>
  <text x="560" y="160" text-anchor="end" class="small" fill="#7e22ce">mean ȳ = 4</text>

  <!-- fitted line y = 2.2 + 0.6 x -->
  <line class="fit" x1="123.3" y1="246.7" x2="556.7" y2="86.7"/>

  <!-- residual segments to the fitted line -->
  <line class="resid" x1="166.7" y1="273.3" x2="166.7" y2="230.7"/>
  <line class="resid" x1="253.3" y1="166.7" x2="253.3" y2="198.7"/>
  <line class="resid" x1="340" y1="113.3" x2="340" y2="166.7"/>
  <line class="resid" x1="426.7" y1="166.7" x2="426.7" y2="134.7"/>
  <line class="resid" x1="513.3" y1="113.3" x2="513.3" y2="102.7"/>

  <!-- data points -->
  <circle class="pt" cx="166.7" cy="273.3" r="6.5"/>
  <circle class="pt" cx="253.3" cy="166.7" r="6.5"/>
  <circle class="pt" cx="340" cy="113.3" r="6.5"/>
  <circle class="pt" cx="426.7" cy="166.7" r="6.5"/>
  <circle class="pt" cx="513.3" cy="113.3" r="6.5"/>

  <!-- axis labels -->
  <text x="600" y="404" text-anchor="end" class="small muted">feature x</text>
  <text x="64" y="80" text-anchor="end" class="small muted">y</text>

  <!-- annotation -->
  <text x="300" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">R² = 1 − 2.4 / 6 = 0.6</text>
</svg>
