<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Law of large numbers running mean</title>
  <desc id="desc">A Bernoulli running mean starts noisy and settles near the expectation 0.37 as sample size grows.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 24px; font-weight: 800; }
    .subtitle, .tick, .axis-label { fill: #374151; }
    .subtitle { font-size: 14px; }
    .tick { font-size: 12px; }
    .axis-label { font-size: 14px; }
    .axis { stroke: #111827; stroke-width: 1.5; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .expectation { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 6; }
    .series { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .point { fill: #2563eb; }
  </style>
  <text x="390" y="36" text-anchor="middle" class="title">Running means stabilize around the expectation</text>
  <text x="390" y="60" text-anchor="middle" class="subtitle">Bernoulli samples with p = 0.37: early averages move sharply, later averages move slowly.</text>
  <line x1="120" y1="338" x2="700" y2="338" class="axis"/>
  <line x1="120" y1="86" x2="120" y2="338" class="axis"/>
  <g class="grid">
    <line x1="120" y1="288" x2="700" y2="288"/>
    <line x1="120" y1="237" x2="700" y2="237"/>
    <line x1="120" y1="187" x2="700" y2="187"/>
    <line x1="120" y1="136" x2="700" y2="136"/>
    <line x1="120" y1="86" x2="700" y2="86"/>
  </g>
  <line x1="120" y1="217" x2="700" y2="217" class="expectation"/>
  <path d="M120 86 L265 177 L410 236 L555 221 L700 220" class="series"/>
  <g class="point">
    <circle cx="120" cy="86" r="5"/>
    <circle cx="265" cy="177" r="5"/>
    <circle cx="410" cy="236" r="5"/>
    <circle cx="555" cy="221" r="5"/>
    <circle cx="700" cy="220" r="5"/>
  </g>
  <g class="tick">
    <text x="120" y="360" text-anchor="middle">10</text>
    <text x="265" y="360" text-anchor="middle">100</text>
    <text x="410" y="360" text-anchor="middle">1k</text>
    <text x="555" y="360" text-anchor="middle">10k</text>
    <text x="700" y="360" text-anchor="middle">100k</text>
    <text x="410" y="395" text-anchor="middle" class="axis-label">sample size n (log scale)</text>
    <text x="98" y="90" text-anchor="end">0.50</text>
    <text x="98" y="140" text-anchor="end">0.45</text>
    <text x="98" y="191" text-anchor="end">0.40</text>
    <text x="98" y="241" text-anchor="end">0.35</text>
    <text x="98" y="292" text-anchor="end">0.30</text>
    <text x="98" y="342" text-anchor="end">0.25</text>
    <text x="42" y="212" text-anchor="middle" transform="rotate(-90 42 212)" class="axis-label">running mean</text>
    <text x="620" y="209" font-size="13" fill="#dc2626">E[X] = 0.37</text>
  </g>
</svg>
