<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">k-nearest neighbors classifies a query by local neighbor votes</title>
  <desc id="desc">A query point is surrounded by its five nearest neighbors. Three blue neighbors and two orange neighbors vote, so the query is classified as blue. An orange-red dashed decision boundary runs between the blue and orange training examples. A small panel shows that small k gives jagged boundaries while larger k smooths the decision rule.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 22px; font-weight: 800; }
    .subtitle, .muted, .axis-label { fill: #374151; }
    .subtitle { font-size: 14px; }
    .muted { font-size: 12px; }
    .axis-label { font-size: 13px; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .blue { fill: #2563eb; }
    .orange { fill: #f97316; }
    .query { fill: #111827; stroke: #ffffff; stroke-width: 2.2; }
    .radius { fill: #2563eb; fill-opacity: 0.08; stroke: #2563eb; stroke-width: 2.3; stroke-dasharray: 8 6; }
    .near { stroke: #111827; stroke-width: 2.2; fill: none; }
    .vote-box { fill: #eef2ff; stroke: #64748b; stroke-width: 1.1; }
    .boundary { fill: none; stroke: #ef4444; stroke-width: 2.6; stroke-dasharray: 7 6; }
    .smooth { fill: none; stroke: #14b8a6; stroke-width: 3; }
    .label { font-size: 13px; font-weight: 700; }
  </style>

  <text x="380" y="36" text-anchor="middle" class="title">k-nearest neighbors: local votes around the query</text>
  <text x="380" y="62" text-anchor="middle" class="subtitle">Prediction happens at query time: find the closest training examples, then vote.</text>

  <g transform="translate(52,92)">
    <rect width="420" height="294" rx="8" class="panel"/>
    <line x1="42" y1="250" x2="380" y2="250" class="axis"/>
    <line x1="42" y1="40" x2="42" y2="250" class="axis"/>
    <g class="grid">
      <line x1="126" y1="40" x2="126" y2="250"/>
      <line x1="210" y1="40" x2="210" y2="250"/>
      <line x1="294" y1="40" x2="294" y2="250"/>
      <line x1="42" y1="110" x2="380" y2="110"/>
      <line x1="42" y1="180" x2="380" y2="180"/>
    </g>

    <circle cx="218" cy="148" r="92" class="radius"/>
    <path d="M136 54 C174 78 222 72 242 101 C261 129 231 144 244 167 C257 190 254 214 235 232 C219 247 195 253 168 250" class="boundary"/>

    <g class="blue">
      <circle cx="116" cy="87" r="8"/><circle cx="148" cy="126" r="8"/><circle cx="178" cy="162" r="8"/>
      <circle cx="213" cy="102" r="8"/><circle cx="232" cy="205" r="8"/><circle cx="94" cy="190" r="8"/>
    </g>
    <g class="orange">
      <circle cx="264" cy="114" r="8"/><circle cx="288" cy="154" r="8"/><circle cx="316" cy="197" r="8"/>
      <circle cx="338" cy="92" r="8"/><circle cx="346" cy="228" r="8"/>
    </g>

    <circle cx="218" cy="148" r="10" class="query"/>
    <g class="near">
      <circle cx="178" cy="162" r="13"/>
      <circle cx="213" cy="102" r="13"/>
      <circle cx="232" cy="205" r="13"/>
      <circle cx="264" cy="114" r="13"/>
      <circle cx="288" cy="154" r="13"/>
    </g>
    <text x="218" y="278" text-anchor="middle" class="axis-label">k = 5 nearest points decide this query</text>
  </g>

  <g transform="translate(504,108)">
    <rect width="202" height="110" rx="8" class="vote-box"/>
    <text x="101" y="26" text-anchor="middle" class="label">neighbor vote</text>
    <circle cx="38" cy="52" r="7" class="blue"/><text x="56" y="56" class="axis-label">blue: 3</text>
    <circle cx="38" cy="78" r="7" class="orange"/><text x="56" y="82" class="axis-label">orange: 2</text>
    <text x="101" y="102" text-anchor="middle" class="label">predict blue</text>
  </g>

  <g transform="translate(504,246)">
    <rect width="202" height="110" rx="8" class="panel"/>
    <text x="101" y="25" text-anchor="middle" class="label">effect of k</text>
    <path d="M24 78 C42 45 56 86 76 54 C94 24 116 86 136 56 C154 30 172 64 184 42" class="boundary"/>
    <path d="M24 83 C62 68 90 56 118 53 C146 50 166 43 184 34" class="smooth"/>
    <text x="46" y="91" text-anchor="middle" class="muted">small k</text>
    <text x="46" y="105" text-anchor="middle" class="muted">jagged</text>
    <text x="154" y="91" text-anchor="middle" class="muted">large k</text>
    <text x="154" y="105" text-anchor="middle" class="muted">smooth</text>
  </g>
</svg>
