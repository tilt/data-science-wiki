<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">Normalized SQL schema compared with an analytical star schema</title>
  <desc id="desc">A normalized SQL schema separates customers, addresses, orders, order lines, products, categories, payments, and shipments. This protects update integrity but creates more joins for analytical queries.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .bg { fill: #f8fafc; }
    .muted { fill: #4b5563; }
    .table-title { font-weight: 700; }
    .field { font-size: 13px; }
    .entity { fill: #eff6ff; stroke: #2563eb; }
    .bridge { fill: #fdf2f8; stroke: #db2777; }
    .note { fill: #fff7ed; stroke: #f97316; }
    .rule { stroke: #d8dee9; }
    .link { stroke: #374151; }
    .arrow-head { fill: #374151; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .bg { fill: #181a1b; }
      .muted { fill: #d1d5db; }
      .entity { fill: #172554; stroke: #8ab4ff; }
      .bridge { fill: #4a044e; stroke: #f0abfc; }
      .note { fill: #431407; stroke: #fb923c; }
      .rule { stroke: #334155; }
      .link { stroke: #e5e7eb; }
      .arrow-head { fill: #e5e7eb; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path class="arrow-head" d="M0,0 L0,6 L9,3 z"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="640" rx="16"/>
  <text x="490" y="42" text-anchor="middle" font-size="26" font-weight="700">Normalized SQL schemas protect operational integrity</text>
  <text x="490" y="72" text-anchor="middle" font-size="15" class="muted">Attributes are stored once, but analytics often crosses many relationships before aggregation.</text>

  <g class="link" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M230 172 L330 172"/>
    <path d="M570 172 L670 172"/>
    <path d="M450 210 L450 286"/>
    <path d="M330 344 L230 344"/>
    <path d="M570 344 L670 344"/>
    <path d="M450 382 L450 448"/>
    <path d="M780 398 L780 448"/>
    <path d="M230 214 C275 260 315 290 330 324"/>
  </g>

  <g>
    <rect class="entity" x="60" y="116" width="170" height="124" rx="9" stroke-width="2"/>
    <text x="145" y="143" text-anchor="middle" font-size="15" class="table-title">customers</text>
    <line class="rule" x1="80" y1="156" x2="210" y2="156" stroke-width="1.1"/>
    <text x="80" y="178" class="field">customer_id</text>
    <text x="80" y="199" class="field">email, name</text>
    <text x="80" y="220" class="field">account_state</text>

    <rect class="bridge" x="330" y="116" width="240" height="124" rx="9" stroke-width="2.2"/>
    <text x="450" y="143" text-anchor="middle" font-size="15" class="table-title">orders</text>
    <line class="rule" x1="352" y1="156" x2="548" y2="156" stroke-width="1.1"/>
    <text x="352" y="178" class="field">order_id, customer_id</text>
    <text x="352" y="199" class="field">order_ts, status</text>
    <text x="352" y="220" class="field">billing_address_id</text>

    <rect class="entity" x="670" y="116" width="220" height="124" rx="9" stroke-width="2"/>
    <text x="780" y="143" text-anchor="middle" font-size="15" class="table-title">addresses</text>
    <line class="rule" x1="692" y1="156" x2="868" y2="156" stroke-width="1.1"/>
    <text x="692" y="178" class="field">address_id</text>
    <text x="692" y="199" class="field">country, region</text>
    <text x="692" y="220" class="field">postal_code</text>

    <rect class="bridge" x="330" y="286" width="240" height="124" rx="9" stroke-width="2.2"/>
    <text x="450" y="313" text-anchor="middle" font-size="15" class="table-title">order_lines</text>
    <line class="rule" x1="352" y1="326" x2="548" y2="326" stroke-width="1.1"/>
    <text x="352" y="348" class="field">order_line_id, order_id</text>
    <text x="352" y="369" class="field">product_id, quantity</text>
    <text x="352" y="390" class="field">unit_price, discount</text>

    <rect class="entity" x="60" y="286" width="170" height="124" rx="9" stroke-width="2"/>
    <text x="145" y="313" text-anchor="middle" font-size="15" class="table-title">payments</text>
    <line class="rule" x1="80" y1="326" x2="210" y2="326" stroke-width="1.1"/>
    <text x="80" y="348" class="field">payment_id</text>
    <text x="80" y="369" class="field">order_id, method</text>
    <text x="80" y="390" class="field">amount, status</text>

    <rect class="entity" x="670" y="286" width="220" height="124" rx="9" stroke-width="2"/>
    <text x="780" y="313" text-anchor="middle" font-size="15" class="table-title">products</text>
    <line class="rule" x1="692" y1="326" x2="868" y2="326" stroke-width="1.1"/>
    <text x="692" y="348" class="field">product_id</text>
    <text x="692" y="369" class="field">sku, brand</text>
    <text x="692" y="390" class="field">category_id</text>

    <rect class="entity" x="330" y="448" width="240" height="72" rx="9" stroke-width="2"/>
    <text x="450" y="475" text-anchor="middle" font-size="15" class="table-title">shipments</text>
    <text x="352" y="502" class="field">shipment_id, order_line_id, carrier</text>

    <rect class="entity" x="670" y="448" width="220" height="72" rx="9" stroke-width="2"/>
    <text x="780" y="475" text-anchor="middle" font-size="15" class="table-title">categories</text>
    <text x="692" y="502" class="field">category_id, parent_category_id</text>
  </g>

  <rect class="note" x="235" y="558" width="205" height="50" rx="8" stroke-width="1.8"/>
  <text x="337" y="581" text-anchor="middle" font-size="14" class="table-title">Good for writes</text>
  <text x="337" y="600" text-anchor="middle" font-size="12" class="muted">few update anomalies</text>

  <rect class="note" x="540" y="558" width="244" height="50" rx="8" stroke-width="1.8"/>
  <text x="662" y="581" text-anchor="middle" font-size="14" class="table-title">Costly for repeated BI</text>
  <text x="662" y="600" text-anchor="middle" font-size="12" class="muted">many joins before grouping</text>
</svg>
