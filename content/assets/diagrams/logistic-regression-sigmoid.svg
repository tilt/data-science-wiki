<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-labelledby="title desc">
  <title id="title">The logistic (sigmoid) function maps a linear score to a probability</title>
  <desc id="desc">The sigmoid curve rises from near 0 at negative scores to near 1 at positive scores, crossing 0.5 at score zero. Negative-class points sit low on the left, positive-class points sit high on the right, with slight overlap near the middle.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .small { font-size: 15px; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .thresh { stroke: #f97316; stroke-width: 2; stroke-dasharray: 6 5; }
    .curve { fill: none; stroke: #2563eb; stroke-width: 3.5; }
    .neg { fill: #dc2626; }
    .pos { fill: #16a34a; }
  </style>

  <text x="340" y="34" text-anchor="middle" font-size="24" font-weight="800">Logistic regression maps a score to a probability</text>
  <text x="340" y="60" text-anchor="middle" font-size="16" class="muted">The sigmoid squeezes any linear score z into the range 0 to 1.</text>

  <!-- gridlines -->
  <line class="grid" x1="80" y1="60" x2="620" y2="60"/>
  <line class="grid" x1="80" y1="220" x2="620" y2="220"/>
  <!-- axes -->
  <line class="axis" x1="80" y1="380" x2="620" y2="380"/>
  <line class="axis" x1="350" y1="60" x2="350" y2="388"/>

  <!-- threshold at p = 0.5 -->
  <line class="thresh" x1="80" y1="220" x2="620" y2="220"/>
  <text x="612" y="214" text-anchor="end" class="small" fill="#c2410c">decision threshold 0.5</text>

  <!-- sigmoid curve -->
  <polyline class="curve" points="80,379.2 170,374.2 215,365 260,341.9 282.5,321.8 305,293.9 327.5,259 350,220 372.5,181 395,146 417.5,118.2 440,98 485,75 530,66 620,61"/>

  <!-- negative class points (label 0), low -->
  <circle class="neg" cx="170" cy="361" r="6"/>
  <circle class="neg" cx="215" cy="361" r="6"/>
  <circle class="neg" cx="260" cy="361" r="6"/>
  <circle class="neg" cx="305" cy="361" r="6"/>
  <circle class="neg" cx="381" cy="361" r="6"/>

  <!-- positive class points (label 1), high -->
  <circle class="pos" cx="530" cy="79" r="6"/>
  <circle class="pos" cx="485" cy="79" r="6"/>
  <circle class="pos" cx="440" cy="79" r="6"/>
  <circle class="pos" cx="395" cy="79" r="6"/>
  <circle class="pos" cx="318" cy="79" r="6"/>

  <!-- axis labels -->
  <text x="620" y="404" text-anchor="end" class="small muted">linear score z</text>
  <text x="350" y="404" text-anchor="middle" class="small muted">z = 0</text>
  <text x="74" y="66" text-anchor="end" class="small muted">1</text>
  <text x="74" y="224" text-anchor="end" class="small muted">0.5</text>
  <text x="74" y="384" text-anchor="end" class="small muted">0</text>
  <text x="30" y="220" text-anchor="middle" class="small muted" transform="rotate(-90 30 220)">P(y = 1 | x)</text>

  <!-- formula + legend -->
  <text x="470" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">σ(z) = 1 / (1 + e^−z)</text>
  <circle class="neg" cx="150" cy="118" r="6"/>
  <text x="164" y="123" class="small">actual class 0</text>
  <circle class="pos" cx="150" cy="142" r="6"/>
  <text x="164" y="147" class="small">actual class 1</text>
</svg>
