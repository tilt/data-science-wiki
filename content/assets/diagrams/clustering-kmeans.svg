<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">K-means clusters by nearest centroid</title>
  <desc id="desc">Two compact point clouds separated by a Voronoi boundary, with one centroid in each cluster.</desc>
  <style>
    .fg { fill: #111827; }
    .muted { fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.4; }
    .cut { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 7 6; }
    .blue { fill: #2563eb; }
    .orange { fill: #f97316; }
    .centroid { fill: #111827; stroke: #ffffff; stroke-width: 2; }
    text { font-family: Arial, sans-serif; }
  </style>
  <rect width="720" height="420" fill="transparent"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="700" class="fg">K-means: nearest centroid partition</text>
  <text x="360" y="64" text-anchor="middle" font-size="14" class="muted">Centroids define Voronoi cells; every point is assigned to the closest centroid.</text>
  <g transform="translate(102,90)">
    <line x1="0" y1="250" x2="520" y2="250" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="250" class="axis"/>
    <g class="grid">
      <line x1="130" y1="0" x2="130" y2="250"/><line x1="260" y1="0" x2="260" y2="250"/><line x1="390" y1="0" x2="390" y2="250"/>
      <line x1="0" y1="84" x2="520" y2="84"/><line x1="0" y1="168" x2="520" y2="168"/>
    </g>
    <path d="M260 20 C238 92 241 166 213 250" fill="none" class="cut"/>
    <g class="blue">
      <circle cx="82" cy="91" r="8"/><circle cx="110" cy="112" r="8"/><circle cx="137" cy="84" r="8"/>
      <circle cx="150" cy="139" r="8"/><circle cx="94" cy="171" r="8"/><circle cx="171" cy="178" r="8"/>
      <circle cx="124" cy="202" r="8"/><circle cx="193" cy="112" r="8"/>
    </g>
    <g class="orange">
      <circle cx="340" cy="86" r="8"/><circle cx="371" cy="111" r="8"/><circle cx="414" cy="96" r="8"/>
      <circle cx="396" cy="148" r="8"/><circle cx="442" cy="181" r="8"/><circle cx="352" cy="186" r="8"/>
      <circle cx="304" cy="145" r="8"/><circle cx="428" cy="129" r="8"/>
    </g>
    <path d="M118 134 l16 16 m0 -16 l-16 16" class="centroid"/>
    <path d="M385 132 l16 16 m0 -16 l-16 16" class="centroid"/>
    <text x="125" y="234" text-anchor="middle" font-size="13" class="muted">cluster mean</text>
    <text x="392" y="234" text-anchor="middle" font-size="13" class="muted">cluster mean</text>
  </g>
</svg>
