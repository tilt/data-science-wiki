<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
  <title id="title">Sample means concentrate while standardized means keep a fixed scale</title>
  <desc id="desc">Three sampling distributions of a sample mean get narrower as sample size grows, while standardization maps the typical fluctuation to a fixed z scale.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 24px; font-weight: 800; }
    .subtitle, .muted, .tick, .axis-label { fill: #374151; }
    .subtitle { font-size: 14px; }
    .tick { font-size: 12px; }
    .axis-label { font-size: 14px; }
    .callout { font-size: 13px; font-weight: 650; }
    .card { fill: #f8fafc; stroke: #64748b; stroke-width: 1.1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #111827; stroke-width: 1.5; }
    .guide { stroke: #111827; stroke-width: 1.5; fill: none; }
    .n1 { stroke: #f97316; }
    .n5 { stroke: #14b8a6; }
    .n30 { stroke: #2563eb; }
    .curve { fill: none; stroke-width: 4; stroke-linecap: round; }
  </style>

  <text x="430" y="36" text-anchor="middle" class="title">Averages tighten; standardization restores a fixed scale</text>
  <text x="430" y="62" text-anchor="middle" class="subtitle">Exact densities for mean-one exponential sample means; n=1 is the raw skewed distribution.</text>

  <g class="grid">
    <line x1="80" y1="352" x2="780" y2="352"/>
    <line x1="80" y1="292" x2="780" y2="292"/>
    <line x1="80" y1="232" x2="780" y2="232"/>
    <line x1="80" y1="172" x2="780" y2="172"/>
    <line x1="80" y1="112" x2="780" y2="112"/>
  </g>
  <line x1="80" y1="352" x2="780" y2="352" class="axis"/>
  <line x1="430" y1="92" x2="430" y2="352" class="axis" stroke-dasharray="6 6"/>

  <g class="tick">
    <text x="80" y="374" text-anchor="middle">0.0</text>
    <text x="197" y="374" text-anchor="middle">0.5</text>
    <text x="313" y="374" text-anchor="middle">0.75</text>
    <text x="430" y="374" text-anchor="middle">1.0</text>
    <text x="547" y="374" text-anchor="middle">1.25</text>
    <text x="663" y="374" text-anchor="middle">1.5</text>
    <text x="780" y="374" text-anchor="middle">2.0</text>
    <text x="430" y="405" text-anchor="middle" class="axis-label">sample mean value</text>
    <text x="36" y="226" text-anchor="middle" transform="rotate(-90 36 226)" class="axis-label">relative density</text>
    <text x="438" y="96">true mean mu = 1</text>
  </g>

  <path d="M 80.0 262.0 L 87.8 264.0 L 95.6 265.9 L 103.3 267.8 L 111.1 269.7 L 118.9 271.5 L 126.7 273.2 L 134.4 275.0 L 142.2 276.7 L 150.0 278.3 L 157.8 279.9 L 165.6 281.5 L 173.3 283.1 L 181.1 284.6 L 188.9 286.1 L 196.7 287.5 L 204.4 288.9 L 212.2 290.3 L 220.0 291.7 L 227.8 293.0 L 235.6 294.3 L 243.3 295.6 L 251.1 296.8 L 258.9 298.0 L 266.7 299.2 L 274.4 300.4 L 282.2 301.5 L 290.0 302.6 L 297.8 303.7 L 305.6 304.8 L 313.3 305.8 L 321.1 306.8 L 328.9 307.8 L 336.7 308.8 L 344.4 309.7 L 352.2 310.7 L 360.0 311.6 L 367.8 312.4 L 375.6 313.3 L 383.3 314.2 L 391.1 315.0 L 398.9 315.8 L 406.7 316.6 L 414.4 317.4 L 422.2 318.1 L 430.0 318.9 L 437.8 319.6 L 445.6 320.3 L 453.3 321.0 L 461.1 321.7 L 468.9 322.4 L 476.7 323.0 L 484.4 323.7 L 492.2 324.3 L 500.0 324.9 L 507.8 325.5 L 515.6 326.1 L 523.3 326.6 L 531.1 327.2 L 538.9 327.7 L 546.7 328.3 L 554.4 328.8 L 562.2 329.3 L 570.0 329.8 L 577.8 330.3 L 585.6 330.8 L 593.3 331.2 L 601.1 331.7 L 608.9 332.1 L 616.7 332.6 L 624.4 333.0 L 632.2 333.4 L 640.0 333.8 L 647.8 334.2 L 655.6 334.6 L 663.3 335.0 L 671.1 335.4 L 678.9 335.7 L 686.7 336.1 L 694.4 336.4 L 702.2 336.8 L 710.0 337.1 L 717.8 337.5 L 725.6 337.8 L 733.3 338.1 L 741.1 338.4 L 748.9 338.7 L 756.7 339.0 L 764.4 339.3 L 772.2 339.5 L 780.0 339.8" class="curve n1" opacity="0.78"/>
  <path d="M 80.0 352.0 L 87.8 352.0 L 95.6 352.0 L 103.3 351.8 L 111.1 351.5 L 118.9 351.0 L 126.7 350.1 L 134.4 348.8 L 142.2 347.2 L 150.0 345.1 L 157.8 342.6 L 165.6 339.7 L 173.3 336.4 L 181.1 332.7 L 188.9 328.8 L 196.7 324.7 L 204.4 320.3 L 212.2 315.9 L 220.0 311.4 L 227.8 306.9 L 235.6 302.4 L 243.3 298.1 L 251.1 293.9 L 258.9 289.9 L 266.7 286.1 L 274.4 282.6 L 282.2 279.3 L 290.0 276.4 L 297.8 273.7 L 305.6 271.4 L 313.3 269.4 L 321.1 267.7 L 328.9 266.4 L 336.7 265.4 L 344.4 264.6 L 352.2 264.2 L 360.0 264.1 L 367.8 264.2 L 375.6 264.6 L 383.3 265.2 L 391.1 266.1 L 398.9 267.1 L 406.7 268.4 L 414.4 269.8 L 422.2 271.3 L 430.0 273.0 L 437.8 274.9 L 445.6 276.8 L 453.3 278.8 L 461.1 280.8 L 468.9 282.9 L 476.7 285.1 L 484.4 287.3 L 492.2 289.5 L 500.0 291.8 L 507.8 294.0 L 515.6 296.2 L 523.3 298.4 L 531.1 300.6 L 538.9 302.8 L 546.7 304.9 L 554.4 306.9 L 562.2 309.0 L 570.0 310.9 L 577.8 312.9 L 585.6 314.8 L 593.3 316.6 L 601.1 318.3 L 608.9 320.0 L 616.7 321.7 L 624.4 323.3 L 632.2 324.8 L 640.0 326.2 L 647.8 327.6 L 655.6 329.0 L 663.3 330.3 L 671.1 331.5 L 678.9 332.7 L 686.7 333.8 L 694.4 334.8 L 702.2 335.9 L 710.0 336.8 L 717.8 337.7 L 725.6 338.6 L 733.3 339.4 L 741.1 340.2 L 748.9 340.9 L 756.7 341.6 L 764.4 342.3 L 772.2 342.9 L 780.0 343.5" class="curve n5" opacity="0.86"/>
  <path d="M 80.0 352.0 L 87.8 352.0 L 95.6 352.0 L 103.3 352.0 L 111.1 352.0 L 118.9 352.0 L 126.7 352.0 L 134.4 352.0 L 142.2 352.0 L 150.0 352.0 L 157.8 352.0 L 165.6 352.0 L 173.3 352.0 L 181.1 352.0 L 188.9 352.0 L 196.7 352.0 L 204.4 352.0 L 212.2 352.0 L 220.0 352.0 L 227.8 351.9 L 235.6 351.8 L 243.3 351.6 L 251.1 351.1 L 258.9 350.4 L 266.7 349.1 L 274.4 347.2 L 282.2 344.3 L 290.0 340.2 L 297.8 334.7 L 305.6 327.4 L 313.3 318.2 L 321.1 307.1 L 328.9 294.1 L 336.7 279.5 L 344.4 263.5 L 352.2 246.7 L 360.0 229.6 L 367.8 212.9 L 375.6 197.2 L 383.3 183.2 L 391.1 171.4 L 398.9 162.2 L 406.7 156.0 L 414.4 152.9 L 422.2 152.9 L 430.0 155.9 L 437.8 161.5 L 445.6 169.6 L 453.3 179.5 L 461.1 191.0 L 468.9 203.5 L 476.7 216.6 L 484.4 229.9 L 492.2 243.1 L 500.0 255.8 L 507.8 267.9 L 515.6 279.2 L 523.3 289.6 L 531.1 298.9 L 538.9 307.3 L 546.7 314.6 L 554.4 321.0 L 562.2 326.5 L 570.0 331.2 L 577.8 335.1 L 585.6 338.4 L 593.3 341.1 L 601.1 343.4 L 608.9 345.2 L 616.7 346.7 L 624.4 347.8 L 632.2 348.8 L 640.0 349.5 L 647.8 350.1 L 655.6 350.6 L 663.3 350.9 L 671.1 351.2 L 678.9 351.4 L 686.7 351.5 L 694.4 351.7 L 702.2 351.7 L 710.0 351.8 L 717.8 351.9 L 725.6 351.9 L 733.3 351.9 L 741.1 351.9 L 748.9 352.0 L 756.7 352.0 L 764.4 352.0 L 772.2 352.0 L 780.0 352.0" class="curve n30"/>

  <g class="guide">
    <line x1="80" y1="324" x2="780" y2="324"/>
    <line x1="80" y1="316" x2="80" y2="332"/>
    <line x1="780" y1="316" x2="780" y2="332"/>
    <line x1="273" y1="270" x2="587" y2="270"/>
    <line x1="273" y1="262" x2="273" y2="278"/>
    <line x1="587" y1="262" x2="587" y2="278"/>
    <line x1="366" y1="136" x2="494" y2="136"/>
    <line x1="366" y1="128" x2="366" y2="144"/>
    <line x1="494" y1="128" x2="494" y2="144"/>
  </g>

  <g class="callout">
    <text x="430" y="318" text-anchor="middle">mu +/- 1 SE for n = 1</text>
    <text x="430" y="264" text-anchor="middle">mu +/- 1/sqrt(5)</text>
    <text x="430" y="130" text-anchor="middle">mu +/- 1/sqrt(30)</text>
    <line x1="612" y1="100" x2="640" y2="100" class="n1 curve" opacity="0.78"/>
    <text x="650" y="104">n = 1</text>
    <line x1="612" y1="126" x2="640" y2="126" class="n5 curve" opacity="0.86"/>
    <text x="650" y="130">n = 5</text>
    <line x1="612" y1="152" x2="640" y2="152" class="n30 curve"/>
    <text x="650" y="156">n = 30</text>
  </g>

  <g font-size="14">
    <rect x="88" y="92" width="176" height="84" rx="8" class="card"/>
    <text x="104" y="119">Raw mean:</text>
    <text x="104" y="143">mean moves toward mu</text>
    <text x="104" y="160" class="tick">law of large numbers</text>
    <rect x="88" y="188" width="176" height="98" rx="8" class="card"/>
    <text x="104" y="216">Standardized mean:</text>
    <text x="104" y="240">sqrt(n)(mean - mu)</text>
    <text x="104" y="260">/ sigma</text>
    <text x="104" y="278" class="tick">central limit theorem</text>
  </g>
</svg>
