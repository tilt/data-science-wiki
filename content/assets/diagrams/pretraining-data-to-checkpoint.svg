<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Pretraining data to checkpoint pipeline</title>
  <desc id="desc">Pretraining filters and deduplicates data, tokenizes sequences, trains with next-token loss, evaluates slices, and emits checkpoints.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 27px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .label { font-size: 15px; font-weight: 800; }
    .small { font-size: 13px; fill: #374151; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .data { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; }
    .train { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.8; }
    .eval { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.8; }
    .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .token { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  </style>
  <text x="480" y="40" text-anchor="middle" class="title">Pretraining turns web-scale data into a base model checkpoint</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">The objective is next-token prediction; the engineering work is data, scale, and evaluation.</text>

  <g transform="translate(54,128)">
    <rect width="138" height="78" rx="10" class="data"/>
    <text x="69" y="31" text-anchor="middle" class="label">raw corpus</text>
    <text x="69" y="54" text-anchor="middle" class="small">web, code, books</text>
    <path d="M142 39 H196" class="arrow"/>

    <rect x="210" width="148" height="78" rx="10" class="data"/>
    <text x="284" y="31" text-anchor="middle" class="label">filter + dedup</text>
    <text x="284" y="54" text-anchor="middle" class="small">quality, privacy</text>
    <path d="M362 39 H416" class="arrow"/>

    <rect x="430" width="138" height="78" rx="10" class="train"/>
    <text x="499" y="31" text-anchor="middle" class="label">tokenize</text>
    <text x="499" y="54" text-anchor="middle" class="small">IDs and batches</text>
    <path d="M572 39 H626" class="arrow"/>

    <rect x="640" width="148" height="78" rx="10" class="train"/>
    <text x="714" y="31" text-anchor="middle" class="label">optimize</text>
    <text x="714" y="54" text-anchor="middle" class="small">next-token loss</text>
  </g>

  <path d="M768 206 C768 236 388 236 329 268" class="arrow"/>
  <g transform="translate(244,274)">
    <rect width="170" height="78" rx="10" class="eval"/>
    <text x="85" y="31" text-anchor="middle" class="label">eval slices</text>
    <text x="85" y="54" text-anchor="middle" class="small">domain, safety, leakage</text>
    <path d="M174 39 H254" class="arrow"/>
    <rect x="268" width="170" height="78" rx="10" class="eval"/>
    <text x="353" y="31" text-anchor="middle" class="label">checkpoint</text>
    <text x="353" y="54" text-anchor="middle" class="small">base model</text>
  </g>

  <g transform="translate(174,370)">
    <rect width="612" height="72" rx="9" class="box"/>
    <rect x="222" y="14" width="52" height="22" rx="5" class="token"/>
    <rect x="280" y="14" width="52" height="22" rx="5" class="token"/>
    <rect x="338" y="14" width="52" height="22" rx="5" class="token" fill="#2563eb"/>
    <text x="306" y="58" text-anchor="middle" class="small"><tspan font-weight="800">next-token loss</tspan>: predict the highlighted token from the ones before it</text>
  </g>
</svg>
