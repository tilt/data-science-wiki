<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
  <title id="title">Temporal localization overlap</title>
  <desc id="desc">Ground truth interval from 12 to 22 seconds, a good predicted interval from 10 to 21 seconds, and a non-overlapping bad prediction from 0 to 10 seconds.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#1f2937"], [fill="#374151"], [fill="#4b5563"], [fill="#0f172a"], [fill="#020617"], [fill="#000000"] { fill: #f8fafc !important; }
      [stroke="#111827"], [stroke="#1f2937"], [stroke="#374151"], [stroke="#4b5563"], [stroke="#0f172a"], [stroke="#020617"], [stroke="#000000"] { stroke: #e5e7eb !important; }
    }
  </style>
  <rect width="860" height="330" fill="transparent"/>
  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Temporal localization scores interval overlap</text>
  <text x="430" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">tIoU is intersection length divided by the full union span.</text>

  <g transform="translate(90,95)" font-family="Arial, sans-serif">
    <line x1="0" y1="170" x2="680" y2="170" stroke="#111827" stroke-width="2"/>
    <g fill="#374151" font-size="13">
      <text x="0" y="195" text-anchor="middle">0s</text>
      <text x="300" y="195" text-anchor="middle">10s</text>
      <text x="360" y="195" text-anchor="middle">12s</text>
      <text x="630" y="195" text-anchor="middle">21s</text>
      <text x="660" y="195" text-anchor="middle">22s</text>
    </g>
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="0" y1="45" x2="0" y2="176"/>
      <line x1="300" y1="45" x2="300" y2="176"/>
      <line x1="360" y1="45" x2="360" y2="176"/>
      <line x1="630" y1="45" x2="630" y2="176"/>
      <line x1="660" y1="45" x2="660" y2="176"/>
    </g>
    <text x="-20" y="45" text-anchor="end" font-size="14" fill="#111827">bad pred</text>
    <rect x="0" y="28" width="300" height="28" rx="4" fill="#fca5a5" stroke="#dc2626"/>
    <text x="-20" y="95" text-anchor="end" font-size="14" fill="#111827">good pred</text>
    <rect x="300" y="78" width="330" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="-20" y="145" text-anchor="end" font-size="14" fill="#111827">truth</text>
    <rect x="360" y="128" width="300" height="28" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <rect x="360" y="78" width="270" height="78" fill="#fde68a" opacity="0.45" stroke="#d97706" stroke-dasharray="5 4"/>
    <text x="495" y="73" text-anchor="middle" font-size="13" fill="#92400e">intersection = 9s</text>
    <path d="M300 225 H660" stroke="#7c3aed" stroke-width="4"/>
    <text x="480" y="248" text-anchor="middle" font-size="13" fill="#5b21b6">union span = 12s for the good proposal</text>
  </g>
</svg>
