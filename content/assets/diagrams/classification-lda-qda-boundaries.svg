<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">LDA uses a linear boundary while QDA can use a curved boundary</title>
  <desc id="desc">Two panels compare discriminant analysis. LDA assumes shared covariance ellipses and gives a straight boundary. QDA allows different covariances, so the boundary bends around the class densities.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 22px; font-weight: 800; }
    .subtitle, .muted, .axis-label { fill: #374151; }
    .subtitle { font-size: 14px; }
    .muted { font-size: 12px; }
    .axis-label { font-size: 13px; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .blue { fill: #2563eb; }
    .orange { fill: #f97316; }
    .ellipse-a { fill: #2563eb; fill-opacity: 0.08; stroke: #2563eb; stroke-width: 2.4; }
    .ellipse-b { fill: #f97316; fill-opacity: 0.08; stroke: #f97316; stroke-width: 2.4; }
    .boundary { fill: none; stroke: #ef4444; stroke-width: 3; stroke-dasharray: 8 6; }
    .mean { fill: #111827; stroke: #ffffff; stroke-width: 2; }
    .label { font-size: 13px; font-weight: 700; }
  </style>

  <text x="380" y="36" text-anchor="middle" class="title">Discriminant analysis: Gaussian class models</text>
  <text x="380" y="62" text-anchor="middle" class="subtitle">LDA shares covariance and gets a line; QDA fits each covariance and can bend the boundary.</text>

  <g transform="translate(44,96)">
    <rect width="320" height="288" rx="8" class="panel"/>
    <text x="160" y="28" text-anchor="middle" class="label">LDA: shared covariance</text>
    <line x1="42" y1="244" x2="284" y2="244" class="axis"/>
    <line x1="42" y1="54" x2="42" y2="244" class="axis"/>
    <g class="grid">
      <line x1="103" y1="54" x2="103" y2="244"/>
      <line x1="164" y1="54" x2="164" y2="244"/>
      <line x1="225" y1="54" x2="225" y2="244"/>
      <line x1="42" y1="117" x2="284" y2="117"/>
      <line x1="42" y1="181" x2="284" y2="181"/>
    </g>
    <ellipse cx="114" cy="162" rx="72" ry="40" transform="rotate(-24 114 162)" class="ellipse-a"/>
    <ellipse cx="208" cy="128" rx="72" ry="40" transform="rotate(-24 208 128)" class="ellipse-b"/>
    <path d="M154 52 L181 246" class="boundary"/>
    <g class="blue">
      <circle cx="75" cy="176" r="7"/><circle cx="99" cy="150" r="7"/><circle cx="123" cy="168" r="7"/><circle cx="146" cy="138" r="7"/>
    </g>
    <g class="orange">
      <circle cx="184" cy="112" r="7"/><circle cx="210" cy="135" r="7"/><circle cx="235" cy="116" r="7"/><circle cx="222" cy="158" r="7"/>
    </g>
    <circle cx="114" cy="162" r="6" class="mean"/>
    <circle cx="208" cy="128" r="6" class="mean"/>
    <text x="160" y="270" text-anchor="middle" class="axis-label">equal shape ellipses -> linear boundary</text>
  </g>

  <g transform="translate(396,96)">
    <rect width="320" height="288" rx="8" class="panel"/>
    <text x="160" y="28" text-anchor="middle" class="label">QDA: class-specific covariance</text>
    <line x1="42" y1="244" x2="284" y2="244" class="axis"/>
    <line x1="42" y1="54" x2="42" y2="244" class="axis"/>
    <g class="grid">
      <line x1="103" y1="54" x2="103" y2="244"/>
      <line x1="164" y1="54" x2="164" y2="244"/>
      <line x1="225" y1="54" x2="225" y2="244"/>
      <line x1="42" y1="117" x2="284" y2="117"/>
      <line x1="42" y1="181" x2="284" y2="181"/>
    </g>
    <ellipse cx="112" cy="154" rx="78" ry="30" transform="rotate(-18 112 154)" class="ellipse-a"/>
    <ellipse cx="216" cy="140" rx="46" ry="72" transform="rotate(18 216 140)" class="ellipse-b"/>
    <path d="M154 58 C205 95 192 149 166 176 C139 204 150 229 190 246" class="boundary"/>
    <g class="blue">
      <circle cx="72" cy="162" r="7"/><circle cx="101" cy="138" r="7"/><circle cx="128" cy="158" r="7"/><circle cx="149" cy="133" r="7"/>
    </g>
    <g class="orange">
      <circle cx="199" cy="90" r="7"/><circle cx="230" cy="126" r="7"/><circle cx="215" cy="168" r="7"/><circle cx="248" cy="190" r="7"/>
    </g>
    <circle cx="112" cy="154" r="6" class="mean"/>
    <circle cx="216" cy="140" r="6" class="mean"/>
    <text x="160" y="270" text-anchor="middle" class="axis-label">different ellipses -> quadratic boundary</text>
  </g>
</svg>
