<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-labelledby="title desc">
  <title id="title">Video transformer token cost</title>
  <desc id="desc">As patch size shrinks from 8 to 4 to 2 pixels, token count grows from 16 to 64 to 256 and full attention score count grows from 256 to 4096 to 65536.</desc>
  <rect width="860" height="390" fill="transparent"/>
  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Patch detail raises attention cost quadratically</text>
  <text x="430" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">For fixed frames and tubelet length, smaller patches create more tokens and many more pairwise scores.</text>
  <g transform="translate(100,95)" font-family="Arial, sans-serif">
    <line x1="0" y1="230" x2="660" y2="230" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="230" stroke="#111827" stroke-width="2"/>
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="0" y1="180" x2="660" y2="180"/>
      <line x1="0" y1="120" x2="660" y2="120"/>
      <line x1="0" y1="60" x2="660" y2="60"/>
    </g>
    <g fill="#bfdbfe" stroke="#2563eb" stroke-width="2">
      <rect x="85" y="229" width="70" height="1"/>
      <rect x="295" y="216" width="70" height="14"/>
      <rect x="505" y="20" width="70" height="210"/>
    </g>
    <g fill="#374151" font-size="13">
      <text x="120" y="252" text-anchor="middle">P=8</text>
      <text x="330" y="252" text-anchor="middle">P=4</text>
      <text x="540" y="252" text-anchor="middle">P=2</text>
      <text x="-18" y="234" text-anchor="end">0</text>
      <text x="-18" y="183" text-anchor="end">16k</text>
      <text x="-18" y="123" text-anchor="end">32k</text>
      <text x="-18" y="63" text-anchor="end">48k</text>
      <text x="-18" y="24" text-anchor="end">65k</text>
    </g>
    <g fill="#111827" font-size="13" font-weight="700">
      <text x="120" y="218" text-anchor="middle">256</text>
      <text x="330" y="205" text-anchor="middle">4,096</text>
      <text x="540" y="12" text-anchor="middle">65,536</text>
    </g>
    <text x="330" y="292" text-anchor="middle" font-size="14" fill="#374151">full-attention score count N^2</text>
  </g>
</svg>
