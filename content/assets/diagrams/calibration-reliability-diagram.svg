<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Reliability diagram for four calibration bins</title>
  <desc id="desc">A calibration plot comparing mean predicted probability with observed frequency. All four observed points sit above the ideal diagonal, showing underconfidence.</desc>
  <style><![CDATA[
    :root {
      --plot-bg: transparent;
      --plot-panel: transparent;
      --plot-fg: #202124;
      --plot-note: #3c4043;
      --plot-muted: #5f6368;
      --plot-grid: #e2e8f0;
      --plot-border: #c7ccd1;
      --plot-reference: #7a7f87;
      --plot-teal: #0f766e;
      --plot-dot-stroke: #ffffff;
    }
  ]]></style>
  <rect width="720" height="420" fill="var(--plot-bg)"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--plot-fg)">Reliability diagram</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--plot-muted)">Observed frequency is higher than mean predicted probability in every bin</text>
  <g transform="translate(92 72)">
    <rect x="0" y="0" width="280" height="280" fill="var(--plot-panel)" stroke="var(--plot-border)"/>
    <g stroke="var(--plot-grid)" stroke-width="1">
      <line x1="0" y1="224" x2="280" y2="224"/>
      <line x1="0" y1="168" x2="280" y2="168"/>
      <line x1="0" y1="112" x2="280" y2="112"/>
      <line x1="0" y1="56" x2="280" y2="56"/>
      <line x1="56" y1="0" x2="56" y2="280"/>
      <line x1="112" y1="0" x2="112" y2="280"/>
      <line x1="168" y1="0" x2="168" y2="280"/>
      <line x1="224" y1="0" x2="224" y2="280"/>
    </g>
    <line x1="0" y1="280" x2="280" y2="0" stroke="var(--plot-reference)" stroke-width="2" stroke-dasharray="6 5"/>
    <polyline points="40,210 106,140 177,93 246,0" fill="none" stroke="var(--plot-teal)" stroke-width="3"/>
    <g fill="var(--plot-teal)" stroke="var(--plot-dot-stroke)" stroke-width="2">
      <circle cx="40" cy="210" r="6"/>
      <circle cx="106" cy="140" r="6"/>
      <circle cx="177" cy="93" r="6"/>
      <circle cx="246" cy="0" r="6"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="12" fill="var(--plot-note)">
      <text x="22" y="202">n=4</text>
      <text x="92" y="132">n=2</text>
      <text x="164" y="85">n=3</text>
      <text x="231" y="18">n=3</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="12" fill="var(--plot-muted)">
      <text x="-10" y="284" text-anchor="end">0.0</text>
      <text x="-10" y="228" text-anchor="end">0.2</text>
      <text x="-10" y="172" text-anchor="end">0.4</text>
      <text x="-10" y="116" text-anchor="end">0.6</text>
      <text x="-10" y="60" text-anchor="end">0.8</text>
      <text x="-10" y="4" text-anchor="end">1.0</text>
      <text x="0" y="302" text-anchor="middle">0.0</text>
      <text x="56" y="302" text-anchor="middle">0.2</text>
      <text x="112" y="302" text-anchor="middle">0.4</text>
      <text x="168" y="302" text-anchor="middle">0.6</text>
      <text x="224" y="302" text-anchor="middle">0.8</text>
      <text x="280" y="302" text-anchor="middle">1.0</text>
    </g>
    <text x="140" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--plot-fg)">Mean predicted probability</text>
    <text x="-58" y="140" text-anchor="middle" transform="rotate(-90 -58 140)" font-family="Arial, sans-serif" font-size="14" fill="var(--plot-fg)">Observed frequency</text>
  </g>
  <g transform="translate(438 126)" font-family="Arial, sans-serif">
    <text x="0" y="0" font-size="15" font-weight="700" fill="var(--plot-fg)">Bin values</text>
    <g font-size="13" fill="var(--plot-note)">
      <text x="0" y="34">Mean pred 0.142 -> observed 0.250</text>
      <text x="0" y="62">Mean pred 0.380 -> observed 0.500</text>
      <text x="0" y="90">Mean pred 0.633 -> observed 0.667</text>
      <text x="0" y="118">Mean pred 0.880 -> observed 1.000</text>
    </g>
    <line x1="0" y1="158" x2="44" y2="158" stroke="var(--plot-reference)" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="56" y="162" font-size="13" fill="var(--plot-muted)">Perfect calibration</text>
    <line x1="0" y1="194" x2="44" y2="194" stroke="var(--plot-teal)" stroke-width="3"/>
    <text x="56" y="198" font-size="13" fill="var(--plot-muted)">Observed bins</text>
  </g>
</svg>
