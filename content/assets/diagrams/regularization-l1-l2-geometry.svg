<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Why the lasso produces sparse solutions and ridge does not</title>
  <desc id="desc">Two panels show loss contours around the least-squares solution meeting a constraint region. The ridge circle touches a contour off the axes, keeping both coefficients nonzero. The lasso diamond touches at a corner on an axis, setting one coefficient to zero.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .small { font-size: 15px; }
    .axis { stroke: #94a3b8; stroke-width: 1.8; }
    .contour { fill: none; stroke: #f97316; stroke-width: 2; }
    .region { fill: #dbeafe; fill-opacity: 0.6; stroke: #2563eb; stroke-width: 2.5; }
    .ols { fill: none; stroke: #111827; stroke-width: 2; }
    .sol { fill: #dc2626; }
  </style>

  <text x="360" y="30" text-anchor="middle" font-size="23" font-weight="800">The constraint shape decides sparsity</text>

  <!-- ===== Panel A: Ridge (L2) ===== -->
  <text x="195" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Ridge (L2): circle</text>
  <line class="axis" x1="60" y1="235" x2="330" y2="235"/>
  <line class="axis" x1="195" y1="90" x2="195" y2="360"/>
  <text x="326" y="255" class="small muted">β₁</text>
  <text x="205" y="102" class="small muted">β₂</text>
  <circle class="region" cx="195" cy="235" r="72"/>
  <ellipse class="contour" cx="272" cy="152" rx="46" ry="40"/>
  <ellipse class="contour" cx="272" cy="152" rx="92" ry="82"/>
  <circle class="ols" cx="272" cy="152" r="4.5"/>
  <text x="286" y="146" class="small">β̂ (OLS)</text>
  <circle class="sol" cx="245" cy="182" r="6"/>
  <text x="120" y="200" text-anchor="end" class="small" fill="#b91c1c">both β nonzero</text>

  <!-- ===== Panel B: Lasso (L1) ===== -->
  <text x="535" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Lasso (L1): diamond</text>
  <line class="axis" x1="400" y1="235" x2="670" y2="235"/>
  <line class="axis" x1="535" y1="90" x2="535" y2="360"/>
  <text x="666" y="255" class="small muted">β₁</text>
  <text x="545" y="102" class="small muted">β₂</text>
  <polygon class="region" points="463,235 535,163 607,235 535,307"/>
  <ellipse class="contour" cx="612" cy="152" rx="46" ry="42"/>
  <ellipse class="contour" cx="612" cy="152" rx="92" ry="86"/>
  <circle class="ols" cx="612" cy="152" r="4.5"/>
  <text x="626" y="146" class="small">β̂ (OLS)</text>
  <circle class="sol" cx="607" cy="235" r="6"/>
  <text x="614" y="228" class="small" fill="#b91c1c">β₂ = 0</text>

  <text x="360" y="398" text-anchor="middle" class="small muted">The smallest loss contour touching the region is the solution; the diamond's corners lie on the axes.</text>
</svg>
