<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">GAN generator-discriminator game</title>
  <desc id="desc">Noise enters a generator to produce fake samples; real and fake samples are judged by a discriminator, whose feedback trains both models.</desc>
  <rect width="940" height="430" fill="transparent"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="470" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#111827">GANs train a generator against a discriminator</text>
    <text x="470" y="72" text-anchor="middle" font-size="15" fill="#4b5563">The discriminator learns the real/fake boundary; the generator learns to cross it.</text>

    <rect x="50" y="145" width="130" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">noise</text>
    <text x="115" y="202" text-anchor="middle" font-size="14" fill="#374151">z</text>

    <rect x="240" y="125" width="155" height="118" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="318" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">generator</text>
    <text x="318" y="190" text-anchor="middle" font-size="13" fill="#374151">makes fake sample</text>
    <text x="318" y="214" text-anchor="middle" font-size="13" fill="#374151">G(z)</text>

    <rect x="480" y="92" width="130" height="78" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="545" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">real data</text>
    <text x="545" y="149" text-anchor="middle" font-size="14" fill="#374151">x</text>

    <rect x="480" y="220" width="130" height="78" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="545" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">fake data</text>
    <text x="545" y="277" text-anchor="middle" font-size="14" fill="#374151">G(z)</text>

    <rect x="700" y="145" width="165" height="118" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="782" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">discriminator</text>
    <text x="782" y="208" text-anchor="middle" font-size="13" fill="#374151">predicts real or fake</text>
    <text x="782" y="232" text-anchor="middle" font-size="13" fill="#374151">D(sample)</text>

    <path d="M182 184 L236 184" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>
    <path d="M397 184 C430 184 444 257 476 257" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>
    <path d="M612 130 C655 130 659 175 696 185" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>
    <path d="M612 258 C655 258 660 225 696 213" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>

    <path d="M782 268 C720 352 382 355 319 248" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <text x="548" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">feedback updates generator and discriminator</text>
  </g>
</svg>
