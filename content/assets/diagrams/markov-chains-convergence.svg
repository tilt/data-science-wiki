<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Markov chain convergence</title>
  <desc id="desc">State probabilities converge from an initial state toward a stationary distribution over repeated Markov-chain transitions.</desc>
  <rect x="0" y="0" width="760" height="430" fill="transparent"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Repeated transitions approach a stationary mix</text>
  <text x="380" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Starting from state 0, P, P^5, and P^20 move the distribution toward pi.</text>
  <line x1="84" y1="338" x2="690" y2="338" stroke="#111827" stroke-width="1.5"/>
  <line x1="84" y1="86" x2="84" y2="338" stroke="#111827" stroke-width="1.5"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="84" y1="288" x2="690" y2="288"/>
    <line x1="84" y1="237" x2="690" y2="237"/>
    <line x1="84" y1="187" x2="690" y2="187"/>
    <line x1="84" y1="136" x2="690" y2="136"/>
    <line x1="84" y1="86" x2="690" y2="86"/>
  </g>
  <path d="M84 86 L205 124 L387 186 L690 208" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M84 338 L205 300 L387 260 L690 249" fill="none" stroke="#14b8a6" stroke-width="4"/>
  <path d="M84 338 L205 338 L387 317 L690 305" fill="none" stroke="#f97316" stroke-width="4"/>
  <g fill="#2563eb"><circle cx="84" cy="86" r="5"/><circle cx="205" cy="124" r="5"/><circle cx="387" cy="186" r="5"/><circle cx="690" cy="208" r="5"/></g>
  <g fill="#14b8a6"><circle cx="84" cy="338" r="5"/><circle cx="205" cy="300" r="5"/><circle cx="387" cy="260" r="5"/><circle cx="690" cy="249" r="5"/></g>
  <g fill="#f97316"><circle cx="84" cy="338" r="5"/><circle cx="205" cy="338" r="5"/><circle cx="387" cy="317" r="5"/><circle cx="690" cy="305" r="5"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <text x="84" y="360" text-anchor="middle">0</text>
    <text x="205" y="360" text-anchor="middle">1</text>
    <text x="387" y="360" text-anchor="middle">5</text>
    <text x="690" y="360" text-anchor="middle">20</text>
    <text x="386" y="395" text-anchor="middle" font-size="14">transition step k</text>
    <text x="58" y="342" text-anchor="end">0.0</text>
    <text x="58" y="241" text-anchor="end">0.4</text>
    <text x="58" y="140" text-anchor="end">0.8</text>
    <text x="32" y="212" text-anchor="middle" transform="rotate(-90 32 212)" font-size="14">state probability</text>
    <text x="530" y="118" fill="#2563eb">state 0</text>
    <text x="530" y="143" fill="#14b8a6">state 1</text>
    <text x="530" y="168" fill="#f97316">state 2</text>
  </g>
</svg>
