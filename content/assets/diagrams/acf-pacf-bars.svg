<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">ACF and PACF bars</title>
  <desc id="desc">Bar charts comparing ACF and PACF values for lags 1 through 3.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#1f2937"], [fill="#374151"], [fill="#4b5563"], [fill="#0f172a"], [fill="#020617"], [fill="#000000"] { fill: #f8fafc !important; }
      [stroke="#111827"], [stroke="#1f2937"], [stroke="#374151"], [stroke="#4b5563"], [stroke="#0f172a"], [stroke="#020617"], [stroke="#000000"] { stroke: #e5e7eb !important; }
    }
  </style>
  <rect x="0" y="0" width="760" height="430" fill="transparent"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">ACF sees total lag association; PACF isolates direct lag effects</text>
  <text x="380" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Toy series: lag 2 has a large ACF and a smaller, still positive PACF.</text>
  <line x1="96" y1="230" x2="690" y2="230" stroke="#111827" stroke-width="1.5"/>
  <line x1="96" y1="98" x2="96" y2="330" stroke="#111827" stroke-width="1.5"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="96" y1="164" x2="690" y2="164"/>
    <line x1="96" y1="296" x2="690" y2="296"/>
  </g>
  <g fill="#2563eb" opacity="0.85">
    <rect x="160" y="175" width="44" height="55"/>
    <rect x="300" y="130" width="44" height="100"/>
    <rect x="440" y="230" width="44" height="58"/>
  </g>
  <g fill="#f97316" opacity="0.82">
    <rect x="214" y="200" width="44" height="30"/>
    <rect x="354" y="168" width="44" height="62"/>
    <rect x="494" y="230" width="44" height="1"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <text x="209" y="356" text-anchor="middle">lag 1</text>
    <text x="349" y="356" text-anchor="middle">lag 2</text>
    <text x="489" y="356" text-anchor="middle">lag 3</text>
    <text x="64" y="168" text-anchor="end">+0.5</text>
    <text x="64" y="234" text-anchor="end">0</text>
    <text x="64" y="300" text-anchor="end">-0.5</text>
    <rect x="560" y="112" width="14" height="14" fill="#2563eb" opacity="0.85"/>
    <text x="584" y="124">ACF</text>
    <rect x="560" y="138" width="14" height="14" fill="#f97316" opacity="0.82"/>
    <text x="584" y="150">PACF</text>
  </g>
</svg>
