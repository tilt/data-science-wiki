<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Matrix factorization matrix shapes</title>
  <desc id="desc">A sparse user-item score matrix is approximated by multiplying a users by k user-factor matrix with a k by items item-factor matrix.</desc>
  <style>
    text { font-family: Arial, sans-serif; }
    .surface { fill: transparent; }
    .fg { fill: #111827; }
    .muted { fill: #4b5563; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .missing { fill: #eef2f7; stroke: #cbd5e1; stroke-width: 1; }
    .row { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
    .col { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.4; }
    .target { fill: #fee2e2; stroke: #e11d48; stroke-width: 1.8; }
    .accent-blue { fill: #2563eb; }
    .accent-teal { fill: #0f766e; }
    .accent-rose { fill: #be123c; }
    .accent-orange { fill: #c2410c; }
    .stroke { stroke: #64748b; stroke-width: 2; fill: none; }
    .arrow-fill { fill: #64748b; }
    .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>

  <rect width="760" height="480" fill="transparent"/>
  <rect x="0" y="0" width="760" height="480" rx="8" class="surface"/>
  <text x="380" y="36" text-anchor="middle" font-size="23" font-weight="700" class="fg">Low-rank factors split the user-item matrix</text>
  <text x="380" y="63" text-anchor="middle" font-size="14" class="muted">A large users x items table is represented by two thinner embedding tables with shared latent dimension k.</text>

  <g transform="translate(36,126)">
    <rect x="0" y="0" width="184" height="214" rx="8" class="panel"/>
    <text x="92" y="-18" text-anchor="middle" font-size="15" font-weight="700" class="fg">predicted scores</text>
    <text x="92" y="24" text-anchor="middle" font-size="15" font-weight="700" class="fg">R_hat</text>
    <text x="92" y="198" text-anchor="middle" font-size="12" class="muted">users x items</text>

    <g transform="translate(26,42)">
      <rect x="0" y="0" width="22" height="22" class="cell"/>
      <rect x="22" y="0" width="22" height="22" class="cell"/>
      <rect x="44" y="0" width="22" height="22" class="missing"/>
      <rect x="66" y="0" width="22" height="22" class="cell"/>
      <rect x="88" y="0" width="22" height="22" class="missing"/>
      <rect x="110" y="0" width="22" height="22" class="cell"/>

      <rect x="0" y="22" width="22" height="22" class="cell"/>
      <rect x="22" y="22" width="22" height="22" class="missing"/>
      <rect x="44" y="22" width="22" height="22" class="cell"/>
      <rect x="66" y="22" width="22" height="22" class="cell"/>
      <rect x="88" y="22" width="22" height="22" class="missing"/>
      <rect x="110" y="22" width="22" height="22" class="cell"/>

      <rect x="0" y="44" width="22" height="22" class="missing"/>
      <rect x="22" y="44" width="22" height="22" class="missing"/>
      <rect x="44" y="44" width="22" height="22" class="cell"/>
      <rect x="66" y="44" width="22" height="22" class="cell"/>
      <rect x="88" y="44" width="22" height="22" class="cell"/>
      <rect x="110.9" y="44.9" width="20.2" height="20.2" class="target"/>

      <rect x="0" y="66" width="22" height="22" class="cell"/>
      <rect x="22" y="66" width="22" height="22" class="missing"/>
      <rect x="44" y="66" width="22" height="22" class="cell"/>
      <rect x="66" y="66" width="22" height="22" class="missing"/>
      <rect x="88" y="66" width="22" height="22" class="cell"/>
      <rect x="110" y="66" width="22" height="22" class="missing"/>

      <rect x="0" y="88" width="22" height="22" class="missing"/>
      <rect x="22" y="88" width="22" height="22" class="cell"/>
      <rect x="44" y="88" width="22" height="22" class="missing"/>
      <rect x="66" y="88" width="22" height="22" class="cell"/>
      <rect x="88" y="88" width="22" height="22" class="cell"/>
      <rect x="110" y="88" width="22" height="22" class="missing"/>

      <text x="-10" y="59" text-anchor="end" font-size="12" font-weight="700" class="accent-blue">u</text>
      <text x="121" y="-7" text-anchor="middle" font-size="12" font-weight="700" class="accent-teal">i</text>
      <text x="121" y="59" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" class="accent-rose">?</text>
    </g>
  </g>

  <text x="248" y="235" text-anchor="middle" font-size="26" font-weight="700" class="fg">=</text>

  <g transform="translate(286,126)">
    <rect x="0" y="0" width="138" height="214" rx="8" class="panel"/>
    <text x="69" y="-18" text-anchor="middle" font-size="15" font-weight="700" class="fg">user factors</text>
    <text x="69" y="24" text-anchor="middle" font-size="15" font-weight="700" class="fg">P</text>
    <text x="69" y="198" text-anchor="middle" font-size="12" class="muted">users x k</text>

    <g transform="translate(45,42)">
      <rect x="0" y="0" width="24" height="22" class="cell"/>
      <rect x="24" y="0" width="24" height="22" class="cell"/>
      <rect x="0" y="22" width="24" height="22" class="cell"/>
      <rect x="24" y="22" width="24" height="22" class="cell"/>
      <rect x="0.8" y="44.8" width="22.4" height="20.4" class="row"/>
      <rect x="24.8" y="44.8" width="22.4" height="20.4" class="row"/>
      <rect x="0" y="66" width="24" height="22" class="cell"/>
      <rect x="24" y="66" width="24" height="22" class="cell"/>
      <rect x="0" y="88" width="24" height="22" class="cell"/>
      <rect x="24" y="88" width="24" height="22" class="cell"/>
      <text x="-10" y="59" text-anchor="end" font-size="12" font-weight="700" class="accent-blue">p_u</text>
      <path d="M0 120 L48 120" class="dash"/>
      <text x="24" y="138" text-anchor="middle" font-size="12" class="muted">k columns</text>
    </g>
  </g>

  <text x="455" y="235" text-anchor="middle" font-size="26" font-weight="700" class="fg">x</text>

  <g transform="translate(492,126)">
    <rect x="0" y="0" width="232" height="214" rx="8" class="panel"/>
    <text x="116" y="-18" text-anchor="middle" font-size="15" font-weight="700" class="fg">item factors</text>
    <text x="116" y="24" text-anchor="middle" font-size="15" font-weight="700" class="fg">Q transposed</text>
    <text x="116" y="198" text-anchor="middle" font-size="12" class="muted">k x items</text>

    <g transform="translate(48,78)">
      <rect x="0" y="0" width="22" height="24" class="cell"/>
      <rect x="22" y="0" width="22" height="24" class="cell"/>
      <rect x="44" y="0" width="22" height="24" class="cell"/>
      <rect x="66" y="0" width="22" height="24" class="cell"/>
      <rect x="88" y="0" width="22" height="24" class="cell"/>
      <rect x="110.8" y="0.8" width="20.4" height="22.4" class="col"/>
      <rect x="0" y="24" width="22" height="24" class="cell"/>
      <rect x="22" y="24" width="22" height="24" class="cell"/>
      <rect x="44" y="24" width="22" height="24" class="cell"/>
      <rect x="66" y="24" width="22" height="24" class="cell"/>
      <rect x="88" y="24" width="22" height="24" class="cell"/>
      <rect x="110.8" y="24.8" width="20.4" height="22.4" class="col"/>
      <text x="121" y="-8" text-anchor="middle" font-size="12" font-weight="700" class="accent-teal">q_i</text>
      <path d="M-18 0 L-18 48" class="dash"/>
      <text x="-28" y="28" text-anchor="middle" transform="rotate(-90 -28 28)" font-size="12" class="muted">k rows</text>
    </g>
  </g>

  <path d="M376 277 C402 357, 480 372, 592 285" class="stroke" marker-end="url(#arrow)"/>

  <g transform="translate(156,374)">
    <rect x="0" y="-13" width="13" height="13" class="missing"/>
    <text x="20" y="-3" font-size="12" class="muted">unobserved during training</text>
    <rect x="232" y="-13" width="13" height="13" class="target"/>
    <text x="252" y="-3" font-size="12" class="muted">predicted from learned factors</text>
  </g>

  <text x="492" y="425" text-anchor="middle" font-size="14" font-weight="700" class="fg">one predicted cell is a dot product</text>
  <text x="492" y="448" text-anchor="middle" font-size="13" class="muted">R_hat[u,i] = dot(p_u, q_i)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="arrow-fill"/>
    </marker>
  </defs>
</svg>
