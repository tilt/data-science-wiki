<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Agent evaluation trace layers</title>
  <desc id="desc">An agent trace is evaluated across route, tool arguments, permissions, evidence use, final answer, and operational budget.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 27px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .label { font-size: 15px; font-weight: 800; }
    .small { font-size: 13px; fill: #374151; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
    .event { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.8; }
    .check { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.8; }
    .fail { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; }
    .line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <text x="480" y="40" text-anchor="middle" class="title">Agent evaluation grades the trace, not only the answer</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">A correct final response can still fail if the path used forbidden tools or exceeded budget.</text>

  <rect x="50" y="102" width="860" height="96" rx="10" class="panel"/>
  <text x="84" y="134" class="label">trace events</text>
  <g transform="translate(200,120)">
    <rect width="118" height="48" rx="8" class="event"/>
    <text x="59" y="30" text-anchor="middle" class="small">route</text>
    <rect x="144" width="118" height="48" rx="8" class="event"/>
    <text x="203" y="30" text-anchor="middle" class="small">tool call</text>
    <rect x="288" width="118" height="48" rx="8" class="event"/>
    <text x="347" y="30" text-anchor="middle" class="small">observation</text>
    <rect x="432" width="118" height="48" rx="8" class="event"/>
    <text x="491" y="30" text-anchor="middle" class="small">answer</text>
  </g>

  <path d="M480 198 V220 H134 M272 220 H824 M134 220 V236 M272 220 V236 M410 220 V236 M548 220 V236 M686 220 V236 M824 220 V236" class="line"/>
  <g transform="translate(72,236)">
    <rect width="124" height="74" rx="8" class="check"/>
    <text x="62" y="30" text-anchor="middle" class="label">route</text>
    <text x="62" y="54" text-anchor="middle" class="small">right path?</text>
    <rect x="138" width="124" height="74" rx="8" class="check"/>
    <text x="200" y="30" text-anchor="middle" class="label">arguments</text>
    <text x="200" y="54" text-anchor="middle" class="small">valid bounds?</text>
    <rect x="276" width="124" height="74" rx="8" class="fail"/>
    <text x="338" y="30" text-anchor="middle" class="label">policy</text>
    <text x="338" y="54" text-anchor="middle" class="small">forbidden?</text>
    <rect x="414" width="124" height="74" rx="8" class="check"/>
    <text x="476" y="30" text-anchor="middle" class="label">evidence</text>
    <text x="476" y="54" text-anchor="middle" class="small">supported?</text>
    <rect x="552" width="124" height="74" rx="8" class="check"/>
    <text x="614" y="30" text-anchor="middle" class="label">answer</text>
    <text x="614" y="54" text-anchor="middle" class="small">solves task?</text>
    <rect x="690" width="124" height="74" rx="8" class="check"/>
    <text x="752" y="30" text-anchor="middle" class="label">budget</text>
    <text x="752" y="54" text-anchor="middle" class="small">cost/latency?</text>
  </g>

  <rect x="150" y="350" width="660" height="74" rx="10" class="panel"/>
  <text x="480" y="374" text-anchor="middle" class="label">case pass = outcome AND required actions</text>
  <text x="480" y="397" text-anchor="middle" class="label">AND no forbidden events AND budget</text>
  <text x="480" y="418" text-anchor="middle" class="small">Stable event names, schema versions, and policy decisions make failures replayable.</text>
</svg>
