<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Precision and recall as overlapping sets</title>
  <desc id="desc">A binary classification diagram showing actual positives, predicted positives, true positives, false positives, false negatives, and true negatives, plus formulas for accuracy, precision, and recall.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .note { fill: #374151; font-weight: 600; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .universe { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
    .actual { fill: #bbf7d0; opacity: 0.68; }
    .predicted { fill: #fed7aa; opacity: 0.72; stroke: #f97316; stroke-width: 4; }
    .divider { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 8; }
    .dot-pos { fill: #16a34a; stroke: #064e3b; stroke-width: 2; }
    .dot-neg { fill: #ffffff; stroke: #64748b; stroke-width: 4; }
    .metric { font-size: 17px; font-weight: 800; }
    .formula { font-size: 15px; }
  </style>

  <text x="560" y="42" text-anchor="middle" font-size="30" font-weight="800">Accuracy, precision, and recall count different regions</text>
  <text x="560" y="74" text-anchor="middle" font-size="17" class="muted">Actual positives are the relevant cases; predicted positives are the retrieved cases.</text>

  <g transform="translate(48 106)">
    <rect x="0" y="0" width="660" height="430" rx="14" class="universe"/>
    <rect x="0" y="0" width="324" height="430" rx="14" class="actual"/>
    <line x1="324" y1="0" x2="324" y2="430" class="divider"/>
    <ellipse cx="324" cy="226" rx="222" ry="148" class="predicted"/>

    <g>
      <circle cx="76" cy="98" r="9" class="dot-pos"/>
      <circle cx="138" cy="96" r="9" class="dot-pos"/>
      <circle cx="286" cy="132" r="9" class="dot-pos"/>
      <circle cx="74" cy="214" r="9" class="dot-pos"/>
      <circle cx="194" cy="198" r="9" class="dot-pos"/>
      <circle cx="260" cy="304" r="9" class="dot-pos"/>
      <circle cx="158" cy="330" r="9" class="dot-pos"/>
      <circle cx="286" cy="338" r="9" class="dot-pos"/>
      <circle cx="82" cy="364" r="9" class="dot-pos"/>
      <circle cx="188" cy="396" r="9" class="dot-pos"/>
    </g>
    <g>
      <circle cx="552" cy="86" r="11" class="dot-neg"/>
      <circle cx="552" cy="114" r="11" class="dot-neg"/>
      <circle cx="358" cy="186" r="11" class="dot-neg"/>
      <circle cx="492" cy="292" r="11" class="dot-neg"/>
      <circle cx="392" cy="326" r="11" class="dot-neg"/>
      <circle cx="590" cy="340" r="11" class="dot-neg"/>
      <circle cx="492" cy="388" r="11" class="dot-neg"/>
      <circle cx="612" cy="224" r="11" class="dot-neg"/>
    </g>

    <text x="162" y="34" text-anchor="middle" font-size="18" font-weight="800">actual positive</text>
    <text x="162" y="60" text-anchor="middle" font-size="15" class="muted">relevant cases</text>
    <text x="492" y="34" text-anchor="middle" font-size="18" font-weight="800">actual negative</text>
    <text x="492" y="60" text-anchor="middle" font-size="15" class="muted">not relevant</text>

    <text x="216" y="232" text-anchor="middle" font-size="20" font-weight="800">true positives</text>
    <text x="216" y="260" text-anchor="middle" font-size="15" class="note">predicted positive</text>
    <text x="216" y="281" text-anchor="middle" font-size="15" class="note">and actually positive</text>

    <text x="440" y="232" text-anchor="middle" font-size="20" font-weight="800">false positives</text>
    <text x="440" y="260" text-anchor="middle" font-size="15" class="note">predicted positive</text>
    <text x="440" y="281" text-anchor="middle" font-size="15" class="note">but actually negative</text>

    <text x="128" y="142" text-anchor="middle" font-size="18" font-weight="800">false negatives</text>
    <text x="128" y="168" text-anchor="middle" font-size="15" class="muted">missed positives</text>
    <text x="574" y="136" text-anchor="middle" font-size="18" font-weight="800">true negatives</text>
    <text x="574" y="162" text-anchor="middle" font-size="15" class="muted">correct rejections</text>

    <path d="M350 374 L392 452" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="410" y="476" font-size="16" font-weight="800">predicted positive</text>
  </g>

  <g transform="translate(748 130)">
    <rect x="0" y="0" width="328" height="104" rx="12" class="panel"/>
    <text x="22" y="34" class="metric">accuracy</text>
    <text x="22" y="64" class="formula">all correct / all cases</text>
    <text x="22" y="88" class="formula">(TP + TN) / N</text>

    <rect x="0" y="132" width="328" height="104" rx="12" class="panel"/>
    <text x="22" y="162" class="metric">precision</text>
    <text x="22" y="192" class="formula">correct retrieved / retrieved</text>
    <text x="22" y="216" class="formula">TP / (TP + FP)</text>

    <rect x="0" y="264" width="328" height="104" rx="12" class="panel"/>
    <text x="22" y="294" class="metric">recall</text>
    <text x="22" y="324" class="formula">retrieved relevant / relevant</text>
    <text x="22" y="348" class="formula">TP / (TP + FN)</text>
  </g>

  <text x="560" y="628" text-anchor="middle" font-size="16" class="muted">A useful classifier metric should match the cost of false positives, false negatives, and missed minority classes.</text>
</svg>
