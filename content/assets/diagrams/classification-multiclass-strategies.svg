<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Multiclass classification can be native or decomposed into binary problems</title>
  <desc id="desc">Three panels compare softmax, one-vs-rest, and one-vs-one strategies. Softmax fits K scores at once, one-vs-rest trains K class-versus-all classifiers, and one-vs-one trains pairwise classifiers that vote.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 22px; font-weight: 800; }
    .subtitle, .muted { fill: #374151; }
    .subtitle { font-size: 14px; }
    .muted { font-size: 12px; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    .class-a { fill: #2563eb; }
    .class-b { fill: #f97316; }
    .class-c { fill: #14b8a6; }
    .box-a { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .box-b { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
    .box-c { fill: #ecfdf5; stroke: #14b8a6; stroke-width: 1.5; }
    .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.3; }
    .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .label { font-size: 13px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="380" y="36" text-anchor="middle" class="title">Multiclass strategies: one model or many binary views</text>
  <text x="380" y="62" text-anchor="middle" class="subtitle">Some algorithms are naturally multiclass; binary algorithms can be wrapped as one-vs-rest or one-vs-one.</text>

  <g transform="translate(36,100)">
    <rect width="214" height="286" rx="8" class="panel"/>
    <text x="107" y="28" text-anchor="middle" class="label">native softmax</text>
    <rect x="32" y="58" width="150" height="40" rx="8" class="box"/>
    <text x="107" y="83" text-anchor="middle" class="mono">z_A, z_B, z_C</text>
    <path d="M107 102 V134" class="arrow"/>
    <rect x="32" y="144" width="150" height="90" rx="8" class="box"/>
    <circle cx="58" cy="171" r="7" class="class-a"/><text x="76" y="175" class="mono">p_A = .18</text>
    <circle cx="58" cy="197" r="7" class="class-b"/><text x="76" y="201" class="mono">p_B = .62</text>
    <circle cx="58" cy="223" r="7" class="class-c"/><text x="76" y="227" class="mono">p_C = .20</text>
    <text x="107" y="264" text-anchor="middle" class="muted">one normalized</text>
    <text x="107" y="281" text-anchor="middle" class="muted">probability vector</text>
  </g>

  <g transform="translate(274,100)">
    <rect width="214" height="286" rx="8" class="panel"/>
    <text x="107" y="28" text-anchor="middle" class="label">one-vs-rest</text>
    <rect x="38" y="58" width="138" height="38" rx="8" class="box-a"/>
    <text x="107" y="82" text-anchor="middle" class="mono">A vs not-A</text>
    <rect x="38" y="112" width="138" height="38" rx="8" class="box-b"/>
    <text x="107" y="136" text-anchor="middle" class="mono">B vs not-B</text>
    <rect x="38" y="166" width="138" height="38" rx="8" class="box-c"/>
    <text x="107" y="190" text-anchor="middle" class="mono">C vs not-C</text>
    <path d="M107 210 V234" class="arrow"/>
    <text x="107" y="258" text-anchor="middle" class="muted">train K binary models;</text>
    <text x="107" y="276" text-anchor="middle" class="muted">choose highest score</text>
  </g>

  <g transform="translate(512,100)">
    <rect width="214" height="286" rx="8" class="panel"/>
    <text x="107" y="28" text-anchor="middle" class="label">one-vs-one</text>
    <rect x="42" y="58" width="130" height="38" rx="8" class="box"/>
    <text x="107" y="82" text-anchor="middle" class="mono">A vs B</text>
    <rect x="42" y="112" width="130" height="38" rx="8" class="box"/>
    <text x="107" y="136" text-anchor="middle" class="mono">A vs C</text>
    <rect x="42" y="166" width="130" height="38" rx="8" class="box"/>
    <text x="107" y="190" text-anchor="middle" class="mono">B vs C</text>
    <path d="M107 210 V234" class="arrow"/>
    <text x="107" y="258" text-anchor="middle" class="muted">train K(K-1)/2 models;</text>
    <text x="107" y="276" text-anchor="middle" class="muted">majority vote</text>
  </g>
</svg>
