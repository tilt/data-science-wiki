<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Gradient descent on a quadratic objective</title>
  <desc id="desc">A parabola with gradient descent iterates moving from x equals 6 toward the minimizer at x equals 1.</desc>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --grid: #d8dee9;
      --axis: #1f2937;
      --curve: #64748b;
      --path: #2563eb;
      --min: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1b;
        --panel: #181a1b;
        --text: #f8fafc;
        --muted: #d1d5db;
        --grid: #334155;
        --axis: #e5e7eb;
        --curve: #94a3b8;
        --path: #8ab4ff;
        --min: #f87171;
      }
    }
    text { fill: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: var(--muted); }
  </style>
  <rect width="900" height="500" rx="16" fill="var(--bg)"/>
  <text x="450" y="42" text-anchor="middle" font-size="28" font-weight="700">Gradient descent contracts error on a quadratic</text>
  <text x="450" y="72" text-anchor="middle" font-size="17" class="muted">For f(x) = (x - 1)^2 and eta = 0.2, each step keeps 60% of the distance to x = 1.</text>
  <rect x="80" y="100" width="720" height="310" rx="10" fill="var(--panel)" stroke="var(--grid)"/>

  <g stroke="var(--grid)" stroke-width="1">
    <line x1="130" y1="360" x2="760" y2="360"/>
    <line x1="130" y1="300" x2="760" y2="300"/>
    <line x1="130" y1="240" x2="760" y2="240"/>
    <line x1="130" y1="180" x2="760" y2="180"/>
    <line x1="130" y1="120" x2="760" y2="120"/>
    <line x1="220" y1="120" x2="220" y2="380"/>
    <line x1="340" y1="120" x2="340" y2="380"/>
    <line x1="460" y1="120" x2="460" y2="380"/>
    <line x1="580" y1="120" x2="580" y2="380"/>
    <line x1="700" y1="120" x2="700" y2="380"/>
  </g>
  <line x1="130" y1="380" x2="760" y2="380" stroke="var(--axis)" stroke-width="2"/>
  <line x1="130" y1="120" x2="130" y2="380" stroke="var(--axis)" stroke-width="2"/>
  <text x="445" y="456" text-anchor="middle" font-size="18" class="muted">parameter x</text>
  <text x="34" y="250" text-anchor="middle" transform="rotate(-90 34 250)" font-size="18" class="muted">loss f(x)</text>

  <path d="M160 136 C235 220 296 278 352 318 C408 358 462 378 520 380 C578 378 632 356 690 314 C728 286 752 262 780 228" fill="none" stroke="var(--curve)" stroke-width="5"/>
  <line x1="520" y1="120" x2="520" y2="380" stroke="var(--min)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="536" y="142" font-size="15" fill="var(--min)">minimum x=1</text>

  <polyline points="760,228 664,330 606,365 571,375 550,378 538,379 530,380" fill="none" stroke="var(--path)" stroke-width="4"/>
  <g fill="var(--path)">
    <circle cx="760" cy="228" r="7"/>
    <circle cx="664" cy="330" r="7"/>
    <circle cx="606" cy="365" r="7"/>
    <circle cx="571" cy="375" r="7"/>
    <circle cx="550" cy="378" r="7"/>
    <circle cx="538" cy="379" r="7"/>
    <circle cx="530" cy="380" r="7"/>
  </g>
  <text x="720" y="208" font-size="15">start x=6</text>
  <text x="552" y="404" font-size="15" class="muted">steps approach x=1</text>
</svg>
