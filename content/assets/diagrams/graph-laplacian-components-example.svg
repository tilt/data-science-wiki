<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Graph Laplacian zero eigenvectors for two connected components</title>
  <desc id="desc">A four-node graph with two disconnected pairs. Two node-value vectors are shown: f is one on the first pair and zero on the second; g is zero on the first pair and one on the second.</desc>
  <style>
    .fg { fill: #111827; }
    .muted { fill: #4b5563; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
    .edge-a { stroke: #2563eb; stroke-width: 4; }
    .edge-b { stroke: #f97316; stroke-width: 4; }
    .node { fill: #f8fafc; stroke-width: 3; }
    .node-a { stroke: #2563eb; }
    .node-b { stroke: #f97316; }
    .one { fill: #2563eb; font-weight: 700; }
    .zero { fill: #64748b; font-weight: 700; }
    .orange-one { fill: #f97316; font-weight: 700; }
    text { font-family: Arial, sans-serif; }
  </style>
  <rect width="760" height="420" fill="transparent"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" class="fg">Zero variation on disconnected components</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" class="muted">A Laplacian cannot see jumps between components when no edge crosses the gap.</text>

  <g transform="translate(42,92)">
    <rect width="300" height="260" rx="8" class="panel"/>
    <text x="150" y="30" text-anchor="middle" font-size="17" font-weight="700" class="fg">graph</text>
    <line x1="54" y1="124" x2="120" y2="124" class="edge-a"/>
    <line x1="54" y1="124" x2="120" y2="124" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="160" y1="92" x2="160" y2="156" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
    <line x1="200" y1="124" x2="266" y2="124" class="edge-b"/>
    <line x1="200" y1="124" x2="266" y2="124" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="54" cy="124" r="22" class="node node-a"/>
    <text x="54" y="130" text-anchor="middle" font-size="18" class="fg">1</text>
    <circle cx="120" cy="124" r="22" class="node node-a"/>
    <text x="120" y="130" text-anchor="middle" font-size="18" class="fg">2</text>
    <circle cx="200" cy="124" r="22" class="node node-b"/>
    <text x="200" y="130" text-anchor="middle" font-size="18" class="fg">3</text>
    <circle cx="266" cy="124" r="22" class="node node-b"/>
    <text x="266" y="130" text-anchor="middle" font-size="18" class="fg">4</text>
    <text x="87" y="190" text-anchor="middle" font-size="13" class="muted">component A</text>
    <text x="233" y="190" text-anchor="middle" font-size="13" class="muted">component B</text>
    <text x="150" y="226" text-anchor="middle" font-size="13" class="muted">no edge connects the two pairs</text>
  </g>

  <g transform="translate(382,92)">
    <rect width="150" height="260" rx="8" class="panel"/>
    <text x="75" y="30" text-anchor="middle" font-size="17" font-weight="700" class="fg">f vector</text>
    <text x="75" y="58" text-anchor="middle" font-size="13" class="muted">f = (1,1,0,0)</text>
    <g transform="translate(34,82)">
      <rect x="0" y="0" width="82" height="134" rx="6" fill="transparent" stroke="#cbd5e1"/>
      <text x="18" y="28" font-size="13" class="muted">node</text>
      <text x="58" y="28" font-size="13" class="muted">f</text>
      <text x="20" y="56" text-anchor="middle" font-size="15" class="fg">1</text>
      <text x="58" y="56" text-anchor="middle" font-size="16" class="one">1</text>
      <text x="20" y="80" text-anchor="middle" font-size="15" class="fg">2</text>
      <text x="58" y="80" text-anchor="middle" font-size="16" class="one">1</text>
      <text x="20" y="104" text-anchor="middle" font-size="15" class="fg">3</text>
      <text x="58" y="104" text-anchor="middle" font-size="16" class="zero">0</text>
      <text x="20" y="128" text-anchor="middle" font-size="15" class="fg">4</text>
      <text x="58" y="128" text-anchor="middle" font-size="16" class="zero">0</text>
    </g>
    <text x="75" y="236" text-anchor="middle" font-size="12" class="muted">constant on each edge</text>
  </g>

  <g transform="translate(572,92)">
    <rect width="150" height="260" rx="8" class="panel"/>
    <text x="75" y="30" text-anchor="middle" font-size="17" font-weight="700" class="fg">g vector</text>
    <text x="75" y="58" text-anchor="middle" font-size="13" class="muted">g = (0,0,1,1)</text>
    <g transform="translate(34,82)">
      <rect x="0" y="0" width="82" height="134" rx="6" fill="transparent" stroke="#cbd5e1"/>
      <text x="18" y="28" font-size="13" class="muted">node</text>
      <text x="58" y="28" font-size="13" class="muted">g</text>
      <text x="20" y="56" text-anchor="middle" font-size="15" class="fg">1</text>
      <text x="58" y="56" text-anchor="middle" font-size="16" class="zero">0</text>
      <text x="20" y="80" text-anchor="middle" font-size="15" class="fg">2</text>
      <text x="58" y="80" text-anchor="middle" font-size="16" class="zero">0</text>
      <text x="20" y="104" text-anchor="middle" font-size="15" class="fg">3</text>
      <text x="58" y="104" text-anchor="middle" font-size="16" class="orange-one">1</text>
      <text x="20" y="128" text-anchor="middle" font-size="15" class="fg">4</text>
      <text x="58" y="128" text-anchor="middle" font-size="16" class="orange-one">1</text>
    </g>
    <text x="75" y="236" text-anchor="middle" font-size="12" class="muted">constant on each edge</text>
  </g>
</svg>
