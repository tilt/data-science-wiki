<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Naive Bayes adds independent feature evidence per class</title>
  <desc id="desc">A document with tokens enters a Naive Bayes scoring table. Each class score is the log prior plus a sum of per-feature log likelihoods. The class with the larger total wins, even though correlated features are treated as independent.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 22px; font-weight: 800; }
    .subtitle, .muted { fill: #374151; }
    .subtitle { font-size: 14px; }
    .muted { font-size: 12px; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    .chip { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.4; }
    .class-a { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .class-b { fill: #fff7ed; stroke: #f97316; stroke-width: 1.6; }
    .winner { fill: #ecfdf5; stroke: #16a34a; stroke-width: 1.8; }
    .arrow { stroke: #64748b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .independent { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 6; }
    .label { font-size: 13px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="380" y="36" text-anchor="middle" class="title">Naive Bayes: add class evidence feature by feature</text>
  <text x="380" y="62" text-anchor="middle" class="subtitle">The model treats features as conditionally independent, then compares class log-scores.</text>

  <g transform="translate(52,96)">
    <rect width="214" height="250" rx="8" class="panel"/>
    <text x="107" y="28" text-anchor="middle" class="label">query features</text>
    <rect x="36" y="58" width="142" height="34" rx="8" class="chip"/>
    <text x="107" y="80" text-anchor="middle" class="mono">"discount"</text>
    <rect x="36" y="110" width="142" height="34" rx="8" class="chip"/>
    <text x="107" y="132" text-anchor="middle" class="mono">"invoice"</text>
    <rect x="36" y="162" width="142" height="34" rx="8" class="chip"/>
    <text x="107" y="184" text-anchor="middle" class="mono">"offer"</text>
    <line x1="107" y1="94" x2="107" y2="108" class="independent"/>
    <line x1="107" y1="146" x2="107" y2="160" class="independent"/>
    <text x="107" y="226" text-anchor="middle" class="muted">multiply likelihoods,</text>
    <text x="107" y="244" text-anchor="middle" class="muted">or add logs</text>
  </g>

  <path d="M278 220 H334" class="arrow"/>

  <g transform="translate(344,92)">
    <rect width="360" height="258" rx="8" class="panel"/>
    <text x="180" y="28" text-anchor="middle" class="label">class score table</text>
    <text x="42" y="62" class="muted">score(y) = log P(y) + sum_j log P(x_j | y)</text>

    <rect x="32" y="86" width="296" height="58" rx="8" class="class-a"/>
    <text x="52" y="111" class="label">class: spam</text>
    <text x="52" y="132" class="mono">-0.7 + -0.2 + -1.3 + -0.4 = -2.6</text>

    <rect x="32" y="158" width="296" height="58" rx="8" class="class-b"/>
    <text x="52" y="183" class="label">class: normal</text>
    <text x="52" y="204" class="mono">-0.5 + -2.1 + -0.4 + -2.2 = -5.2</text>

    <rect x="82" y="228" width="196" height="30" rx="8" class="winner"/>
    <text x="180" y="249" text-anchor="middle" class="label">larger log-score wins</text>
  </g>

  <text x="380" y="412" text-anchor="middle" class="muted">Good for sparse high-dimensional features; probabilities are often over-confident when features are correlated.</text>
</svg>
