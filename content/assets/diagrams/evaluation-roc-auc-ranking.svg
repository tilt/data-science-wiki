<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">ROC-AUC as area and pair ordering</title>
  <desc id="desc">A ROC curve with sample labels on the steps. Positives H, G, F, and E create vertical steps; negatives D, C, B, and A create horizontal steps. A pair grid shows 14 concordant positive-negative pairs and 2 discordant pairs.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .axis { stroke: #334155; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .small { font-size: 14px; }
    .label { font-size: 16px; font-weight: 700; }
  </style>

  <text x="540" y="42" text-anchor="middle" font-size="28" font-weight="800">ROC-AUC depends on rank order, not one threshold</text>
  <text x="540" y="74" text-anchor="middle" font-size="17" class="muted">Moving the threshold traces the ROC curve; pair ordering gives the same AUC.</text>

  <rect x="38" y="104" width="470" height="398" rx="14" class="panel"/>
  <text x="273" y="138" text-anchor="middle" font-size="22" font-weight="800">Area under the ROC curve</text>
  <g transform="translate(86 166)">
    <rect x="0" y="0" width="340" height="300" fill="#f8fafc" stroke="#cbd5e1"/>
    <g class="grid">
      <line x1="0" y1="240" x2="340" y2="240"/>
      <line x1="0" y1="180" x2="340" y2="180"/>
      <line x1="0" y1="120" x2="340" y2="120"/>
      <line x1="0" y1="60" x2="340" y2="60"/>
      <line x1="68" y1="0" x2="68" y2="300"/>
      <line x1="136" y1="0" x2="136" y2="300"/>
      <line x1="204" y1="0" x2="204" y2="300"/>
      <line x1="272" y1="0" x2="272" y2="300"/>
    </g>
    <rect x="0" y="150" width="85" height="150" fill="#fecaca" opacity="0.58"/>
    <rect x="85" y="0" width="85" height="300" fill="#bfdbfe" opacity="0.58"/>
    <rect x="170" y="0" width="85" height="300" fill="#bfdbfe" opacity="0.58"/>
    <rect x="255" y="0" width="85" height="300" fill="#bfdbfe" opacity="0.58"/>
    <path d="M0 300 L0 225 L0 150 L85 150 L85 75 L85 0 L170 0 L255 0 L340 0 L340 300 Z" fill="#bfdbfe" opacity="0.26"/>
    <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.72">
      <line x1="0" y1="0" x2="0" y2="300"/>
      <line x1="85" y1="0" x2="85" y2="300"/>
      <line x1="170" y1="0" x2="170" y2="300"/>
      <line x1="255" y1="0" x2="255" y2="300"/>
      <line x1="340" y1="0" x2="340" y2="300"/>
    </g>
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path d="M0 296 L0 229" stroke="#16a34a"/>
      <path d="M0 221 L0 154" stroke="#16a34a"/>
      <path d="M4 150 L81 150" stroke="#dc2626"/>
      <path d="M85 146 L85 79" stroke="#16a34a"/>
      <path d="M85 71 L85 4" stroke="#16a34a"/>
      <path d="M89 0 L166 0" stroke="#64748b"/>
      <path d="M174 0 L251 0" stroke="#64748b"/>
      <path d="M259 0 L336 0" stroke="#64748b"/>
    </g>
    <line x1="0" y1="300" x2="340" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
    <line x1="0" y1="300" x2="340" y2="300" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="300" class="axis"/>
    <g class="small muted">
      <text x="-10" y="304" text-anchor="end">0</text>
      <text x="-10" y="154" text-anchor="end">0.5</text>
      <text x="-10" y="4" text-anchor="end">1.0</text>
      <text x="0" y="323" text-anchor="middle">0</text>
      <text x="170" y="323" text-anchor="middle">0.5</text>
      <text x="340" y="323" text-anchor="middle">1.0</text>
    </g>
    <text x="170" y="354" text-anchor="middle" font-size="15" class="muted">false positive rate</text>
    <text x="-52" y="150" text-anchor="middle" transform="rotate(-90 -52 150)" font-size="15" class="muted">true positive rate</text>
    <text x="228" y="64" font-size="18" font-weight="800" fill="#1d4ed8">AUC = 0.875</text>
    <g font-size="14" font-weight="800" text-anchor="middle">
      <rect x="12" y="258" width="28" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="26" y="276" fill="#14532d">H</text>
      <rect x="12" y="184" width="28" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="26" y="202" fill="#14532d">G</text>
      <rect x="28" y="126" width="28" height="24" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="42" y="144" fill="#7f1d1d">D</text>
      <rect x="97" y="108" width="28" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="111" y="126" fill="#14532d">F</text>
      <rect x="97" y="36" width="28" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="111" y="54" fill="#14532d">E</text>
      <rect x="124" y="14" width="28" height="24" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="138" y="32" fill="#334155">C</text>
      <rect x="209" y="14" width="28" height="24" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="223" y="32" fill="#334155">B</text>
      <rect x="294" y="14" width="28" height="24" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="308" y="32" fill="#334155">A</text>
    </g>
  </g>

  <rect x="548" y="104" width="494" height="398" rx="14" class="panel"/>
  <text x="795" y="138" text-anchor="middle" font-size="22" font-weight="800">Positive-negative pair ordering</text>
  <text x="795" y="166" text-anchor="middle" font-size="15" class="muted">Each cell asks: is the positive score higher than the negative score?</text>

  <g transform="translate(622 222)">
    <g class="label">
      <text x="126" y="-18" text-anchor="middle">D- .60</text>
      <text x="201" y="-18" text-anchor="middle">C- .35</text>
      <text x="276" y="-18" text-anchor="middle">B- .20</text>
      <text x="351" y="-18" text-anchor="middle">A- .05</text>
      <text x="-16" y="34" text-anchor="end">H+ .95</text>
      <text x="-16" y="89" text-anchor="end">G+ .80</text>
      <text x="-16" y="144" text-anchor="end">F+ .55</text>
      <text x="-16" y="199" text-anchor="end">E+ .40</text>
    </g>

    <g stroke="#ffffff" stroke-width="2">
      <rect x="88" y="0" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="163" y="0" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="238" y="0" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="313" y="0" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="88" y="55" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="163" y="55" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="238" y="55" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="313" y="55" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="88" y="110" width="75" height="55" rx="8" fill="#fecaca"/>
      <rect x="163" y="110" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="238" y="110" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="313" y="110" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="88" y="165" width="75" height="55" rx="8" fill="#fecaca"/>
      <rect x="163" y="165" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="238" y="165" width="75" height="55" rx="8" fill="#bbf7d0"/>
      <rect x="313" y="165" width="75" height="55" rx="8" fill="#bbf7d0"/>
    </g>
    <g font-size="16" font-weight="800">
      <text x="126" y="35" text-anchor="middle">ok</text>
      <text x="201" y="35" text-anchor="middle">ok</text>
      <text x="276" y="35" text-anchor="middle">ok</text>
      <text x="351" y="35" text-anchor="middle">ok</text>
      <text x="126" y="90" text-anchor="middle">ok</text>
      <text x="201" y="90" text-anchor="middle">ok</text>
      <text x="276" y="90" text-anchor="middle">ok</text>
      <text x="351" y="90" text-anchor="middle">ok</text>
      <text x="126" y="145" text-anchor="middle">inv</text>
      <text x="201" y="145" text-anchor="middle">ok</text>
      <text x="276" y="145" text-anchor="middle">ok</text>
      <text x="351" y="145" text-anchor="middle">ok</text>
      <text x="126" y="200" text-anchor="middle">inv</text>
      <text x="201" y="200" text-anchor="middle">ok</text>
      <text x="276" y="200" text-anchor="middle">ok</text>
      <text x="351" y="200" text-anchor="middle">ok</text>
    </g>
  </g>

  <text x="795" y="472" text-anchor="middle" font-size="18" font-weight="800">14 concordant pairs, 2 discordant inversions</text>
  <text x="795" y="496" text-anchor="middle" font-size="16" class="muted">AUC = 14 / 16 = 0.875; ties would count as half-correct pairs.</text>
</svg>
