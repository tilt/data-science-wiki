<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Positive covariance sample cloud</title>
  <desc id="desc">Scatter plot schematic showing points stretched along an upward trend, with an ellipse indicating positive covariance.</desc>
  <rect x="0" y="0" width="760" height="430" fill="transparent"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Positive covariance creates an elongated sample cloud</text>
  <text x="380" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">The covariance term controls the direction of joint variation; correlation rescales it by both standard deviations.</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="100" x2="670" y2="100"/>
    <line x1="90" y1="160" x2="670" y2="160"/>
    <line x1="90" y1="220" x2="670" y2="220"/>
    <line x1="90" y1="280" x2="670" y2="280"/>
    <line x1="90" y1="340" x2="670" y2="340"/>
    <line x1="160" y1="90" x2="160" y2="350"/>
    <line x1="270" y1="90" x2="270" y2="350"/>
    <line x1="380" y1="90" x2="380" y2="350"/>
    <line x1="490" y1="90" x2="490" y2="350"/>
    <line x1="600" y1="90" x2="600" y2="350"/>
  </g>
  <line x1="90" y1="220" x2="670" y2="220" stroke="#111827" stroke-width="1.5"/>
  <line x1="380" y1="350" x2="380" y2="90" stroke="#111827" stroke-width="1.5"/>
  <text x="667" y="242" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#374151">X</text>
  <text x="397" y="104" font-family="Arial, sans-serif" font-size="14" fill="#374151">Y</text>

  <ellipse cx="380" cy="220" rx="230" ry="50" transform="rotate(-28 380 220)" fill="#bfdbfe" opacity="0.45" stroke="#2563eb" stroke-width="3"/>
  <line x1="155" y1="340" x2="618" y2="98" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 6" opacity="0.8"/>

  <g fill="#0f766e" opacity="0.78">
    <circle cx="158" cy="326" r="4"/>
    <circle cx="188" cy="304" r="4"/>
    <circle cx="205" cy="320" r="4"/>
    <circle cx="228" cy="289" r="4"/>
    <circle cx="247" cy="304" r="4"/>
    <circle cx="266" cy="270" r="4"/>
    <circle cx="286" cy="280" r="4"/>
    <circle cx="305" cy="258" r="4"/>
    <circle cx="320" cy="270" r="4"/>
    <circle cx="338" cy="242" r="4"/>
    <circle cx="356" cy="248" r="4"/>
    <circle cx="374" cy="224" r="4"/>
    <circle cx="391" cy="232" r="4"/>
    <circle cx="410" cy="210" r="4"/>
    <circle cx="428" cy="216" r="4"/>
    <circle cx="446" cy="194" r="4"/>
    <circle cx="464" cy="202" r="4"/>
    <circle cx="482" cy="178" r="4"/>
    <circle cx="500" cy="188" r="4"/>
    <circle cx="522" cy="162" r="4"/>
    <circle cx="540" cy="174" r="4"/>
    <circle cx="562" cy="146" r="4"/>
    <circle cx="584" cy="132" r="4"/>
    <circle cx="606" cy="118" r="4"/>
    <circle cx="625" cy="128" r="4"/>
    <circle cx="242" cy="260" r="4"/>
    <circle cx="300" cy="232" r="4"/>
    <circle cx="352" cy="210" r="4"/>
    <circle cx="438" cy="238" r="4"/>
    <circle cx="495" cy="154" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#111827">
    <path d="M530 272 C500 245 484 226 466 202" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="536" y="282" font-size="14">above-average X tends to</text>
    <text x="536" y="300" font-size="14">come with above-average Y</text>
    <text x="100" y="390" font-size="14">Here rho is positive and large: the cloud is narrow around an upward direction.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
