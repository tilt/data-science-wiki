<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Temperature probability spread</title>
  <desc id="desc">Grouped bar chart comparing token probabilities at low and high temperature.</desc>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --grid: #d8dee9;
      --axis: #1f2937;
      --low: #2563eb;
      --high: #0f766e;
      --note: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1b;
        --panel: #181a1b;
        --text: #f8fafc;
        --muted: #d1d5db;
        --grid: #334155;
        --axis: #e5e7eb;
        --low: #8ab4ff;
        --high: #5eead4;
        --note: #1e293b;
      }
    }
    text { fill: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: var(--muted); }
  </style>
  <rect width="900" height="500" rx="16" fill="var(--bg)"/>
  <text x="450" y="42" text-anchor="middle" font-size="28" font-weight="700">Temperature redistributes probability mass</text>
  <text x="450" y="72" text-anchor="middle" font-size="17" class="muted">The token ranking is unchanged, but the tail becomes more likely.</text>
  <rect x="78" y="100" width="690" height="310" rx="10" fill="var(--panel)" stroke="var(--grid)"/>

  <g stroke="var(--grid)" stroke-width="1">
    <line x1="128" y1="360" x2="728" y2="360"/>
    <line x1="128" y1="300" x2="728" y2="300"/>
    <line x1="128" y1="240" x2="728" y2="240"/>
    <line x1="128" y1="180" x2="728" y2="180"/>
    <line x1="128" y1="120" x2="728" y2="120"/>
  </g>
  <line x1="128" y1="380" x2="728" y2="380" stroke="var(--axis)" stroke-width="2"/>
  <line x1="128" y1="120" x2="128" y2="380" stroke="var(--axis)" stroke-width="2"/>
  <text x="428" y="456" text-anchor="middle" font-size="18" class="muted">token rank</text>
  <text x="32" y="250" text-anchor="middle" transform="rotate(-90 32 250)" font-size="18" class="muted">probability</text>

  <g font-size="14" class="muted">
    <text x="116" y="384" text-anchor="end">0</text>
    <text x="116" y="304" text-anchor="end">0.25</text>
    <text x="116" y="224" text-anchor="end">0.50</text>
    <text x="116" y="144" text-anchor="end">0.75</text>
  </g>

  <g>
    <rect x="165" y="138" width="26" height="242" fill="var(--low)"/>
    <rect x="195" y="230" width="26" height="150" fill="var(--high)"/>
    <rect x="255" y="330" width="26" height="50" fill="var(--low)"/>
    <rect x="285" y="308" width="26" height="72" fill="var(--high)"/>
    <rect x="345" y="361" width="26" height="19" fill="var(--low)"/>
    <rect x="375" y="335" width="26" height="45" fill="var(--high)"/>
    <rect x="465" y="373" width="26" height="7" fill="var(--low)"/>
    <rect x="495" y="352" width="26" height="28" fill="var(--high)"/>
    <rect x="585" y="378" width="26" height="2" fill="var(--low)"/>
    <rect x="615" y="364" width="26" height="16" fill="var(--high)"/>
    <rect x="675" y="379" width="26" height="1" fill="var(--low)"/>
    <rect x="705" y="371" width="26" height="9" fill="var(--high)"/>
  </g>

  <g font-size="14" class="muted">
    <text x="193" y="405" text-anchor="middle">alpha</text>
    <text x="283" y="405" text-anchor="middle">beta</text>
    <text x="373" y="405" text-anchor="middle">gamma</text>
    <text x="493" y="405" text-anchor="middle">delta</text>
    <text x="613" y="405" text-anchor="middle">epsilon</text>
    <text x="704" y="405" text-anchor="middle">zeta</text>
  </g>

  <rect x="790" y="138" width="86" height="78" rx="8" fill="var(--note)" stroke="var(--grid)"/>
  <rect x="806" y="160" width="18" height="18" fill="var(--low)"/>
  <text x="833" y="175" font-size="16">T=0.7</text>
  <rect x="806" y="188" width="18" height="18" fill="var(--high)"/>
  <text x="833" y="203" font-size="16">T=1.5</text>
  <text x="790" y="266" font-size="15" class="muted">Lower T:</text>
  <text x="790" y="288" font-size="15" class="muted">sharper top choice.</text>
  <text x="790" y="326" font-size="15" class="muted">Higher T:</text>
  <text x="790" y="348" font-size="15" class="muted">more tail mass.</text>
</svg>
