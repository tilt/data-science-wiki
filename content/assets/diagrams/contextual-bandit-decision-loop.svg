<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Contextual bandit decision loop</title>
  <desc id="desc">A contextual bandit observes request features, filters eligible arms, scores each action with reward and uncertainty, serves one action, observes only that action's reward, and updates policy state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 28px; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #475569; }
    .h { font-size: 18px; font-weight: 800; }
    .body { font-size: 15px; fill: #334155; }
    .small { font-size: 13px; fill: #475569; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; }
    .context { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .elig { fill: #ecfdf5; stroke: #0f766e; stroke-width: 2; }
    .score { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .serve { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .reward { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
    .state { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .repeat-line { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; }
    .repeat-head { fill: #64748b; }
    .note { font-size: 13px; fill: #475569; font-style: italic; }
  </style>

  <text x="540" y="42" text-anchor="middle" class="title">Context changes which arm is worth exploring</text>
  <text x="540" y="70" text-anchor="middle" class="subtitle">The policy scores eligible actions for this request, then learns only from the action it served.</text>

  <g transform="translate(70 0)">
  <g transform="translate(40,118)">
    <rect width="210" height="128" rx="10" class="context"/>
    <text x="105" y="31" text-anchor="middle" class="h">1. observe context</text>
    <text x="24" y="62" class="body">context before serving</text>
    <text x="24" y="88" class="small">user segment, device,</text>
    <text x="24" y="108" class="small">query, time, item features</text>
  </g>

  <line x1="250" y1="182" x2="305" y2="182" class="arrow"/>

  <g transform="translate(305,118)">
    <rect width="210" height="128" rx="10" class="elig"/>
    <text x="105" y="31" text-anchor="middle" class="h">2. filter arms</text>
    <text x="24" y="62" class="body">eligible action set</text>
    <text x="24" y="88" class="small">availability, policy,</text>
    <text x="24" y="108" class="small">fatigue, permissions</text>
  </g>

  <line x1="515" y1="182" x2="570" y2="182" class="arrow"/>

  <g transform="translate(570,118)">
    <rect width="370" height="128" rx="10" class="score"/>
    <text x="185" y="31" text-anchor="middle" class="h">3. score each eligible action</text>
    <text x="30" y="66" class="body">predicted reward + uncertainty bonus</text>
    <text x="30" y="90" class="small">LinUCB score combines prediction</text>
    <text x="30" y="110" class="small">with context-specific uncertainty</text>
  </g>

  <line x1="755" y1="246" x2="755" y2="300" class="arrow"/>

  <g transform="translate(600,300)">
    <rect width="310" height="104" rx="10" class="serve"/>
    <text x="155" y="31" text-anchor="middle" class="h">4. serve one chosen arm</text>
    <text x="28" y="64" class="body">the user sees only the chosen action</text>
    <text x="28" y="86" class="small">unchosen rewards remain missing</text>
  </g>

  <line x1="600" y1="352" x2="530" y2="352" class="arrow"/>

  <g transform="translate(260,300)">
    <rect width="270" height="104" rx="10" class="reward"/>
    <text x="135" y="31" text-anchor="middle" class="h">5. observe reward</text>
    <text x="25" y="64" class="body">click, save, purchase, or no event</text>
    <text x="25" y="86" class="small">reward belongs to chosen arm only</text>
  </g>

  <line x1="395" y1="404" x2="395" y2="458" class="arrow"/>

  <g transform="translate(245,458)">
    <rect width="300" height="76" rx="10" class="state"/>
    <text x="150" y="30" text-anchor="middle" class="h">6. update policy state</text>
    <text x="30" y="56" class="body">update only the chosen arm's model</text>
  </g>

  <path d="M 245 486 C 92 486 -42 422 -42 306 C -42 232 -18 182 24 182" class="repeat-line"/>
  <polygon points="40,182 24,173 24,191" class="repeat-head"/>
  <text x="-30" y="470" class="note">next request:</text>
  <text x="-30" y="490" class="note">fresh context</text>

  <g transform="translate(50,340)">
    <rect width="160" height="100" rx="9" class="box"/>
    <text x="80" y="31" text-anchor="middle" class="h">log for replay</text>
    <text x="22" y="58" class="small">context, action</text>
    <text x="22" y="78" class="small">reward, propensity</text>
  </g>
  <path d="M 260 374 C 235 390 225 390 210 390" class="arrow"/>
  </g>
</svg>
