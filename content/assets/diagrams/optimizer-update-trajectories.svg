<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Optimizer update trajectories</title>
  <desc id="desc">A one-dimensional loss curve with SGD, momentum, and Adam update points showing different paths toward the minimum.</desc>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --grid: #d8dee9;
      --axis: #1f2937;
      --loss: #64748b;
      --sgd: #2563eb;
      --momentum: #ea580c;
      --adam: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1b;
        --panel: #181a1b;
        --text: #f8fafc;
        --muted: #d1d5db;
        --grid: #334155;
        --axis: #e5e7eb;
        --loss: #94a3b8;
        --sgd: #8ab4ff;
        --momentum: #fb923c;
        --adam: #5eead4;
      }
    }
    text { fill: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: var(--muted); }
  </style>
  <rect width="920" height="520" rx="16" fill="var(--bg)"/>
  <rect x="54" y="52" width="812" height="388" rx="10" fill="var(--panel)" stroke="var(--grid)"/>

  <text x="460" y="40" text-anchor="middle" font-size="28" font-weight="700">Optimizers use the same gradients differently</text>
  <text x="460" y="482" text-anchor="middle" font-size="18" class="muted">parameter value theta</text>
  <text x="28" y="252" text-anchor="middle" transform="rotate(-90 28 252)" font-size="18" class="muted">loss</text>

  <g stroke="var(--grid)" stroke-width="1">
    <line x1="120" y1="390" x2="820" y2="390"/>
    <line x1="120" y1="310" x2="820" y2="310"/>
    <line x1="120" y1="230" x2="820" y2="230"/>
    <line x1="120" y1="150" x2="820" y2="150"/>
    <line x1="220" y1="90" x2="220" y2="408"/>
    <line x1="360" y1="90" x2="360" y2="408"/>
    <line x1="500" y1="90" x2="500" y2="408"/>
    <line x1="640" y1="90" x2="640" y2="408"/>
    <line x1="780" y1="90" x2="780" y2="408"/>
  </g>
  <line x1="100" y1="408" x2="840" y2="408" stroke="var(--axis)" stroke-width="2"/>
  <line x1="100" y1="408" x2="100" y2="88" stroke="var(--axis)" stroke-width="2"/>

  <path d="M120 116 C205 177 270 252 345 317 C420 381 505 399 575 360 C650 318 705 230 820 105" fill="none" stroke="var(--loss)" stroke-width="5"/>
  <circle cx="510" cy="392" r="5" fill="var(--axis)"/>
  <text x="512" y="374" font-size="15" class="muted">minimum</text>

  <polyline points="185,155 313,289 390,347 436,372 464,384 481,389" fill="none" stroke="var(--sgd)" stroke-width="4"/>
  <g fill="var(--sgd)">
    <circle cx="185" cy="155" r="7"/>
    <circle cx="313" cy="289" r="7"/>
    <circle cx="390" cy="347" r="7"/>
    <circle cx="436" cy="372" r="7"/>
    <circle cx="464" cy="384" r="7"/>
    <circle cx="481" cy="389" r="7"/>
  </g>

  <polyline points="185,155 343,316 468,385 566,366 524,389 500,392" fill="none" stroke="var(--momentum)" stroke-width="4"/>
  <g fill="var(--momentum)">
    <rect x="178" y="148" width="14" height="14" rx="2"/>
    <rect x="336" y="309" width="14" height="14" rx="2"/>
    <rect x="461" y="378" width="14" height="14" rx="2"/>
    <rect x="559" y="359" width="14" height="14" rx="2"/>
    <rect x="517" y="382" width="14" height="14" rx="2"/>
    <rect x="493" y="385" width="14" height="14" rx="2"/>
  </g>

  <polyline points="185,155 282,261 367,337 440,374 492,391 510,392" fill="none" stroke="var(--adam)" stroke-width="4"/>
  <g fill="var(--adam)">
    <polygon points="185,146 194,164 176,164"/>
    <polygon points="282,252 291,270 273,270"/>
    <polygon points="367,328 376,346 358,346"/>
    <polygon points="440,365 449,383 431,383"/>
    <polygon points="492,382 501,400 483,400"/>
    <polygon points="510,383 519,401 501,401"/>
  </g>

  <g font-size="17">
    <circle cx="640" cy="120" r="7" fill="var(--sgd)"/>
    <text x="658" y="126">SGD: current gradient only</text>
    <rect x="633" y="153" width="14" height="14" rx="2" fill="var(--momentum)"/>
    <text x="658" y="167">Momentum: gradient plus velocity</text>
    <polygon points="640,193 649,211 631,211" fill="var(--adam)"/>
    <text x="658" y="209">Adam: moment-normalized step</text>
  </g>

  <text x="145" y="432" font-size="14" class="muted">start</text>
  <text x="500" y="432" font-size="14" class="muted">target basin</text>
</svg>
