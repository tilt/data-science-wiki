<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous driving system stack</title>
  <desc id="desc">Autonomous driving maps multi-sensor inputs to perception, prediction, planning, control, and safety evidence, with simulation and evaluation around the loop.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#1f2937"], [fill="#374151"], [fill="#4b5563"], [fill="#0f172a"], [fill="#020617"], [fill="#000000"] { fill: #f8fafc !important; }
      [stroke="#111827"], [stroke="#1f2937"], [stroke="#374151"], [stroke="#4b5563"], [stroke="#0f172a"], [stroke="#020617"], [stroke="#000000"] { stroke: #e5e7eb !important; }
    }
  </style>
  <rect width="940" height="440" fill="transparent"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="470" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Autonomous driving is a full-stack decision system</text>
  <text x="470" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">The safety-critical output is a planned and controlled trajectory, not just a perception label.</text>

  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="38" y="132" width="120" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="98" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">sensors</text>
    <text x="98" y="182" text-anchor="middle" fill="#374151">camera</text>
    <text x="98" y="202" text-anchor="middle" fill="#374151">lidar/radar</text>
    <text x="98" y="222" text-anchor="middle" fill="#374151">maps + ego</text>

    <rect x="195" y="132" width="125" height="92" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="257" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">perception</text>
    <text x="257" y="183" text-anchor="middle" fill="#374151">objects</text>
    <text x="257" y="203" text-anchor="middle" fill="#374151">occupancy</text>
    <text x="257" y="223" text-anchor="middle" fill="#374151">lanes/signs</text>

    <rect x="357" y="132" width="125" height="92" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="419" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">prediction</text>
    <text x="419" y="184" text-anchor="middle" fill="#374151">tracks</text>
    <text x="419" y="204" text-anchor="middle" fill="#374151">intent</text>
    <text x="419" y="224" text-anchor="middle" fill="#374151">future paths</text>

    <rect x="519" y="132" width="125" height="92" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="581" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">planning</text>
    <text x="581" y="184" text-anchor="middle" fill="#374151">candidate</text>
    <text x="581" y="204" text-anchor="middle" fill="#374151">trajectories</text>
    <text x="581" y="224" text-anchor="middle" fill="#374151">cost + rules</text>

    <rect x="681" y="132" width="125" height="92" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="743" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">control</text>
    <text x="743" y="184" text-anchor="middle" fill="#374151">steer</text>
    <text x="743" y="204" text-anchor="middle" fill="#374151">brake</text>
    <text x="743" y="224" text-anchor="middle" fill="#374151">throttle</text>

    <rect x="210" y="295" width="210" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="315" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">simulation + replay</text>
    <text x="315" y="346" text-anchor="middle" fill="#374151">closed-loop scenarios and logs</text>

    <rect x="520" y="295" width="220" height="70" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="630" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">safety evidence</text>
    <text x="630" y="346" text-anchor="middle" fill="#374151">slices, residual risk, audit trail</text>

    <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M159 178 L191 178"/>
      <path d="M321 178 L353 178"/>
      <path d="M483 178 L515 178"/>
      <path d="M645 178 L677 178"/>
      <path d="M581 225 L581 290"/>
      <path d="M420 330 L515 330"/>
      <path d="M630 295 C635 255 628 238 603 225"/>
      <path d="M315 295 C320 250 350 225 390 210"/>
    </g>
  </g>
</svg>
