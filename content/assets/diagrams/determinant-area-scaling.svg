<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="title desc">
  <title id="title">A determinant is signed area scaling in two dimensions</title>
  <desc id="desc">The unit square is transformed by the matrix [[2,1],[1,2]] into a parallelogram with columns (2,1) and (1,2). Its area is determinant 3.</desc>
  <style>
    .fg { fill: #111827; }
    .muted { fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #94a3b8; stroke-width: 1.4; }
    .square { fill: #14b8a6; opacity: 0.14; stroke: #0f766e; stroke-width: 3; }
    .para { fill: #2563eb; opacity: 0.14; stroke: #2563eb; stroke-width: 3; }
    .vec-a { stroke: #2563eb; fill: #2563eb; }
    .vec-b { stroke: #f97316; fill: #f97316; }
    .label-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    text { font-family: Arial, sans-serif; }
  </style>
  <rect width="780" height="480" fill="transparent"/>
  <text x="390" y="36" text-anchor="middle" font-size="23" font-weight="700" class="fg">Determinant as area scaling</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" class="muted">A = [[2,1],[1,2]] sends the unit square to a parallelogram whose area is det(A)=3.</text>

  <defs>
    <marker id="arrow-blue-det" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange-det" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
  </defs>

  <g transform="translate(70,92)">
    <line x1="0" y1="260" x2="650" y2="260" class="axis"/>
    <line x1="70" y1="0" x2="70" y2="320" class="axis"/>
    <g class="grid">
      <line x1="170" y1="0" x2="170" y2="320"/><line x1="270" y1="0" x2="270" y2="320"/><line x1="370" y1="0" x2="370" y2="320"/><line x1="470" y1="0" x2="470" y2="320"/><line x1="570" y1="0" x2="570" y2="320"/>
      <line x1="0" y1="60" x2="650" y2="60"/><line x1="0" y1="160" x2="650" y2="160"/>
    </g>

    <polygon points="70,260 170,260 170,160 70,160" class="square"/>
    <text x="120" y="147" text-anchor="middle" font-size="14" font-weight="700" class="fg">unit square</text>
    <text x="120" y="286" text-anchor="middle" font-size="13" class="muted">area = 1</text>

    <polygon points="340,260 540,160 640,60 440,160" class="para"/>
    <line x1="340" y1="260" x2="540" y2="160" class="vec-a" stroke-width="4" marker-end="url(#arrow-blue-det)"/>
    <line x1="340" y1="260" x2="440" y2="160" class="vec-b" stroke-width="4" marker-end="url(#arrow-orange-det)"/>
    <text x="508" y="151" font-size="14" font-weight="700" class="vec-a">column 1 = (2,1)</text>
    <text x="376" y="148" font-size="14" font-weight="700" class="vec-b">column 2 = (1,2)</text>
    <text x="490" y="43" text-anchor="middle" font-size="14" font-weight="700" class="fg">transformed parallelogram</text>
    <text x="490" y="286" text-anchor="middle" font-size="13" class="muted">area = |2*2 - 1*1| = 3</text>

    <g transform="translate(90,322)">
      <rect width="520" height="54" rx="7" class="label-box"/>
      <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="700" class="fg">intuition</text>
      <text x="260" y="43" text-anchor="middle" font-size="13" class="muted">det(A) tells how much A scales oriented area; zero means the shape collapses flat.</text>
    </g>
  </g>
</svg>
