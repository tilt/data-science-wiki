<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Common distribution shapes</title>
  <desc id="desc">Comparison of a binomial probability mass function, a Poisson probability mass function, and a gamma density.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#1f2937"], [fill="#374151"], [fill="#4b5563"], [fill="#0f172a"], [fill="#020617"], [fill="#000000"] { fill: #f8fafc !important; }
      [stroke="#111827"], [stroke="#1f2937"], [stroke="#374151"], [stroke="#4b5563"], [stroke="#0f172a"], [stroke="#020617"], [stroke="#000000"] { stroke: #e5e7eb !important; }
    }
  </style>
  <rect x="0" y="0" width="760" height="430" fill="transparent"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Different mechanisms produce different shapes</text>
  <text x="380" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">PMF bars for count variables; density curve for a positive continuous variable</text>

  <line x1="70" y1="340" x2="690" y2="340" stroke="#111827" stroke-width="1.5"/>
  <line x1="70" y1="70" x2="70" y2="340" stroke="#111827" stroke-width="1.5"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="70" y1="276" x2="690" y2="276"/>
    <line x1="70" y1="211" x2="690" y2="211"/>
    <line x1="70" y1="147" x2="690" y2="147"/>
    <line x1="70" y1="83" x2="690" y2="83"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <text x="62" y="344" text-anchor="end">0</text>
    <text x="62" y="280" text-anchor="end">0.05</text>
    <text x="62" y="215" text-anchor="end">0.10</text>
    <text x="62" y="151" text-anchor="end">0.15</text>
    <text x="62" y="87" text-anchor="end">0.20</text>
    <text x="70" y="362" text-anchor="middle">0</text>
    <text x="242" y="362" text-anchor="middle">5</text>
    <text x="414" y="362" text-anchor="middle">10</text>
    <text x="587" y="362" text-anchor="middle">15</text>
    <text x="690" y="362" text-anchor="middle">18</text>
    <text x="380" y="394" text-anchor="middle" font-size="14">value</text>
    <text x="24" y="210" text-anchor="middle" transform="rotate(-90 24 210)" font-size="14">probability mass or density</text>
  </g>

  <g fill="#14b8a6" opacity="0.78">
    <rect x="64" y="339" width="10" height="1"/>
    <rect x="99" y="331" width="10" height="9"/>
    <rect x="133" y="304" width="10" height="36"/>
    <rect x="168" y="248" width="10" height="92"/>
    <rect x="202" y="172" width="10" height="168"/>
    <rect x="236" y="110" width="10" height="230"/>
    <rect x="271" y="94" width="10" height="246"/>
    <rect x="305" y="129" width="10" height="211"/>
    <rect x="340" y="193" width="10" height="147"/>
    <rect x="374" y="256" width="10" height="84"/>
    <rect x="409" y="300" width="10" height="40"/>
    <rect x="443" y="325" width="10" height="15"/>
    <rect x="477" y="335" width="10" height="5"/>
  </g>

  <g fill="#f97316" opacity="0.72">
    <rect x="78" y="316" width="10" height="24"/>
    <rect x="112" y="246" width="10" height="94"/>
    <rect x="147" y="152" width="10" height="188"/>
    <rect x="181" y="89" width="10" height="251"/>
    <rect x="216" y="89" width="10" height="251"/>
    <rect x="250" y="139" width="10" height="201"/>
    <rect x="284" y="206" width="10" height="134"/>
    <rect x="319" y="264" width="10" height="76"/>
    <rect x="353" y="302" width="10" height="38"/>
    <rect x="388" y="323" width="10" height="17"/>
    <rect x="422" y="333" width="10" height="7"/>
    <rect x="457" y="338" width="10" height="2"/>
  </g>

  <path d="M70 340 L104 238 L139 193 L173 182 L208 189 L242 205 L277 224 L311 243 L346 261 L380 276 L414 289 L449 300 L483 309 L518 316 L552 322 L587 326 L621 331 L656 334 L690 336" fill="none" stroke="#2563eb" stroke-width="4"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <rect x="472" y="78" width="13" height="13" fill="#14b8a6" opacity="0.78"/>
    <text x="493" y="89">Binomial(20, 0.3): bounded count</text>
    <rect x="472" y="103" width="13" height="13" fill="#f97316" opacity="0.72"/>
    <text x="493" y="114">Poisson(4): count rate</text>
    <line x1="472" y1="136" x2="486" y2="136" stroke="#2563eb" stroke-width="4"/>
    <text x="493" y="140">Gamma(2, 3): wider right tail</text>
  </g>
</svg>
