<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy, precision, and recall from a confusion matrix</title>
  <desc id="desc">A thresholded binary classifier with TP equals 2, FN equals 2, FP equals 0, and TN equals 4. Accuracy is 0.75, precision is 1.00, and recall is 0.50.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .small { font-size: 15px; }
    .label { font-size: 17px; font-weight: 700; }
    .value { font-size: 28px; font-weight: 800; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>

  <text x="520" y="42" text-anchor="middle" font-size="28" font-weight="800">Thresholded metrics count decisions</text>
  <text x="520" y="74" text-anchor="middle" font-size="17" class="muted">At threshold 0.65, the same scores become one confusion matrix and three summaries.</text>

  <rect x="42" y="104" width="438" height="350" rx="14" class="panel"/>
  <text x="261" y="138" text-anchor="middle" font-size="22" font-weight="800">Confusion matrix</text>
  <text x="268" y="170" text-anchor="middle" class="label">
    <tspan x="268" dy="0">predicted</tspan>
    <tspan x="268" dy="19">positive</tspan>
  </text>
  <text x="406" y="170" text-anchor="middle" class="label">
    <tspan x="406" dy="0">predicted</tspan>
    <tspan x="406" dy="19">negative</tspan>
  </text>
  <text x="126" y="246" text-anchor="middle" class="label">actual positive</text>
  <text x="126" y="354" text-anchor="middle" class="label">actual negative</text>

  <rect x="208" y="204" width="120" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="346" y="204" width="120" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="208" y="314" width="120" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="346" y="314" width="120" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <text x="268" y="238" text-anchor="middle" class="value">TP</text>
  <text x="268" y="268" text-anchor="middle" font-size="21" font-weight="700">2</text>
  <text x="406" y="238" text-anchor="middle" class="value">FN</text>
  <text x="406" y="268" text-anchor="middle" font-size="21" font-weight="700">2</text>
  <text x="268" y="348" text-anchor="middle" class="value">FP</text>
  <text x="268" y="378" text-anchor="middle" font-size="21" font-weight="700">0</text>
  <text x="406" y="348" text-anchor="middle" class="value">TN</text>
  <text x="406" y="378" text-anchor="middle" font-size="21" font-weight="700">4</text>
  <text x="261" y="430" text-anchor="middle" font-size="16" class="muted">Only the thresholded labels enter these counts.</text>

  <rect x="522" y="104" width="476" height="350" rx="14" class="panel"/>
  <text x="760" y="138" text-anchor="middle" font-size="22" font-weight="800">Metric values</text>
  <line x1="660" y1="390" x2="860" y2="390" class="axis"/>
  <g class="grid">
    <line x1="660" y1="186" x2="660" y2="390"/>
    <line x1="710" y1="186" x2="710" y2="390"/>
    <line x1="760" y1="186" x2="760" y2="390"/>
    <line x1="810" y1="186" x2="810" y2="390"/>
    <line x1="860" y1="186" x2="860" y2="390"/>
  </g>
  <g class="small muted">
    <text x="660" y="413" text-anchor="middle">0</text>
    <text x="760" y="413" text-anchor="middle">0.5</text>
    <text x="860" y="413" text-anchor="middle">1.0</text>
  </g>

  <text x="554" y="210" class="label">accuracy</text>
  <rect x="660" y="188" width="150" height="30" rx="6" fill="#60a5fa"/>
  <text x="884" y="210" font-size="17" font-weight="700">6 / 8 = 0.75</text>

  <text x="554" y="282" class="label">precision</text>
  <rect x="660" y="260" width="200" height="30" rx="6" fill="#34d399"/>
  <text x="884" y="282" font-size="17" font-weight="700">2 / 2 = 1.00</text>

  <text x="554" y="354" class="label">recall</text>
  <rect x="660" y="332" width="100" height="30" rx="6" fill="#f97316"/>
  <text x="884" y="354" font-size="17" font-weight="700">2 / 4 = 0.50</text>
</svg>
