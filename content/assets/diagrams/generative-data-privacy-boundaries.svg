<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Data privacy boundaries in generative systems</title>
  <desc id="desc">Sensitive data is minimized, authorized, filtered, and redacted before it crosses prompts, retrieval, tools, memory, logs, or outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 27px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .label { font-size: 15px; font-weight: 800; }
    .small { font-size: 13px; fill: #374151; }
    .tiny { font-size: 12px; fill: #4b5563; }
    .source { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; }
    .gate { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.8; }
    .model { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.8; }
    .sink { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
    .danger { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.8; }
    .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 5 7; }
  </style>
  <text x="480" y="40" text-anchor="middle" class="title">Privacy is controlled at every data boundary</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Only task-necessary data should reach prompts, tools, memory, logs, or outputs.</text>

  <g transform="translate(38,116)">
    <rect width="158" height="72" rx="9" class="source"/>
    <text x="79" y="29" text-anchor="middle" class="label">raw data</text>
    <text x="79" y="52" text-anchor="middle" class="small">tickets, docs, profiles</text>
    <path d="M162 36 H220" class="arrow"/>

    <rect x="234" width="170" height="72" rx="9" class="gate"/>
    <text x="319" y="27" text-anchor="middle" class="label">minimize</text>
    <text x="319" y="50" text-anchor="middle" class="small">redact, hash, drop</text>
    <path d="M408 36 H468" class="arrow"/>

    <rect x="482" width="160" height="72" rx="9" class="model"/>
    <text x="562" y="29" text-anchor="middle" class="label">prompt</text>
    <text x="562" y="52" text-anchor="middle" class="small">task context only</text>
    <path d="M646 36 H706" class="arrow"/>

    <rect x="720" width="160" height="72" rx="9" class="sink"/>
    <text x="800" y="29" text-anchor="middle" class="label">answer</text>
    <text x="800" y="52" text-anchor="middle" class="small">audience filtered</text>
  </g>

  <path d="M217 224 H744 M217 224 V244 M480 224 V244 M744 224 V244" class="dash"/>
  <text x="480" y="218" text-anchor="middle" class="tiny">the same privacy policy gates every external surface</text>

  <g transform="translate(100,244)">
    <rect width="234" height="82" rx="9" class="gate"/>
    <text x="117" y="28" text-anchor="middle" class="label">retrieval ACLs</text>
    <text x="117" y="52" text-anchor="middle" class="small">tenant, role, document version</text>

    <rect x="263" width="234" height="82" rx="9" class="gate"/>
    <text x="380" y="28" text-anchor="middle" class="label">tool authorization</text>
    <text x="380" y="52" text-anchor="middle" class="small">object-level checks</text>

    <rect x="526" width="234" height="82" rx="9" class="gate"/>
    <text x="643" y="28" text-anchor="middle" class="label">memory policy</text>
    <text x="643" y="52" text-anchor="middle" class="small">write, retain, delete</text>
  </g>

  <path d="M480 326 V360" class="arrow"/>
  <rect x="250" y="366" width="460" height="58" rx="10" class="danger"/>
  <text x="480" y="390" text-anchor="middle" class="label">logs and traces are a second datastore</text>
  <text x="480" y="411" text-anchor="middle" class="small">sample, redact, restrict access, and expire them deliberately</text>
</svg>
