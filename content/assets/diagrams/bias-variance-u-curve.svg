<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" aria-labelledby="title desc">
  <title id="title">Test error is U-shaped in model complexity</title>
  <desc id="desc">As model complexity rises, squared bias falls and variance rises. Training error keeps dropping toward zero, but test error, the sum of bias squared, variance, and noise, falls then rises, with a minimum at intermediate complexity.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .small { font-size: 15px; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .best { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 5; }
    .bias { fill: none; stroke: #dc2626; stroke-width: 3; }
    .var { fill: none; stroke: #2563eb; stroke-width: 3; }
    .test { fill: none; stroke: #7c3aed; stroke-width: 4; }
    .train { fill: none; stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 7 5; }
  </style>

  <text x="340" y="32" text-anchor="middle" font-size="24" font-weight="800">The bias-variance trade-off</text>
  <text x="340" y="58" text-anchor="middle" font-size="16" class="muted">Test error = bias² + variance + noise, minimized at intermediate complexity.</text>

  <!-- axes -->
  <line class="axis" x1="80" y1="390" x2="620" y2="390"/>
  <line class="axis" x1="80" y1="80" x2="80" y2="390"/>

  <!-- best-complexity marker -->
  <line class="best" x1="350" y1="80" x2="350" y2="390"/>
  <text x="350" y="410" text-anchor="middle" class="small muted">best complexity</text>
  <text x="150" y="410" text-anchor="middle" class="small muted">underfit (high bias)</text>
  <text x="545" y="410" text-anchor="middle" class="small muted">overfit (high variance)</text>

  <!-- curves -->
  <polyline class="bias" points="80,194 147.5,243.6 215,280.8 350,330.4 485,358.3 552.5,366.4 620,370.7"/>
  <polyline class="var" points="80,373.8 147.5,368.8 215,361.4 350,336.6 485,268.4 552.5,225 620,169.2"/>
  <polyline class="train" points="80,181.6 147.5,243.6 215,280.8 350,330.4 485,361.4 552.5,370.7 620,376.9"/>
  <polyline class="test" points="80,156.8 147.5,201.4 215,231.2 350,256 485,215.7 552.5,180.4 620,128.9"/>
  <circle cx="350" cy="256" r="6" fill="#7c3aed"/>

  <!-- axis labels -->
  <text x="620" y="432" text-anchor="end" class="small muted">model complexity</text>
  <text x="40" y="235" text-anchor="middle" class="small muted" transform="rotate(-90 40 235)">error</text>

  <!-- legend -->
  <rect x="440" y="92" width="176" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line class="test" x1="456" y1="112" x2="486" y2="112"/><text x="494" y="117" class="small">test error</text>
  <line class="bias" x1="456" y1="134" x2="486" y2="134"/><text x="494" y="139" class="small">bias²</text>
  <line class="var" x1="456" y1="156" x2="486" y2="156"/><text x="494" y="161" class="small">variance</text>
  <line class="train" x1="456" y1="178" x2="486" y2="178"/><text x="494" y="183" class="small">training error</text>
</svg>
