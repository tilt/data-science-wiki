<svg xmlns="http://www.w3.org/2000/svg" width="930" height="420" viewBox="0 0 930 420" role="img" aria-labelledby="title desc">
  <title id="title">Autoencoder bottleneck</title>
  <desc id="desc">An input is encoded into a constrained latent code and decoded into a reconstruction; the reconstruction error trains the encoder and decoder.</desc>
  <rect width="930" height="420" fill="transparent"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <text x="465" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#111827">Autoencoders learn through reconstruction</text>
    <text x="465" y="72" text-anchor="middle" font-size="15" fill="#4b5563">The bottleneck forces the model to store useful information in a latent code.</text>

    <rect x="50" y="145" width="145" height="105" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="122" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">input</text>
    <text x="122" y="207" text-anchor="middle" font-size="14" fill="#374151">x</text>
    <text x="122" y="232" text-anchor="middle" font-size="13" fill="#374151">image, text, signal</text>

    <rect x="255" y="130" width="145" height="135" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="327" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">encoder</text>
    <text x="327" y="195" text-anchor="middle" font-size="13" fill="#374151">compress or mask</text>
    <text x="327" y="220" text-anchor="middle" font-size="13" fill="#374151">irrelevant detail</text>

    <rect x="465" y="157" width="120" height="78" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="525" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">latent code</text>
    <text x="525" y="213" text-anchor="middle" font-size="14" fill="#374151">z</text>

    <rect x="650" y="130" width="145" height="135" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="722" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">decoder</text>
    <text x="722" y="195" text-anchor="middle" font-size="13" fill="#374151">reconstruct from</text>
    <text x="722" y="220" text-anchor="middle" font-size="13" fill="#374151">the code</text>

    <rect x="835" y="145" width="55" height="105" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="862" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">x_hat</text>
    <text x="862" y="214" text-anchor="middle" font-size="12" fill="#374151">output</text>

    <path d="M197 198 L252 198" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>
    <path d="M402 198 L462 198" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>
    <path d="M587 198 L647 198" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>
    <path d="M797 198 L831 198" fill="none" stroke="#374151" stroke-width="2.3" marker-end="url(#arrow)"/>

    <path d="M860 260 C780 332 228 332 132 260" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <text x="465" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">reconstruction error trains both sides</text>
  </g>
</svg>
