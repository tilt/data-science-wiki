<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">Stable Diffusion latent pipeline</title>
  <desc id="desc">Stable Diffusion encodes images into latent space, denoises random latent noise under text conditioning, and decodes the final latent into pixels.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#1f2937"], [fill="#374151"], [fill="#4b5563"], [fill="#0f172a"], [fill="#020617"], [fill="#000000"] { fill: #f8fafc !important; }
      [stroke="#111827"], [stroke="#1f2937"], [stroke="#374151"], [stroke="#4b5563"], [stroke="#0f172a"], [stroke="#020617"], [stroke="#000000"] { stroke: #e5e7eb !important; }
    }
  </style>
  <rect width="940" height="430" fill="transparent"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="470" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">Stable Diffusion denoises in latent space</text>
  <text x="470" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">A text prompt steers an iterative denoising process before the latent is decoded to pixels.</text>

  <g font-family="Arial, sans-serif">
    <rect x="45" y="135" width="130" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">pixels</text>
    <rect x="75" y="180" width="70" height="35" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="110" y="260" text-anchor="middle" font-size="13" fill="#374151">training image x</text>

    <rect x="220" y="135" width="130" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="285" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">VAE encoder</text>
    <text x="285" y="198" text-anchor="middle" font-size="14" fill="#374151">z0 = E(x)</text>
    <text x="285" y="260" text-anchor="middle" font-size="13" fill="#374151">compressed latent</text>

    <rect x="395" y="135" width="130" height="100" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="460" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">add noise</text>
    <text x="460" y="198" text-anchor="middle" font-size="14" fill="#374151">z_t</text>
    <text x="460" y="260" text-anchor="middle" font-size="13" fill="#374151">training target</text>

    <rect x="570" y="115" width="150" height="140" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="645" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">denoiser</text>
    <text x="645" y="172" text-anchor="middle" font-size="13" fill="#374151">U-Net / transformer</text>
    <text x="645" y="199" text-anchor="middle" font-size="14" fill="#374151">eps_theta(z_t, t, c)</text>
    <path d="M610 225 C635 245 675 245 700 225" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="645" y="278" text-anchor="middle" font-size="13" fill="#374151">iterative denoising</text>

    <rect x="765" y="135" width="130" height="100" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="830" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">VAE decoder</text>
    <text x="830" y="198" text-anchor="middle" font-size="14" fill="#374151">x_hat = D(z0_hat)</text>
    <text x="830" y="260" text-anchor="middle" font-size="13" fill="#374151">generated image</text>

    <rect x="540" y="325" width="210" height="54" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="645" y="347" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">prompt encoder</text>
    <text x="645" y="368" text-anchor="middle" font-size="13" fill="#374151">text condition c via cross-attention</text>

    <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M176 185 L216 185"/>
      <path d="M351 185 L391 185"/>
      <path d="M526 185 L566 185"/>
      <path d="M722 185 L761 185"/>
      <path d="M645 324 L645 258"/>
    </g>
  </g>
</svg>
