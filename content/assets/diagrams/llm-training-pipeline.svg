<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">LLM training pipeline</title>
  <desc id="desc">A large language model is trained through data preparation, self-supervised pretraining, supervised instruction tuning, preference optimization, evaluation, and serving constraints.</desc>
  <rect width="980" height="430" fill="transparent"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">LLM training is staged</text>
  <text x="490" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Pretraining builds the base distribution; post-training shapes behavior for use.</text>

  <g font-family="Arial, sans-serif">
    <rect x="45" y="135" width="135" height="98" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="112" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">data</text>
    <text x="112" y="189" text-anchor="middle" font-size="13" fill="#374151">filter</text>
    <text x="112" y="211" text-anchor="middle" font-size="13" fill="#374151">deduplicate</text>

    <rect x="220" y="135" width="145" height="98" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="292" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">pretraining</text>
    <text x="292" y="191" text-anchor="middle" font-size="13" fill="#374151">next-token loss</text>
    <text x="292" y="211" text-anchor="middle" font-size="13" fill="#374151">-log p(x_t | x&lt;t)</text>

    <rect x="405" y="135" width="145" height="98" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="477" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">instruction tuning</text>
    <text x="477" y="191" text-anchor="middle" font-size="13" fill="#374151">demonstrations</text>
    <text x="477" y="211" text-anchor="middle" font-size="13" fill="#374151">assistant-token loss</text>

    <rect x="590" y="135" width="155" height="98" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="667" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">preference tuning</text>
    <text x="667" y="191" text-anchor="middle" font-size="13" fill="#374151">RLHF or DPO</text>
    <text x="667" y="211" text-anchor="middle" font-size="13" fill="#374151">reward and KL control</text>

    <rect x="785" y="135" width="145" height="98" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="857" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">evaluation</text>
    <text x="857" y="191" text-anchor="middle" font-size="13" fill="#374151">capability</text>
    <text x="857" y="211" text-anchor="middle" font-size="13" fill="#374151">safety and drift</text>

    <rect x="238" y="304" width="505" height="58" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="490" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">deployment constraints feed back into training</text>
    <text x="490" y="350" text-anchor="middle" font-size="13" fill="#374151">context length, tools, privacy, latency, quantization, domain tests</text>

    <g stroke="#374151" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <path d="M181 184 L216 184"/>
      <path d="M366 184 L401 184"/>
      <path d="M551 184 L586 184"/>
      <path d="M746 184 L781 184"/>
      <path d="M857 236 C835 300 765 333 747 333"/>
      <path d="M235 333 C145 326 100 270 105 237"/>
    </g>
  </g>
</svg>
