<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">The sigmoid activation and its derivative</title>
  <desc id="desc">The upper panel shows the sigmoid activation value from zero to one. The lower panel shows its derivative on a separate gradient scale from zero to one quarter.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #374151; }
    .small { font-size: 14px; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .guide { stroke: #f97316; stroke-width: 2; stroke-dasharray: 6 5; }
    .curve { fill: none; stroke: #2563eb; stroke-width: 4; }
    .deriv { fill: none; stroke: #16a34a; stroke-width: 3.5; }
    .point { fill: #f97316; stroke: #ffffff; stroke-width: 2; }
    .formula { fill: #111827; }
  </style>

  <text x="360" y="34" text-anchor="middle" font-size="24" font-weight="800">Sigmoid squeezes a score into (0, 1)</text>
  <text x="360" y="60" text-anchor="middle" font-size="16" class="muted">The activation saturates in the tails; the gradient peaks at x = 0.</text>

  <!-- upper panel: activation value -->
  <line class="grid" x1="90" y1="86" x2="650" y2="86"/>
  <line class="grid" x1="90" y1="181" x2="650" y2="181"/>
  <line class="grid" x1="90" y1="276" x2="650" y2="276"/>
  <line class="grid" x1="370" y1="86" x2="370" y2="276"/>
  <line class="axis" x1="90" y1="276" x2="650" y2="276"/>
  <line class="axis" x1="90" y1="86" x2="90" y2="276"/>
  <line class="guide" x1="90" y1="181" x2="650" y2="181"/>
  <line class="guide" x1="370" y1="86" x2="370" y2="276"/>

  <path class="curve" d="M 90 275.5 C 185 276 255 266 314 227 C 342 208 354 197 370 181 C 386 165 398 154 426 135 C 485 96 555 86 650 86.5"/>
  <circle class="point" cx="370" cy="181" r="6"/>

  <text x="80" y="91" text-anchor="end" class="small muted">1</text>
  <text x="80" y="186" text-anchor="end" class="small muted">0.5</text>
  <text x="80" y="281" text-anchor="end" class="small muted">0</text>
  <text x="36" y="181" text-anchor="middle" class="small muted" transform="rotate(-90 36 181)">activation value</text>
  <text x="458" y="164" font-size="18" font-weight="800" class="formula">σ(0) = 0.5</text>
  <text x="156" y="112" class="small muted">left tail: nearly 0</text>
  <text x="508" y="112" class="small muted">right tail: nearly 1</text>

  <!-- lower panel: derivative value -->
  <line class="grid" x1="90" y1="334" x2="650" y2="334"/>
  <line class="grid" x1="90" y1="394" x2="650" y2="394"/>
  <line class="grid" x1="90" y1="454" x2="650" y2="454"/>
  <line class="grid" x1="370" y1="324" x2="370" y2="454"/>
  <line class="axis" x1="90" y1="454" x2="650" y2="454"/>
  <line class="axis" x1="90" y1="324" x2="90" y2="454"/>
  <line class="guide" x1="370" y1="324" x2="370" y2="454"/>

  <path class="deriv" d="M 90 452.7 C 205 454 286 426 335 360 C 350 340 360 334 370 334 C 380 334 390 340 405 360 C 454 426 535 454 650 452.7"/>
  <circle class="point" cx="370" cy="334" r="5"/>

  <text x="80" y="339" text-anchor="end" class="small muted">0.25</text>
  <text x="80" y="459" text-anchor="end" class="small muted">0</text>
  <text x="36" y="394" text-anchor="middle" class="small muted" transform="rotate(-90 36 394)">gradient</text>
  <text x="420" y="336" class="small muted">σ'(x) = σ(x)(1 - σ(x))</text>
  <text x="420" y="358" class="small muted">maximum gradient is 0.25 at x = 0</text>

  <!-- shared x-axis labels -->
  <text x="90" y="482" text-anchor="middle" class="small muted">-6</text>
  <text x="370" y="482" text-anchor="middle" class="small muted">0</text>
  <text x="650" y="482" text-anchor="middle" class="small muted">6</text>
  <text x="370" y="506" text-anchor="middle" class="small muted">pre-activation x</text>
</svg>
