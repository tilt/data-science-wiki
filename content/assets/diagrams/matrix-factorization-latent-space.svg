<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Matrix factorization latent space</title>
  <desc id="desc">A two-dimensional latent space where user and item factors cluster by preference pattern, and dot products are high for aligned vectors.</desc>
  <style>
    .fg { fill: #111827; }
    .muted { fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #111827; stroke-width: 1.5; }
    .blue-text { fill: #1d4ed8; }
    .orange-text { fill: #c2410c; }
    .teal-text { fill: #0f766e; }
    .rose-text { fill: #be123c; }
    .blue-stroke { stroke: #2563eb; }
    .orange-stroke { stroke: #f97316; }
    .teal-stroke { stroke: #14b8a6; }
    .rose-stroke { stroke: #e11d48; }
    .blue-fill { fill: #2563eb; }
    .orange-fill { fill: #f97316; }
    .teal-fill { fill: #14b8a6; }
    .rose-fill { fill: #e11d48; }
    text { font-family: Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #f8fafc; }
      .muted { fill: #d1d5db; }
      .grid { stroke: #374151; }
      .axis { stroke: #e5e7eb; }
      .blue-text { fill: #bfdbfe; }
      .orange-text { fill: #fed7aa; }
      .teal-text { fill: #99f6e4; }
      .rose-text { fill: #fecdd3; }
      .blue-stroke { stroke: #8ab4ff; }
      .orange-stroke { stroke: #fb923c; }
      .teal-stroke { stroke: #5eead4; }
      .rose-stroke { stroke: #fb7185; }
      .blue-fill { fill: #8ab4ff; }
      .orange-fill { fill: #fb923c; }
      .teal-fill { fill: #5eead4; }
      .rose-fill { fill: #fb7185; }
    }
  </style>

  <rect x="0" y="0" width="760" height="460" fill="transparent"/>
  <text x="380" y="38" text-anchor="middle" font-size="23" font-weight="700" class="fg">Latent factors place users and items in the same space</text>
  <text x="380" y="64" text-anchor="middle" font-size="14" class="muted">Aligned user and item vectors have high dot products; opposite directions score low.</text>

  <g transform="translate(88,88)">
    <line x1="0" y1="220" x2="555" y2="220" class="axis"/>
    <line x1="278" y1="0" x2="278" y2="265" class="axis"/>
    <g class="grid">
      <line x1="0" y1="62" x2="555" y2="62"/>
      <line x1="0" y1="141" x2="555" y2="141"/>
      <line x1="0" y1="220" x2="555" y2="220"/>
      <line x1="117" y1="0" x2="117" y2="265"/>
      <line x1="438" y1="0" x2="438" y2="265"/>
    </g>
    <text x="278" y="294" text-anchor="middle" font-size="14" class="muted">latent factor 1: preference direction</text>
    <text x="-45" y="132" text-anchor="middle" transform="rotate(-90 -45 132)" font-size="14" class="muted">latent factor 2</text>

    <ellipse cx="122" cy="141" rx="98" ry="78" fill="#2563eb" opacity="0.09" class="blue-stroke" stroke-width="2"/>
    <ellipse cx="438" cy="141" rx="98" ry="78" fill="#f97316" opacity="0.10" class="orange-stroke" stroke-width="2"/>
    <text x="122" y="42" text-anchor="middle" font-size="13" class="blue-text">cluster: users/items 0-1</text>
    <text x="438" y="42" text-anchor="middle" font-size="13" class="orange-text">cluster: users/items 2-3</text>

    <line x1="278" y1="220" x2="112" y2="136" class="blue-stroke" stroke-width="2.5" marker-end="url(#arrow-blue)" opacity="0.9"/>
    <line x1="278" y1="220" x2="456" y2="129" class="orange-stroke" stroke-width="2.5" marker-end="url(#arrow-orange)" opacity="0.9"/>
    <path d="M112 136 C150 104, 174 103, 204 130" fill="none" class="teal-stroke" stroke-width="3"/>
    <path d="M112 136 C252 62, 356 68, 456 129" fill="none" class="rose-stroke" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="164" y="101" text-anchor="middle" font-size="13" class="teal-text">high score</text>
    <text x="304" y="70" text-anchor="middle" font-size="13" class="rose-text">low score</text>

    <g font-size="13" font-weight="700" class="fg">
      <circle cx="112" cy="136" r="8" class="blue-fill"/>
      <text x="98" y="123">U0</text>
      <circle cx="138" cy="165" r="8" class="blue-fill"/>
      <text x="148" y="182">U1</text>
      <rect x="194" y="122" width="16" height="16" class="teal-fill" transform="rotate(45 202 130)"/>
      <text x="214" y="133">I0</text>
      <rect x="169" y="167" width="16" height="16" class="teal-fill" transform="rotate(45 177 175)"/>
      <text x="188" y="182">I1</text>

      <circle cx="428" cy="157" r="8" class="orange-fill"/>
      <text x="414" y="179">U2</text>
      <circle cx="456" cy="129" r="8" class="orange-fill"/>
      <text x="463" y="117">U3</text>
      <rect x="478" y="143" width="16" height="16" class="rose-fill" transform="rotate(45 486 151)"/>
      <text x="498" y="156">I2</text>
      <rect x="444" y="185" width="16" height="16" class="rose-fill" transform="rotate(45 452 193)"/>
      <text x="464" y="198">I3</text>
    </g>
  </g>

  <g font-size="13" class="muted">
    <circle cx="666" cy="130" r="7" class="blue-fill"/>
    <text x="682" y="135" class="fg">user factor</text>
    <rect x="660" y="155" width="13" height="13" class="teal-fill" transform="rotate(45 666.5 161.5)"/>
    <text x="682" y="167" class="fg">item factor</text>
    <text x="380" y="432" text-anchor="middle" class="fg">Missing cells are inferred from geometry, not filled with zeros before fitting.</text>
  </g>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="blue-fill"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" class="orange-fill"/>
    </marker>
  </defs>
</svg>
