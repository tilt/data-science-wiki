<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
  <title id="title">Five-fold cross-validation rotates the validation block</title>
  <desc id="desc">Five rows, each split into five equal blocks. In each row a different block is the validation fold and the other four are training. The five validation scores are averaged into one cross-validation estimate.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .small { font-size: 15px; }
    .train { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
    .val { fill: #f97316; stroke: #c2410c; stroke-width: 1.5; }
    .cell { font-size: 13px; fill: #1e3a8a; }
    .valcell { font-size: 13px; fill: #ffffff; font-weight: 700; }
  </style>

  <text x="340" y="30" text-anchor="middle" font-size="23" font-weight="800">K-fold cross-validation (K = 5)</text>
  <text x="340" y="56" text-anchor="middle" font-size="15" class="muted">Each fold serves once as validation; the scores are averaged.</text>

  <!-- rows -->
  <!-- row template: y positions 80,128,176,224,272 ; blocks x 150..630 (5 blocks of 96) -->
  <!-- Row 1 -->
  <text x="140" y="102" text-anchor="end" class="small muted">split 1</text>
  <rect class="val"   x="150" y="82" width="96" height="34" rx="4"/><text x="198" y="104" text-anchor="middle" class="valcell">val</text>
  <rect class="train" x="246" y="82" width="96" height="34" rx="4"/><text x="294" y="104" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="342" y="82" width="96" height="34" rx="4"/><text x="390" y="104" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="438" y="82" width="96" height="34" rx="4"/><text x="486" y="104" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="534" y="82" width="96" height="34" rx="4"/><text x="582" y="104" text-anchor="middle" class="cell">train</text>
  <text x="646" y="104" class="small muted">s₁</text>

  <!-- Row 2 -->
  <text x="140" y="150" text-anchor="end" class="small muted">split 2</text>
  <rect class="train" x="150" y="130" width="96" height="34" rx="4"/><text x="198" y="152" text-anchor="middle" class="cell">train</text>
  <rect class="val"   x="246" y="130" width="96" height="34" rx="4"/><text x="294" y="152" text-anchor="middle" class="valcell">val</text>
  <rect class="train" x="342" y="130" width="96" height="34" rx="4"/><text x="390" y="152" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="438" y="130" width="96" height="34" rx="4"/><text x="486" y="152" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="534" y="130" width="96" height="34" rx="4"/><text x="582" y="152" text-anchor="middle" class="cell">train</text>
  <text x="646" y="152" class="small muted">s₂</text>

  <!-- Row 3 -->
  <text x="140" y="198" text-anchor="end" class="small muted">split 3</text>
  <rect class="train" x="150" y="178" width="96" height="34" rx="4"/><text x="198" y="200" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="246" y="178" width="96" height="34" rx="4"/><text x="294" y="200" text-anchor="middle" class="cell">train</text>
  <rect class="val"   x="342" y="178" width="96" height="34" rx="4"/><text x="390" y="200" text-anchor="middle" class="valcell">val</text>
  <rect class="train" x="438" y="178" width="96" height="34" rx="4"/><text x="486" y="200" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="534" y="178" width="96" height="34" rx="4"/><text x="582" y="200" text-anchor="middle" class="cell">train</text>
  <text x="646" y="200" class="small muted">s₃</text>

  <!-- Row 4 -->
  <text x="140" y="246" text-anchor="end" class="small muted">split 4</text>
  <rect class="train" x="150" y="226" width="96" height="34" rx="4"/><text x="198" y="248" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="246" y="226" width="96" height="34" rx="4"/><text x="294" y="248" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="342" y="226" width="96" height="34" rx="4"/><text x="390" y="248" text-anchor="middle" class="cell">train</text>
  <rect class="val"   x="438" y="226" width="96" height="34" rx="4"/><text x="486" y="248" text-anchor="middle" class="valcell">val</text>
  <rect class="train" x="534" y="226" width="96" height="34" rx="4"/><text x="582" y="248" text-anchor="middle" class="cell">train</text>
  <text x="646" y="248" class="small muted">s₄</text>

  <!-- Row 5 -->
  <text x="140" y="294" text-anchor="end" class="small muted">split 5</text>
  <rect class="train" x="150" y="274" width="96" height="34" rx="4"/><text x="198" y="296" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="246" y="274" width="96" height="34" rx="4"/><text x="294" y="296" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="342" y="274" width="96" height="34" rx="4"/><text x="390" y="296" text-anchor="middle" class="cell">train</text>
  <rect class="train" x="438" y="274" width="96" height="34" rx="4"/><text x="486" y="296" text-anchor="middle" class="cell">train</text>
  <rect class="val"   x="534" y="274" width="96" height="34" rx="4"/><text x="582" y="296" text-anchor="middle" class="valcell">val</text>
  <text x="646" y="296" class="small muted">s₅</text>

  <text x="340" y="344" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">CV score = (s₁ + s₂ + s₃ + s₄ + s₅) / 5</text>
</svg>
