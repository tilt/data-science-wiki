<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Reinforcement learning agent-environment loop</title>
  <desc id="desc">An agent observes state, chooses an action, receives reward and next state from the environment, and updates its policy or value estimate.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#1f2937"], [fill="#374151"], [fill="#4b5563"], [fill="#0f172a"], [fill="#020617"], [fill="#000000"] { fill: #f8fafc !important; }
      [stroke="#111827"], [stroke="#1f2937"], [stroke="#374151"], [stroke="#4b5563"], [stroke="#0f172a"], [stroke="#020617"], [stroke="#000000"] { stroke: #e5e7eb !important; }
    }
  </style>
  <rect width="900" height="420" fill="transparent"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="450" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Reinforcement learning is a feedback loop</text>
  <text x="450" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Actions change future states, so the learner must price delayed consequences.</text>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="145" width="230" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="205" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Agent</text>
    <text x="205" y="210" text-anchor="middle" font-size="14" fill="#374151">policy pi(a|s)</text>
    <text x="205" y="235" text-anchor="middle" font-size="14" fill="#374151">value estimate V(s) or Q(s,a)</text>

    <rect x="580" y="145" width="230" height="120" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="695" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Environment</text>
    <text x="695" y="210" text-anchor="middle" font-size="14" fill="#374151">transition P(s'|s,a)</text>
    <text x="695" y="235" text-anchor="middle" font-size="14" fill="#374151">reward R(s,a,s')</text>

    <path d="M322 180 C405 125 495 125 578 180" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="450" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">action A_t</text>

    <path d="M578 235 C495 310 405 310 322 235" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="450" y="319" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">next state S_t+1 and reward R_t+1</text>

    <rect x="330" y="170" width="240" height="76" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="450" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">learning signal</text>
    <text x="450" y="222" text-anchor="middle" font-size="13" fill="#374151">r + gamma V(s') - V(s) or policy advantage</text>
  </g>
</svg>
