<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">PCA chooses the axis of largest variance</title>
  <desc id="desc">An elongated centered point cloud with the first principal component running along the direction of greatest spread and the second component perpendicular to it.</desc>
  <style>
    .fg { fill: #111827; }
    .muted { fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #111827; stroke-width: 1.5; }
    .pc1-stroke { stroke: #2563eb; }
    .pc2-stroke { stroke: #f97316; }
    .point { fill: #14b8a6; opacity: 0.72; }
    .projection { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .pc1-text { fill: #1d4ed8; }
    .pc2-text { fill: #c2410c; }
    text { font-family: Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #f8fafc; }
      .muted { fill: #d1d5db; }
      .grid { stroke: #374151; }
      .axis { stroke: #e5e7eb; }
      .pc1-stroke { stroke: #8ab4ff; }
      .pc2-stroke { stroke: #fb923c; }
      .point { fill: #5eead4; opacity: 0.82; }
      .projection { stroke: #94a3b8; }
      .pc1-text { fill: #bfdbfe; }
      .pc2-text { fill: #fed7aa; }
    }
  </style>

  <rect x="0" y="0" width="760" height="460" fill="transparent"/>
  <text x="380" y="38" text-anchor="middle" font-size="23" font-weight="700" class="fg">PCA chooses directions by variance</text>
  <text x="380" y="64" text-anchor="middle" font-size="14" class="muted">The first component follows the longest spread; the second captures the remaining orthogonal spread.</text>

  <g transform="translate(100,86)">
    <line x1="0" y1="172" x2="560" y2="172" class="axis"/>
    <line x1="280" y1="0" x2="280" y2="300" class="axis"/>
    <g class="grid">
      <line x1="0" y1="72" x2="560" y2="72"/>
      <line x1="0" y1="272" x2="560" y2="272"/>
      <line x1="140" y1="0" x2="140" y2="300"/>
      <line x1="420" y1="0" x2="420" y2="300"/>
    </g>

    <ellipse cx="280" cy="172" rx="190" ry="54" transform="rotate(-28 280 172)" fill="#2563eb" opacity="0.08" class="pc1-stroke" stroke-width="2"/>

    <g class="projection">
      <line x1="144" y1="239" x2="160" y2="209"/>
      <line x1="200" y1="202" x2="212" y2="180"/>
      <line x1="246" y1="192" x2="259" y2="168"/>
      <line x1="306" y1="151" x2="318" y2="129"/>
      <line x1="382" y1="130" x2="400" y2="96"/>
      <line x1="444" y1="101" x2="462" y2="68"/>
    </g>

    <g class="point">
      <circle cx="136" cy="234" r="5"/>
      <circle cx="160" cy="221" r="5"/>
      <circle cx="181" cy="205" r="5"/>
      <circle cx="207" cy="209" r="5"/>
      <circle cx="229" cy="188" r="5"/>
      <circle cx="247" cy="197" r="5"/>
      <circle cx="270" cy="169" r="5"/>
      <circle cx="292" cy="166" r="5"/>
      <circle cx="316" cy="148" r="5"/>
      <circle cx="337" cy="156" r="5"/>
      <circle cx="359" cy="133" r="5"/>
      <circle cx="383" cy="122" r="5"/>
      <circle cx="407" cy="126" r="5"/>
      <circle cx="430" cy="103" r="5"/>
      <circle cx="458" cy="92" r="5"/>
      <circle cx="477" cy="75" r="5"/>
    </g>

    <line x1="104" y1="258" x2="486" y2="56" class="pc1-stroke" stroke-width="4" marker-end="url(#arrow-pc1)"/>
    <line x1="263" y1="92" x2="335" y2="228" class="pc2-stroke" stroke-width="4" marker-end="url(#arrow-pc2)"/>
    <circle cx="280" cy="172" r="4" class="fg"/>

    <text x="490" y="62" font-size="14" font-weight="700" class="pc1-text">PC1: maximum variance</text>
    <text x="345" y="231" font-size="14" font-weight="700" class="pc2-text">PC2: orthogonal residual variance</text>
    <text x="280" y="328" text-anchor="middle" font-size="14" class="muted">centered feature axis 1</text>
    <text x="-48" y="150" text-anchor="middle" transform="rotate(-90 -48 150)" font-size="14" class="muted">centered feature axis 2</text>
  </g>

  <text x="380" y="430" text-anchor="middle" font-size="13" class="fg">Projecting onto PC1 preserves the largest possible one-dimensional variance.</text>

  <defs>
    <marker id="arrow-pc1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-pc2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
