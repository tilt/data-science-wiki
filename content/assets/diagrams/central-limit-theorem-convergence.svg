<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Central limit theorem convergence</title>
  <desc id="desc">Density curves for standardized sample means become more symmetric and closer to a normal curve as sample size grows.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 24px; font-weight: 800; }
    .subtitle, .tick, .axis-label { fill: #374151; }
    .subtitle { font-size: 14px; }
    .tick { font-size: 12px; }
    .axis-label { font-size: 14px; }
    .legend { font-size: 13px; font-weight: 650; }
    .axis { stroke: #111827; stroke-width: 1.5; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .n2 { stroke: #f97316; }
    .n10 { stroke: #14b8a6; }
    .n50 { stroke: #2563eb; }
    .normal { stroke: #111827; }
    .curve { fill: none; stroke-width: 4; stroke-linecap: round; }
    .normal-curve { fill: none; stroke-width: 2; stroke-dasharray: 7 6; opacity: 0.72; }
  </style>
  <text x="380" y="36" text-anchor="middle" class="title">Standardized averages become more normal</text>
  <text x="380" y="60" text-anchor="middle" class="subtitle">Exponential observations are skewed; centered sample means smooth out as n increases.</text>
  <line x1="82" y1="342" x2="690" y2="342" class="axis"/>
  <line x1="82" y1="82" x2="82" y2="342" class="axis"/>
  <g class="grid">
    <line x1="82" y1="286" x2="690" y2="286"/>
    <line x1="82" y1="230" x2="690" y2="230"/>
    <line x1="82" y1="174" x2="690" y2="174"/>
    <line x1="82" y1="118" x2="690" y2="118"/>
    <line x1="386" y1="82" x2="386" y2="342"/>
  </g>
  <g class="tick">
    <text x="82" y="363" text-anchor="middle">-3</text>
    <text x="183" y="363" text-anchor="middle">-2</text>
    <text x="285" y="363" text-anchor="middle">-1</text>
    <text x="386" y="363" text-anchor="middle">0</text>
    <text x="487" y="363" text-anchor="middle">1</text>
    <text x="589" y="363" text-anchor="middle">2</text>
    <text x="690" y="363" text-anchor="middle">3</text>
    <text x="386" y="395" text-anchor="middle" class="axis-label">standardized mean</text>
    <text x="31" y="212" text-anchor="middle" transform="rotate(-90 31 212)" class="axis-label">relative density</text>
  </g>
  <path d="M82 342 C142 342 196 342 225 342 C248 326 269 233 314 166 C349 166 421 201 492 260 C560 316 632 339 690 342" class="curve n2" opacity="0.8"/>
  <path d="M82 342 C150 341 214 329 270 296 C314 256 336 172 354 170 C406 170 453 176 503 219 C564 277 622 326 690 341" class="curve n10" opacity="0.85"/>
  <path d="M82 342 C155 341 220 329 276 294 C323 262 346 181 372 176 C414 176 444 251 496 294 C550 330 617 341 690 342" class="curve n50"/>
  <path d="M82 342 C155 341 222 330 276 294 C326 260 346 176 386 176 C426 176 446 260 496 294 C550 330 617 341 690 342" class="normal normal-curve"/>
  <g class="legend">
    <line x1="514" y1="95" x2="542" y2="95" class="n2 curve" opacity="0.8"/>
    <text x="552" y="99">n = 2</text>
    <line x1="514" y1="120" x2="542" y2="120" class="n10 curve" opacity="0.85"/>
    <text x="552" y="124">n = 10</text>
    <line x1="514" y1="145" x2="542" y2="145" class="n50 curve"/>
    <text x="552" y="149">n = 50</text>
    <line x1="514" y1="170" x2="542" y2="170" class="normal normal-curve"/>
    <text x="552" y="174">normal reference</text>
  </g>
</svg>
