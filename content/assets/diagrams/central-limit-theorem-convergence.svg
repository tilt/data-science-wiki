<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Central limit theorem convergence</title>
  <desc id="desc">Density curves for standardized sample means become more symmetric and closer to a normal curve as sample size grows.</desc>
