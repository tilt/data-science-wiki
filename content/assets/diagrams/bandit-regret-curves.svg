<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
  <title id="title">Cumulative regret over time for greedy, epsilon-greedy, and UCB policies</title>
  <desc id="desc">Cumulative regret rises with the number of rounds. A pure greedy policy grows almost linearly because it can lock onto a suboptimal arm. Epsilon-greedy and UCB grow sublinearly, with UCB accumulating the least regret.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #374151; }
    .small { font-size: 15px; }
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .greedy { fill: none; stroke: #dc2626; stroke-width: 3.5; }
    .eps { fill: none; stroke: #2563eb; stroke-width: 3.5; }
    .ucb { fill: none; stroke: #16a34a; stroke-width: 3.5; }
    .label { fill: #111827; }
  </style>

  <text x="340" y="32" text-anchor="middle" font-size="24" font-weight="800">Cumulative regret by exploration policy</text>
  <text x="340" y="57" text-anchor="middle" font-size="15" class="muted">Regret is the reward lost versus always playing the best arm.</text>

  <!-- axes -->
  <line class="axis" x1="80" y1="360" x2="620" y2="360"/>
  <line class="axis" x1="80" y1="80" x2="80" y2="360"/>
  <text x="620" y="384" text-anchor="end" class="small muted">rounds →</text>
  <text x="44" y="220" text-anchor="middle" class="small muted" transform="rotate(-90 44 220)">cumulative regret</text>

  <!-- curves -->
  <path class="greedy" d="M 80 360 C 215 291 350 223 485 160 S 590 110 620 96"/>
  <path class="eps" d="M 80 360 C 215 307 350 270 485 239 S 590 220 620 212"/>
  <path class="ucb" d="M 80 360 C 215 318 350 297 485 278 S 590 268 620 265"/>

  <!-- end labels -->
  <text x="612" y="90" text-anchor="end" class="small label" font-weight="700">greedy</text>
  <text x="612" y="206" text-anchor="end" class="small label" font-weight="700">ε-greedy</text>
  <text x="612" y="255" text-anchor="end" class="small label" font-weight="700">UCB</text>

  <text x="150" y="150" class="small label">grows roughly linearly:</text>
  <text x="150" y="170" class="small label">can lock onto a bad arm</text>
  <text x="330" y="330" class="small label">sublinear: keeps trying, then settles</text>
</svg>
