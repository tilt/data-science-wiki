<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Gradient norms can vanish, stay stable, or explode across back-propagated layers</title>
  <desc id="desc">A log-scale line chart of gradient norm against layers traversed by backpropagation. Factors above one rise, factors near one stay flat, and factors below one decay.</desc>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 22px; font-weight: 800; }
    .subtitle, .axis-label, .tick { fill: #374151; }
    .subtitle { font-size: 15px; }
    .axis-label { font-size: 13px; }
    .tick { font-size: 12px; }
    .label { font-size: 14px; font-weight: 700; }
    .grid { stroke: #d9e2ec; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 2; }
    .explode { stroke: #dc2626; fill: #dc2626; }
    .stable { stroke: #0f766e; fill: #0f766e; }
    .vanish { stroke: #2563eb; fill: #2563eb; }
    .curve { fill: none; stroke-width: 3; stroke-linecap: round; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 6; }
  </style>

  <text x="400" y="32" text-anchor="middle" class="title">Gradient magnitude across back-propagated layers</text>
  <text x="400" y="58" text-anchor="middle" class="subtitle">Repeated Jacobian factors multiply: below 1 shrinks, near 1 preserves, above 1 amplifies.</text>

  <!-- chart frame -->
  <line class="axis" x1="86" y1="78" x2="86" y2="348"/>
  <line class="axis" x1="86" y1="348" x2="642" y2="348"/>

  <!-- horizontal log-scale grid -->
  <g class="grid">
    <line x1="86" y1="88" x2="642" y2="88"/>
    <line x1="86" y1="140" x2="642" y2="140"/>
    <line x1="86" y1="192" x2="642" y2="192"/>
    <line x1="86" y1="244" x2="642" y2="244"/>
    <line x1="86" y1="296" x2="642" y2="296"/>
    <line x1="86" y1="348" x2="642" y2="348"/>
  </g>

  <g class="tick" text-anchor="end">
    <text x="74" y="92">10^3</text>
    <text x="74" y="144">10^1</text>
    <text x="74" y="196">1</text>
    <text x="74" y="248">10^-2</text>
    <text x="74" y="300">10^-4</text>
    <text x="74" y="352">10^-5</text>
  </g>

  <g class="tick" text-anchor="middle">
    <text x="86" y="372">output layer</text>
    <text x="364" y="372">layers traversed by backpropagation</text>
    <text x="642" y="372">input layer</text>
  </g>
  <text x="28" y="214" text-anchor="middle" class="axis-label" transform="rotate(-90 28 214)">gradient norm (log scale)</text>

  <!-- all regimes start at unit scale, then compound differently -->
  <circle cx="86" cy="192" r="4" fill="#111827"/>
  <line class="guide" x1="86" y1="192" x2="642" y2="192"/>
  <path class="curve explode" d="M86 192 L642 91"/>
  <path class="curve stable" d="M86 192 L642 192"/>
  <path class="curve vanish" d="M86 192 L642 338"/>

  <!-- endpoint annotations -->
  <g class="label">
    <line x1="610" y1="98" x2="638" y2="98" class="explode curve"/>
    <text x="650" y="102" class="explode">exploding</text>
    <text x="650" y="121" class="tick">factors &gt; 1</text>

    <line x1="610" y1="192" x2="638" y2="192" class="stable curve"/>
    <text x="650" y="196" class="stable">stable</text>
    <text x="650" y="215" class="tick">factors near 1</text>

    <line x1="610" y1="329" x2="638" y2="329" class="vanish curve"/>
    <text x="650" y="333" class="vanish">vanishing</text>
    <text x="650" y="352" class="tick">factors &lt; 1</text>
  </g>

  <text x="400" y="412" text-anchor="middle" class="axis-label">On a log scale, geometric growth or decay becomes a straight line.</text>
</svg>
