<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">A support vector machine maximizes the margin around the decision boundary</title>
  <desc id="desc">Two classes of points separated by a vertical decision boundary. Dashed margin lines pass through the closest points of each class, the support vectors, and the gap between them is the margin of width two over the norm of w.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .small { font-size: 15px; }
    .axis { stroke: #cbd5e1; stroke-width: 1.5; }
    .boundary { stroke: #111827; stroke-width: 3; }
    .margin { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 5; }
    .pos { fill: #16a34a; }
    .neg { fill: #dc2626; }
    .sv { fill: none; stroke: #2563eb; stroke-width: 2.5; }
    .warrow { stroke: #7c3aed; stroke-width: 2.5; }
    .mspan { stroke: #c2410c; stroke-width: 2; }
  </style>

  <text x="320" y="32" text-anchor="middle" font-size="23" font-weight="800">Maximum-margin classifier</text>
  <text x="320" y="57" text-anchor="middle" font-size="15" class="muted">The boundary is placed as far as possible from the nearest points of each class.</text>

  <!-- faint axes -->
  <line class="axis" x1="80" y1="360" x2="560" y2="360"/>
  <line class="axis" x1="320" y1="80" x2="320" y2="372"/>

  <!-- margin lines at x = -2 and x = +2 -->
  <line class="margin" x1="200" y1="80" x2="200" y2="360"/>
  <line class="margin" x1="440" y1="80" x2="440" y2="360"/>
  <!-- decision boundary x = 0 -->
  <line class="boundary" x1="320" y1="80" x2="320" y2="360"/>
  <text x="320" y="392" text-anchor="middle" class="small">boundary: w·x + b = 0</text>

  <!-- margin width span -->
  <line class="mspan" x1="200" y1="115" x2="440" y2="115"/>
  <line class="mspan" x1="200" y1="108" x2="200" y2="122"/>
  <line class="mspan" x1="440" y1="108" x2="440" y2="122"/>
  <text x="320" y="104" text-anchor="middle" class="small" fill="#c2410c">margin = 2 / ‖w‖</text>

  <!-- w direction arrow -->
  <line class="warrow" x1="320" y1="250" x2="392" y2="250" marker-end="url(#wtip)"/>
  <text x="356" y="242" text-anchor="middle" class="small" fill="#6d28d9">w</text>
  <defs>
    <marker id="wtip" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- positive class points (right) with support vectors circled -->
  <circle class="pos" cx="440" cy="290" r="7"/><circle class="sv" cx="440" cy="290" r="12"/>
  <circle class="pos" cx="440" cy="150" r="7"/><circle class="sv" cx="440" cy="150" r="12"/>
  <circle class="pos" cx="500" cy="220" r="7"/>
  <text x="500" y="330" text-anchor="middle" class="small pos" fill="#15803d">class +1</text>

  <!-- negative class points (left) with support vectors circled -->
  <circle class="neg" cx="200" cy="290" r="7"/><circle class="sv" cx="200" cy="290" r="12"/>
  <circle class="neg" cx="200" cy="150" r="7"/><circle class="sv" cx="200" cy="150" r="12"/>
  <circle class="neg" cx="140" cy="220" r="7"/>
  <text x="150" y="330" text-anchor="middle" class="small neg" fill="#b91c1c">class −1</text>

  <!-- support vector legend -->
  <circle class="sv" cx="360" cy="404" r="9"/>
  <text x="376" y="409" class="small">support vectors (closest points)</text>
</svg>
