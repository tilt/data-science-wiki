<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="title desc">
  <title id="title">Trigger threshold crossing</title>
  <desc id="desc">A streaming probability curve crosses a 0.70 threshold at frame 5, two frames after the event starts at frame 3.</desc>
  <rect width="860" height="380" fill="transparent"/>
  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Trigger when enough evidence has arrived</text>
  <text x="430" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Lower thresholds reduce delay but increase false triggers.</text>
  <g transform="translate(95,95)" font-family="Arial, sans-serif">
    <line x1="0" y1="220" x2="680" y2="220" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#111827" stroke-width="2"/>
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="0" y1="66" x2="680" y2="66"/>
      <line x1="0" y1="110" x2="680" y2="110"/>
      <line x1="0" y1="176" x2="680" y2="176"/>
    </g>
    <line x1="0" y1="66" x2="680" y2="66" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="690" y="70" font-size="13" fill="#dc2626">threshold 0.70</text>
    <line x1="300" y1="220" x2="300" y2="0" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="300" y="-10" text-anchor="middle" font-size="13" fill="#166534">event starts</text>
    <line x1="500" y1="220" x2="500" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="500" y="-10" text-anchor="middle" font-size="13" fill="#1d4ed8">trigger</text>
    <polyline points="0,202.4 100,193.6 200,171.6 300,129.8 400,83.6 500,57.2 600,41.8" fill="none" stroke="#2563eb" stroke-width="4"/>
    <g fill="#2563eb">
      <circle cx="0" cy="202.4" r="5"/>
      <circle cx="100" cy="193.6" r="5"/>
      <circle cx="200" cy="171.6" r="5"/>
      <circle cx="300" cy="129.8" r="5"/>
      <circle cx="400" cy="83.6" r="5"/>
      <circle cx="500" cy="57.2" r="7"/>
      <circle cx="600" cy="41.8" r="5"/>
    </g>
    <text x="-35" y="10" font-size="13" fill="#374151">1.0</text>
    <text x="-35" y="70" font-size="13" fill="#374151">0.7</text>
    <text x="-28" y="224" font-size="13" fill="#374151">0</text>
    <g fill="#374151" font-size="13">
      <text x="0" y="244" text-anchor="middle">0</text>
      <text x="100" y="244" text-anchor="middle">1</text>
      <text x="200" y="244" text-anchor="middle">2</text>
      <text x="300" y="244" text-anchor="middle">3</text>
      <text x="400" y="244" text-anchor="middle">4</text>
      <text x="500" y="244" text-anchor="middle">5</text>
      <text x="600" y="244" text-anchor="middle">6</text>
      <text x="340" y="278" text-anchor="middle">frame</text>
    </g>
  </g>
</svg>
