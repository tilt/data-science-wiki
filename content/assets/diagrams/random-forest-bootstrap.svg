<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Random forest training with bootstrap samples</title>
  <desc id="desc">A training set is resampled into bootstrap samples. Each sample trains a tree with random feature subsets per split. The trees are averaged or majority-voted into one forest prediction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #4b5563; }
    .source { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .sample { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .tree { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
    .agg { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
    .link { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; }
    .small { font-size: 15px; }
  </style>

  <text x="560" y="38" text-anchor="middle" font-size="28" font-weight="800">Random forests decorrelate many trees</text>
  <text x="560" y="68" text-anchor="middle" font-size="17" class="muted">Bootstrap resampling changes the rows; feature subsampling changes the candidate splits.</text>

  <rect x="50" y="238" width="170" height="84" rx="14" class="source"/>
  <text x="135" y="272" text-anchor="middle" font-size="19" font-weight="800">training set</text>
  <text x="135" y="298" text-anchor="middle" class="small">rows + features</text>

  <rect x="358" y="118" width="168" height="62" rx="12" class="sample"/>
  <text x="442" y="156" text-anchor="middle" font-size="18" font-weight="800">sample 1</text>
  <rect x="358" y="249" width="168" height="62" rx="12" class="sample"/>
  <text x="442" y="287" text-anchor="middle" font-size="18" font-weight="800">sample 2</text>
  <rect x="358" y="380" width="168" height="62" rx="12" class="sample"/>
  <text x="442" y="418" text-anchor="middle" font-size="18" font-weight="800">sample B</text>

  <rect x="620" y="102" width="216" height="94" rx="12" class="tree"/>
  <text x="728" y="136" text-anchor="middle" font-size="19" font-weight="800">tree 1</text>
  <text x="728" y="162" text-anchor="middle" class="small">random feature subset</text>
  <text x="728" y="182" text-anchor="middle" class="small">at each split</text>
  <rect x="620" y="233" width="216" height="94" rx="12" class="tree"/>
  <text x="728" y="267" text-anchor="middle" font-size="19" font-weight="800">tree 2</text>
  <text x="728" y="293" text-anchor="middle" class="small">random feature subset</text>
  <text x="728" y="313" text-anchor="middle" class="small">at each split</text>
  <rect x="620" y="364" width="216" height="94" rx="12" class="tree"/>
  <text x="728" y="398" text-anchor="middle" font-size="19" font-weight="800">tree B</text>
  <text x="728" y="424" text-anchor="middle" class="small">random feature subset</text>
  <text x="728" y="444" text-anchor="middle" class="small">at each split</text>

  <rect x="928" y="229" width="142" height="102" rx="14" class="agg"/>
  <text x="999" y="264" text-anchor="middle" font-size="18" font-weight="800">aggregate</text>
  <text x="999" y="291" text-anchor="middle" class="small">average or</text>
  <text x="999" y="311" text-anchor="middle" class="small">majority vote</text>
  <rect x="928" y="386" width="142" height="60" rx="14" class="agg"/>
  <text x="999" y="423" text-anchor="middle" font-size="17" font-weight="800">prediction</text>

  <path d="M 220 267 C 266 218 309 168 352 154" class="link"/>
  <path d="M 220 280 L 352 280" class="link"/>
  <path d="M 220 293 C 266 342 309 392 352 406" class="link"/>
  <path d="M 526 149 L 614 149" class="link"/>
  <path d="M 526 280 L 614 280" class="link"/>
  <path d="M 526 411 L 614 411" class="link"/>
  <path d="M 836 149 C 882 178 905 212 923 247" class="link"/>
  <path d="M 836 280 L 922 280" class="link"/>
  <path d="M 836 411 C 884 380 905 347 923 314" class="link"/>
  <path d="M 999 331 L 999 380" class="link"/>

  <rect x="238" y="112" width="108" height="34" rx="8" class="chip"/>
  <text x="292" y="135" text-anchor="middle" class="small" font-weight="700">bootstrap</text>
  <rect x="238" y="222" width="108" height="34" rx="8" class="chip"/>
  <text x="292" y="245" text-anchor="middle" class="small" font-weight="700">bootstrap</text>
  <rect x="238" y="430" width="108" height="34" rx="8" class="chip"/>
  <text x="292" y="453" text-anchor="middle" class="small" font-weight="700">bootstrap</text>
  <line x1="442" y1="327" x2="442" y2="362" class="dash"/>
  <line x1="728" y1="335" x2="728" y2="356" class="dash"/>
</svg>
