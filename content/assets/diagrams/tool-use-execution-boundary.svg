<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Tool use execution boundary</title>
  <desc id="desc">The model proposes tool calls, the orchestrator validates and authorizes them, external systems execute outside the model, and observations return to the model.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f97316"/>
    </marker>
  </defs>
  <style>
    text {
      fill: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 28px; font-weight: 800; }
    .subtitle { font-size: 16px; fill: #4b5563; }
    .label { font-size: 16px; font-weight: 800; }
    .small { font-size: 13px; fill: #374151; }
    .tiny { font-size: 12px; fill: #475569; }
    .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .model { fill: #eef2ff; stroke: #2563eb; stroke-width: 2; }
    .runtime { fill: #ecfdf5; stroke: #0f766e; stroke-width: 2; }
    .tool { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
    .warn { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
    .obs { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .orange-arrow { stroke: #f97316; stroke-width: 2.4; fill: none; marker-end: url(#arrow-orange); }
    .boundary { stroke: #334155; stroke-width: 1.4; stroke-dasharray: 6 7; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  </style>

  <text x="480" y="42" text-anchor="middle" class="title">Tool use is a controlled execution boundary</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">The model proposes an action; application code validates, authorizes, executes, and records it.</text>

  <line x1="446" y1="100" x2="446" y2="526" class="boundary"/>
  <text x="318" y="112" text-anchor="middle" class="tiny">model side</text>
  <text x="602" y="112" text-anchor="middle" class="tiny">runtime side</text>

  <g transform="translate(62,132)">
    <rect width="318" height="112" rx="10" class="model"/>
    <text x="159" y="31" text-anchor="middle" class="label">1. model decision</text>
    <text x="28" y="61" class="small">Sees request, context, and eligible schemas.</text>
    <text x="28" y="85" class="code">tool_call: search_refund_policy({...})</text>
  </g>

  <path d="M381 188 H506" class="arrow"/>

  <g transform="translate(520,132)">
    <rect width="350" height="124" rx="10" class="runtime"/>
    <text x="175" y="31" text-anchor="middle" class="label">2. orchestrator checks</text>
    <text x="28" y="60" class="small">schema valid, semantic bounds, permissions</text>
    <text x="28" y="83" class="small">tenant access, side-effect policy, budgets</text>
    <text x="28" y="106" class="small">prompt-injection and data-handling controls</text>
  </g>

  <path d="M696 258 V318" class="arrow"/>

  <g transform="translate(520,332)">
    <rect width="350" height="104" rx="10" class="tool"/>
    <text x="175" y="31" text-anchor="middle" class="label">3. external execution</text>
    <text x="28" y="60" class="small">database, retriever, API, sandbox, workflow</text>
    <text x="28" y="81" class="small">runs outside the model with real credentials</text>
  </g>

  <path d="M520 384 C475 384 436 378 392 374" class="orange-arrow"/>

  <g transform="translate(62,312)">
    <rect width="318" height="118" rx="10" class="obs"/>
    <text x="159" y="31" text-anchor="middle" class="label">4. observation returns</text>
    <text x="28" y="61" class="small">Small, typed result with provenance.</text>
    <text x="28" y="85" class="small">Tool output is data, not new policy.</text>
    <text x="28" y="106" class="code">status: ok | denied | timeout</text>
  </g>

  <path d="M220 312 V258" class="arrow"/>

  <g transform="translate(270,480)">
    <rect width="420" height="72" rx="10" class="warn"/>
    <text x="210" y="23" text-anchor="middle" class="label">hard stop conditions</text>
    <text x="210" y="48" text-anchor="middle" class="small">invalid schema, denied permission, missing approval, max steps</text>
  </g>
</svg>
