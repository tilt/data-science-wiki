<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">The two-stage recommender funnel: candidate generation then ranking</title>
  <desc id="desc">A funnel narrows from the full catalog of millions of items, through cheap high-recall candidate generation to a few hundred candidates, then through expensive precise ranking to a top-k list of about ten items shown to the user.</desc>
  <style>
    text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #374151; }
    .small { font-size: 15px; }
    .z1 { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .z2 { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2; }
    .z3 { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 2; }
    .arrow { stroke: #c2410c; stroke-width: 2.5; }
    .zlabel { font-size: 17px; font-weight: 800; fill: #111827; }
    .callout { fill: #111827; }
  </style>

  <text x="360" y="34" text-anchor="middle" font-size="24" font-weight="800">The two-stage recommender funnel</text>
  <text x="360" y="58" text-anchor="middle" font-size="15" class="muted">Cheap retrieval narrows the catalog; expensive ranking orders what survives.</text>

  <!-- funnel zones -->
  <polygon class="z1" points="60,80 280,120 280,300 60,340"/>
  <polygon class="z2" points="280,120 470,155 470,265 280,300"/>
  <polygon class="z3" points="470,155 660,190 660,230 470,265"/>

  <!-- zone labels + counts -->
  <text x="168" y="205" text-anchor="middle" class="zlabel">Full catalog</text>
  <text x="168" y="228" text-anchor="middle" class="small muted">~10⁶ items</text>
  <text x="375" y="205" text-anchor="middle" class="zlabel">Candidates</text>
  <text x="375" y="228" text-anchor="middle" class="small muted">~10²</text>
  <text x="565" y="205" text-anchor="middle" class="zlabel" font-size="15">Top-k</text>
  <text x="565" y="226" text-anchor="middle" class="small muted">~10</text>

  <!-- transition labels -->
  <line class="arrow" x1="280" y1="356" x2="280" y2="316" marker-end="url(#tip)"/>
  <text x="280" y="373" text-anchor="middle" class="small" fill="#c2410c">candidate generation (cheap, high recall)</text>
  <line class="arrow" x1="470" y1="120" x2="470" y2="150" marker-end="url(#tip)"/>
  <text x="470" y="112" text-anchor="middle" class="small callout">ranking (expensive, precise)</text>

  <!-- user -->
  <text x="690" y="214" text-anchor="middle" font-size="26">🙂</text>
  <text x="676" y="256" text-anchor="end" class="small muted">shown</text>

  <defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
