<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="title desc">
  <title id="title">V-JEPA2 tubelets and RoPE geometry</title>
  <desc id="desc">Tubelet tokens come from time-height-width blocks. Kept RoI tokens preserve original indices before RoPE rotates queries and keys.</desc>
  <rect x="0" y="0" width="860" height="470" fill="transparent"/>
  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Tubelets keep video-grid geometry</text>
  <text x="430" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">RoPE should use original (t,h,w) indices, even after RoI token keep.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" fill="#111827">
    <text x="132" y="105" text-anchor="middle" font-size="15" font-weight="700">video grid</text>
    <text x="420" y="105" text-anchor="middle" font-size="15" font-weight="700">keep RoI tubelets</text>
    <text x="700" y="105" text-anchor="middle" font-size="15" font-weight="700">RoPE on original positions</text>
  </g>

  <g transform="translate(58,128)">
    <polygon points="40,20 178,20 218,60 80,60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <polygon points="40,20 80,60 80,210 40,170" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <polygon points="80,60 218,60 218,210 80,210" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <g stroke="#93c5fd" stroke-width="1">
      <line x1="114" y1="60" x2="114" y2="210"/>
      <line x1="149" y1="60" x2="149" y2="210"/>
      <line x1="183" y1="60" x2="183" y2="210"/>
      <line x1="80" y1="98" x2="218" y2="98"/>
      <line x1="80" y1="135" x2="218" y2="135"/>
      <line x1="80" y1="173" x2="218" y2="173"/>
    </g>
    <rect x="114" y="98" width="69" height="75" fill="#f97316" opacity="0.72" stroke="#9a3412" stroke-width="2"/>
    <text x="150" y="238" text-anchor="middle" font-size="13" fill="#374151">tubelet address (t,h,w)</text>
  </g>

  <g transform="translate(330,135)">
    <rect x="0" y="0" width="180" height="180" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="22" y="24" width="28" height="28"/>
      <rect x="58" y="24" width="28" height="28"/>
      <rect x="94" y="24" width="28" height="28"/>
      <rect x="130" y="24" width="28" height="28"/>
      <rect x="22" y="62" width="28" height="28"/>
      <rect x="58" y="62" width="28" height="28" fill="#f97316" stroke="#9a3412"/>
      <rect x="94" y="62" width="28" height="28" fill="#f97316" stroke="#9a3412"/>
      <rect x="130" y="62" width="28" height="28"/>
      <rect x="22" y="100" width="28" height="28"/>
      <rect x="58" y="100" width="28" height="28" fill="#f97316" stroke="#9a3412"/>
      <rect x="94" y="100" width="28" height="28" fill="#f97316" stroke="#9a3412"/>
      <rect x="130" y="100" width="28" height="28"/>
      <rect x="22" y="138" width="28" height="28"/>
      <rect x="58" y="138" width="28" height="28"/>
      <rect x="94" y="138" width="28" height="28"/>
      <rect x="130" y="138" width="28" height="28"/>
    </g>
    <text x="90" y="210" text-anchor="middle" font-size="13" fill="#374151">keep_ids select RoI tokens</text>
  </g>

  <g transform="translate(615,132)">
    <rect x="0" y="0" width="190" height="190" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="95" y="36" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#111827">q' = R(t,h,w) q</text>
    <text x="95" y="66" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#111827">k' = R(t,h,w) k</text>
    <circle cx="62" cy="118" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <path d="M62 118 L82 96" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="130" cy="118" r="30" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <path d="M130 118 L150 140" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="95" y="172" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#374151">rotation depends on original address</text>
  </g>

  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M285 220 L325 220"/>
    <path d="M515 220 L610 220"/>
  </g>

  <text x="430" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">Renumbering kept tokens as 0,1,2,... can make distant tubelets look adjacent.</text>
</svg>
