<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Stationarity and differencing</title>
  <desc id="desc">A level series with upward trend and a differenced series with stable mean.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc !important; }
      [fill="#111827"], [fill="#1f2937"], [fill="#374151"], [fill="#4b5563"], [fill="#0f172a"], [fill="#020617"], [fill="#000000"] { fill: #f8fafc !important; }
      [stroke="#111827"], [stroke="#1f2937"], [stroke="#374151"], [stroke="#4b5563"], [stroke="#0f172a"], [stroke="#020617"], [stroke="#000000"] { stroke: #e5e7eb !important; }
    }
  </style>
  <rect x="0" y="0" width="760" height="430" fill="transparent"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111827">Differencing can remove a changing mean</text>
  <text x="380" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">The toy level series trends upward; first differences are stable around 1.1.</text>
  <line x1="86" y1="324" x2="690" y2="324" stroke="#111827" stroke-width="1.5"/>
  <line x1="86" y1="92" x2="86" y2="324" stroke="#111827" stroke-width="1.5"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="86" y1="266" x2="690" y2="266"/>
    <line x1="86" y1="208" x2="690" y2="208"/>
    <line x1="86" y1="150" x2="690" y2="150"/>
  </g>
  <path d="M86 302 L153 276 L220 250 L287 224 L354 198 L421 172 L488 146 L555 120 L622 94 L690 68" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M153 206 L220 206 L287 206 L354 206 L421 206 L488 206 L555 206 L622 206 L690 206" fill="none" stroke="#f97316" stroke-width="4"/>
  <g fill="#2563eb"><circle cx="86" cy="302" r="4"/><circle cx="354" cy="198" r="4"/><circle cx="690" cy="68" r="4"/></g>
  <g fill="#f97316"><circle cx="153" cy="206" r="4"/><circle cx="421" cy="206" r="4"/><circle cx="690" cy="206" r="4"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <text x="86" y="350" text-anchor="middle">1</text>
    <text x="354" y="350" text-anchor="middle">5</text>
    <text x="690" y="350" text-anchor="middle">10</text>
    <text x="388" y="390" text-anchor="middle" font-size="14">time index</text>
    <line x1="506" y1="105" x2="534" y2="105" stroke="#2563eb" stroke-width="4"/>
    <text x="544" y="109">level y_t</text>
    <line x1="506" y1="130" x2="534" y2="130" stroke="#f97316" stroke-width="4"/>
    <text x="544" y="134">difference y_t - y_t-1</text>
  </g>
</svg>
