image: node:22.13.0-bookworm

stages:
  - validate
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npx quartz plugin install

validate:
  stage: validate
  script:
    - npm run validate:content
    - npm run check-links
    - npm run portability-check

deploy-pages:
  stage: deploy
  needs:
    - validate
  script:
    - export QUARTZ_BASE_URL="${CI_PAGES_URL#https://}"
    - export QUARTZ_BASE_URL="${QUARTZ_BASE_URL#http://}"
    - export QUARTZ_BASE_URL="${QUARTZ_BASE_URL%/}"
    - npm run patch-plugins
    - npm run quartz -- build
  pages: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: $CI_PAGES_URL
