name: External Links

# Network-dependent link-rot check. Kept separate from the blocking CI so a dead
# third-party URL never fails a content PR. Runs weekly and on demand; surfaces
# broken links in the job log for manual follow-up.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Check external links
        run: node scripts/check-external-links.mjs
